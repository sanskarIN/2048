name: Phase 18 localization duplicate fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/phase18-localization-fix.yml

permissions:
  contents: write

jobs:
  fix-localization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure commit identity
        run: |
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"

      - name: Remove duplicate Strategy translation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('lib/core/localization/hindi_translations.dart')
          text = path.read_text()
          needle = "  'Strategy': 'रणनीति',\n"
          if text.count(needle) != 2:
              raise SystemExit(f'Expected exactly two Strategy translations, found {text.count(needle)}')
          first = text.find(needle)
          second = text.find(needle, first + len(needle))
          text = text[:second] + text[second + len(needle):]
          path.write_text(text)
          PY
          git add lib/core/localization/hindi_translations.dart
          git commit -m "fix: remove duplicate solver Strategy translation"

      - name: Remove helper and push
        run: |
          git rm .github/workflows/phase18-localization-fix.yml
          git commit -m "chore: remove Phase 18 localization fix helper"
          git pull --rebase origin main
          git push origin HEAD:main
