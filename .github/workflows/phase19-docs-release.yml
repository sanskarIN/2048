name: Phase 19 release documentation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase19-docs-release.yml'

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure commit identity
        run: |
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
      - name: Update security
        env:
          BLOCK_B64: ""
        run: |
          if ! grep -q '^## Full Replay Archive input boundary$' SECURITY.md; then printf '\n' >> SECURITY.md; echo "$BLOCK_B64" | base64 --decode >> SECURITY.md; fi
          git add SECURITY.md
          git commit -m "docs: define full replay archive security boundary"
      - name: Update release checklist
        env:
          BLOCK_B64: ""
        run: |
          if ! grep -q '^## Phase 19 full replay archive qualification$' docs/RELEASE_CHECKLIST.md; then printf '\n' >> docs/RELEASE_CHECKLIST.md; echo "$BLOCK_B64" | base64 --decode >> docs/RELEASE_CHECKLIST.md; fi
          git add docs/RELEASE_CHECKLIST.md
          git commit -m "docs: add Phase 19 replay release checks"
      - name: Update platform guide
        env:
          BLOCK_B64: ""
        run: |
          if ! grep -q '^## Full Replay Archive platform behavior$' docs/PLATFORMS.md; then printf '\n' >> docs/PLATFORMS.md; echo "$BLOCK_B64" | base64 --decode >> docs/PLATFORMS.md; fi
          git add docs/PLATFORMS.md
          git commit -m "docs: document replay archive platform behavior"
      - name: Update CI guide
        env:
          BLOCK_B64: ""
        run: |
          if ! grep -q '^## Phase 19 replay archive gate scope$' docs/CI_CD.md; then printf '\n' >> docs/CI_CD.md; echo "$BLOCK_B64" | base64 --decode >> docs/CI_CD.md; fi
          git add docs/CI_CD.md
          git commit -m "docs: document Phase 19 CI scope"
      - name: Update backup documentation
        env:
          BLOCK_B64: ""
        run: |
          if ! grep -q '^## Interaction with Full Replay Archive$' docs/BACKUP_AND_RESTORE.md; then printf '\n' >> docs/BACKUP_AND_RESTORE.md; echo "$BLOCK_B64" | base64 --decode >> docs/BACKUP_AND_RESTORE.md; fi
          git add docs/BACKUP_AND_RESTORE.md
          git commit -m "docs: separate backup progress from full replay capture"
      - name: Remove helper and push
        run: |
          git rm .github/workflows/phase19-docs-release.yml
          git commit -m "chore: remove Phase 19 release documentation helper"
          git pull --rebase origin main
          git push origin main
