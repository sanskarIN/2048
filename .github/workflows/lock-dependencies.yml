name: Lock Flutter Dependencies

on:
  push:
    branches: [main]
    paths:
      - pubspec.yaml
      - pubspec.lock
      - .github/workflows/lock-dependencies.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lock-dependencies-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: false

      - name: Resolve dependency lockfile
        run: flutter pub get

      - name: Commit application lockfile
        run: |
          git add pubspec.lock
          if git diff --cached --quiet; then
            echo "Dependency lockfile is already current."
            exit 0
          fi
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
          git commit -m "build: lock Flutter dependencies"
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin main
          git push origin HEAD:main
