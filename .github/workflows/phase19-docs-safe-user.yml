name: Phase 19 safe user docs updates

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase19-docs-safe-user.yml'

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure commit identity
        run: |
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
      - name: Update user guide
        env:
          BLOCK_B64: ""
        run: |
          if ! grep -q '^## Full Replay Archive$' docs/USER_GUIDE.md; then printf '\n' >> docs/USER_GUIDE.md; echo "$BLOCK_B64" | base64 --decode >> docs/USER_GUIDE.md; fi
          git add docs/USER_GUIDE.md
          git commit -m "docs: add full replay archive user guide"
      - name: Update development guide
        env:
          BLOCK_B64: ""
        run: |
          if ! grep -q '^## Full Replay Archive development rules$' docs/DEVELOPMENT.md; then printf '\n' >> docs/DEVELOPMENT.md; echo "$BLOCK_B64" | base64 --decode >> docs/DEVELOPMENT.md; fi
          git add docs/DEVELOPMENT.md
          git commit -m "docs: define replay archive development rules"
      - name: Update FAQ
        env:
          BLOCK_B64: ""
        run: |
          if ! grep -q '^## What is Full Replay Archive?$' docs/FAQ.md; then printf '\n' >> docs/FAQ.md; echo "$BLOCK_B64" | base64 --decode >> docs/FAQ.md; fi
          git add docs/FAQ.md
          git commit -m "docs: answer full replay archive questions"
      - name: Update troubleshooting
        env:
          BLOCK_B64: ""
        run: |
          if ! grep -q '^## Copy full replay is disabled$' docs/TROUBLESHOOTING.md; then printf '\n' >> docs/TROUBLESHOOTING.md; echo "$BLOCK_B64" | base64 --decode >> docs/TROUBLESHOOTING.md; fi
          git add docs/TROUBLESHOOTING.md
          git commit -m "docs: add full replay archive troubleshooting"
      - name: Remove helper and push
        run: |
          git rm .github/workflows/phase19-docs-safe-user.yml
          git commit -m "chore: remove Phase 19 safe user docs helper"
          git pull --rebase origin main
          git push origin main
