name: Platform Builds

on:
  push:
    branches: [main]
    paths:
      - lib/**
      - assets/**
      - pubspec.yaml
      - pubspec.lock
      - android/**
      - ios/**
      - linux/**
      - macos/**
      - windows/**
      - .github/workflows/platform-builds.yml
  pull_request:
    branches: [main]
    paths:
      - lib/**
      - assets/**
      - pubspec.yaml
      - pubspec.lock
      - android/**
      - ios/**
      - linux/**
      - macos/**
      - windows/**
      - .github/workflows/platform-builds.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-builds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android release APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release

  linux:
    name: Linux release
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build prerequisites
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev liblzma-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - run: flutter build linux --release

  windows:
    name: Windows release
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release

  apple:
    name: macOS and unsigned iOS release
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
      - name: Build macOS release
        run: flutter build macos --release
      - name: Build iOS release without signing
        run: flutter build ios --release --no-codesign
