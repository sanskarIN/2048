# Phase 25 requalification trigger: dependency/toolchain maintenance is validated on every hosted native target.
name: Platform Builds

on:
  push:
    branches: [main]
    paths:
      - lib/**
      - assets/**
      - pubspec.yaml
      - pubspec.lock
      - android/**
      - ios/**
      - linux/**
      - macos/**
      - windows/**
      - .github/workflows/platform-builds.yml
  pull_request:
    branches: [main]
    paths:
      - lib/**
      - assets/**
      - pubspec.yaml
      - pubspec.lock
      - android/**
      - ios/**
      - linux/**
      - macos/**
      - windows/**
      - .github/workflows/platform-builds.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-builds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android release APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: false
      - run: flutter pub get
      - name: Verify dependency lockfile is synchronized
        run: git diff --exit-code -- pubspec.lock
      - run: flutter build apk --release
      - name: Create Android checksum
        run: >-
          sha256sum build/app/outputs/flutter-apk/app-release.apk
          > build/app/outputs/flutter-apk/app-release.apk.sha256
      - name: Upload Android qualification artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nova-2048-android-release
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux release
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Linux build prerequisites
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev liblzma-dev
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: false
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - name: Verify Linux generated dependency files are synchronized
        run: >-
          git diff --exit-code --
          pubspec.lock
          linux/flutter/generated_plugin_registrant.cc
          linux/flutter/generated_plugins.cmake
      - run: flutter build linux --release
      - name: Package Linux release and checksum
        run: |
          tar -C build/linux/x64/release -czf nova-2048-linux-x64.tar.gz bundle
          sha256sum nova-2048-linux-x64.tar.gz > nova-2048-linux-x64.tar.gz.sha256
      - name: Upload Linux qualification artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nova-2048-linux-x64-release
          path: |
            nova-2048-linux-x64.tar.gz
            nova-2048-linux-x64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows release
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: false
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - name: Verify Windows generated dependency files are synchronized
        run: >-
          git diff --exit-code --
          pubspec.lock
          windows/flutter/generated_plugin_registrant.cc
          windows/flutter/generated_plugins.cmake
      - run: flutter build windows --release
      - name: Package Windows release and checksum
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath nova-2048-windows-x64.zip -Force
          $hash = (Get-FileHash nova-2048-windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  nova-2048-windows-x64.zip" | Out-File -Encoding ascii nova-2048-windows-x64.zip.sha256
      - name: Upload Windows qualification artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nova-2048-windows-x64-release
          path: |
            nova-2048-windows-x64.zip
            nova-2048-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14

  apple:
    name: macOS and unsigned iOS release
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: false
      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
      - name: Verify Apple generated dependency files are synchronized
        run: >-
          git diff --exit-code --
          pubspec.lock
          macos/Flutter/GeneratedPluginRegistrant.swift
      - name: Build macOS release
        run: flutter build macos --release
      - name: Build iOS release without signing
        run: flutter build ios --release --no-codesign
      - name: Package Apple releases and checksums
        shell: bash
        run: |
          set -euo pipefail
          macos_app="$(find build/macos/Build/Products/Release -maxdepth 1 -type d -name '*.app' -print -quit)"
          ios_app="$(find build/ios/iphoneos -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$macos_app"
          test -n "$ios_app"
          ditto -c -k --sequesterRsrc --keepParent "$macos_app" nova-2048-macos-release.zip
          ditto -c -k --sequesterRsrc --keepParent "$ios_app" nova-2048-ios-unsigned-release.zip
          shasum -a 256 nova-2048-macos-release.zip > nova-2048-macos-release.zip.sha256
          shasum -a 256 nova-2048-ios-unsigned-release.zip > nova-2048-ios-unsigned-release.zip.sha256
      - name: Upload macOS qualification artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nova-2048-macos-release
          path: |
            nova-2048-macos-release.zip
            nova-2048-macos-release.zip.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Upload unsigned iOS qualification artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nova-2048-ios-unsigned-release
          path: |
            nova-2048-ios-unsigned-release.zip
            nova-2048-ios-unsigned-release.zip.sha256
          if-no-files-found: error
          retention-days: 14
