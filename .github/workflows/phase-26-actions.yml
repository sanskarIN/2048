name: Phase 26 evidence finalizer

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/phase-26-actions.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main with v7
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Configure commit identity
        run: |
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"

      - name: Apply verified Phase 26 evidence updates
        run: python3 tool/phase26_actions.py

      - name: Commit CI/CD documentation
        run: |
          git add docs/CI_CD.md
          git commit -m "docs: document maintained Actions runtime baseline"

      - name: Commit supply-chain documentation
        run: |
          git add docs/SUPPLY_CHAIN.md
          git commit -m "docs: record Dependency Review v5 evidence"

      - name: Commit release-facing changelog
        run: |
          git add CHANGELOG.md
          git commit -m "docs: record Phase 26 Actions hardening"

      - name: Commit documentation index
        run: |
          git add docs/README.md
          git commit -m "docs: index Phase 26 verification record"

      - name: Commit compact verification record
        run: |
          git add docs/VERIFICATION.md
          git commit -m "docs: record Phase 26 current verification"

      - name: Commit native artifact evidence
        run: |
          git add docs/RELEASE_ARTIFACTS.md
          git commit -m "docs: record Phase 26 checkout-v7 artifacts"

      - name: Commit continuity log
        run: |
          git add what_changed.md
          git commit -m "docs: record Phase 26 runtime continuity"

      - name: Verify only temporary Phase 26 files remain unchanged
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git status --short
            exit 1
          fi

      - name: Push finalized evidence commits
        run: git push origin HEAD:main
