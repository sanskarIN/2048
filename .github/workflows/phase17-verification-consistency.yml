name: Phase 17 verification consistency fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/phase17-verification-consistency.yml

permissions:
  contents: write

jobs:
  fix-verification-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure commit identity
        run: |
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"

      - name: Remove superseded native-matrix wording
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/VERIFICATION.md')
          text = path.read_text()
          old = 'The Web build emitted a non-fatal Cupertino icon-font availability warning but still produced `build/web`. This automated result does not replace physical-device, assistive-technology, signing/provisioning, or store-metadata qualification. The previously recorded Phase 16 native build matrix remains the latest native multi-platform evidence until a newer matrix is run.'
          new = 'The Web build emitted a non-fatal Cupertino icon-font availability warning but still produced `build/web`. This automated result does not replace physical-device, assistive-technology, signing/provisioning, or store-metadata qualification. The newer current-source Phase 17 native matrix recorded above supersedes the Phase 16 matrix as the latest hosted multi-platform build evidence.'
          if text.count(old) != 1:
              raise SystemExit('Expected superseded verification sentence not found exactly once')
          path.write_text(text.replace(old, new, 1))
          PY
          git add docs/VERIFICATION.md
          git commit -m "docs: remove superseded Phase 16 matrix wording"

      - name: Remove temporary helper and push
        run: |
          git rm .github/workflows/phase17-verification-consistency.yml
          git commit -m "chore: remove verification consistency helper"
          git pull --rebase origin main
          git push origin HEAD:main
