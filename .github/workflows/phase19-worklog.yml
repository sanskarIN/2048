name: Phase 19 detailed work log

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase19-worklog.yml'

permissions:
  contents: write

jobs:
  worklog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure commit identity
        run: |
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
      - name: Append Phase 19 work log
        env:
          BLOCK_B64: ""
        run: |
          if ! grep -q '^# Phase 19 — Portable Full-Session Replay Archives$' what_changed.md; then printf '\n' >> what_changed.md; echo "$BLOCK_B64" | base64 --decode >> what_changed.md; fi
          git add what_changed.md
          git commit -m "docs: record Phase 19 replay implementation log"
      - name: Remove helper and push
        run: |
          git rm .github/workflows/phase19-worklog.yml
          git commit -m "chore: remove Phase 19 work log helper"
          git pull --rebase origin main
          git push origin main
