name: Phase 25 maintenance

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/phase-25-maintenance.yml

permissions:
  contents: write

jobs:
  maintain:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Configure commit identity
        run: |
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply Phase 25 maintenance updates
        run: python3 tool/phase25_maintenance.py

      - name: Resolve updated dependencies
        run: flutter pub get

      - name: Migrate Dart sources to the maintained formatter
        run: dart format lib test tool

      - name: Verify dependency metadata is stable after resolution
        run: flutter pub get && git diff --exit-code -- analysis_options.yaml

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Analyze upgraded lint set
        run: flutter analyze

      - name: Run complete Flutter tests
        run: flutter test

      - name: Verify Version 1.5 candidate gate
        run: dart run tool/release_readiness.dart --json

      - name: Verify stable gate remains fail-closed
        shell: bash
        run: |
          if dart run tool/release_readiness.dart --stable --json; then
            echo "Stable gate unexpectedly passed without completed real-world qualification."
            exit 1
          fi

      - name: Smoke-test deterministic solver benchmark
        run: dart run tool/solver_benchmark.dart 8

      - name: Build Web release without missing-font warnings
        shell: bash
        run: |
          set -o pipefail
          flutter build web --release 2>&1 | tee web-build.log
          if grep -F "Expected to find fonts for" web-build.log; then
            echo "Web build emitted a missing icon-font warning."
            exit 1
          fi

      - name: Commit Phase 25 files separately
        shell: bash
        run: |
          set -euo pipefail
          commit_file() {
            path="$1"
            message="$2"
            git add -- "$path"
            if ! git diff --cached --quiet; then
              git commit -m "$message"
            fi
          }

          commit_file pubspec.yaml "build: align Version 1.5 SDK and dependency floors"
          commit_file pubspec.lock "build: refresh Flutter dependency lockfile"
          commit_file test/repository_integrity_test.dart "test: harden supply-chain repository integrity"

          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            commit_file "$path" "style: format $path for Dart 3.9"
          done < <(git diff --name-only -- lib test tool | grep -E '\.dart$' || true)

          commit_file SECURITY.md "docs: align security policy with Version 1.5"
          commit_file README.md "docs: declare maintained Flutter and Dart floors"
          commit_file docs/DEVELOPMENT.md "docs: align development toolchain requirements"
          commit_file docs/DEPENDENCIES.md "docs: refresh Version 1.5 dependency policy"
          commit_file docs/SUPPLY_CHAIN.md "docs: add supply-chain maintenance guide"
          commit_file docs/README.md "docs: index supply-chain maintenance guide"
          commit_file CHANGELOG.md "docs: record Phase 25 maintenance hardening"

      - name: Record Phase 25 continuity
        shell: bash
        run: |
          {
            echo
            echo "---"
            echo
            echo "## Phase 25 — Dependency and supply-chain maintenance hardening (2026-08-16)"
            echo
            echo "- Corrected Dependabot maintenance to cover Pub, Android Gradle, and GitHub Actions without requiring the missing custom dependencies label."
            echo "- Added pull-request dependency review that fails on newly introduced high-severity vulnerable dependency changes."
            echo "- Added CODEOWNERS coverage for default, release, dependency, automation, and platform-sensitive paths."
            echo "- Raised the maintained Version 1.5 toolchain floor to Dart >=3.9 and Flutter >=3.35 so pubspec no longer advertises SDKs that cannot resolve the maintained direct dependency set."
            echo "- Updated cupertino_icons to 1.0.9, shared_preferences to ^2.5.5, and flutter_lints to ^6.0.0 while keeping file_picker 11.0.2, qr_flutter 4.1.0, and url_launcher ^6.3.2."
            echo "- Migrated repository Dart formatting to the canonical Dart 3.9+ formatter style and kept formatting-only changes isolated in per-file commits."
            echo "- Added four repository-integrity regressions for SDK/dependency floors, supply-chain automation, CODEOWNERS, and the Version 1.5 security policy."
            echo "- Added docs/SUPPLY_CHAIN.md and synchronized README, DEVELOPMENT, DEPENDENCIES, SECURITY, documentation index, and CHANGELOG."
            echo "- Validation passed dependency resolution, canonical formatting, static analysis under flutter_lints 6, the complete Flutter test suite, Version 1.5 candidate gate, expected-closed stable gate, deterministic solver smoke, and warning-enforced Web release build before push."
            echo "- Real-device/accessibility/handler/signing qualification remains 0/13; no hosted automation evidence was substituted for those checks."
          } >> what_changed.md
          git add what_changed.md
          git commit -m "docs: record Phase 25 maintenance continuity"

      - name: Remove temporary Phase 25 tooling
        shell: bash
        run: |
          git rm tool/phase25_maintenance.py
          git commit -m "chore: remove Phase 25 maintenance script"
          git rm .github/workflows/phase-25-maintenance.yml
          git commit -m "chore: remove Phase 25 maintenance workflow"

      - name: Verify clean generated result
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git status --short
            exit 1
          fi

      - name: Push validated Phase 25 commits
        run: git push origin HEAD:main
