name: Phase 28 documentation finalizer

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/phase-28-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0

      - name: Configure commit identity
        run: |
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"

      - name: Apply verified Phase 28 documentation updates
        run: python3 tool/phase28_finalize.py

      - name: Commit continuity log
        run: |
          git add what_changed.md
          git commit -m "docs: record Phase 28 workflow security continuity"

      - name: Commit compact verification
        run: |
          git add docs/VERIFICATION.md
          git commit -m "docs: record Phase 28 current verification"

      - name: Commit artifact ledger
        run: |
          git add docs/RELEASE_ARTIFACTS.md
          git commit -m "docs: record Phase 28 hosted artifacts"

      - name: Commit documentation index
        run: |
          git add docs/README.md
          git commit -m "docs: index Phase 28 security records"

      - name: Commit CI/CD guide
        run: |
          git add docs/CI_CD.md
          git commit -m "docs: document immutable CI execution baseline"

      - name: Commit changelog
        run: |
          git add CHANGELOG.md
          git commit -m "docs: record Phase 28 supply-chain hardening"

      - name: Verify clean generated result
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git status --short
            exit 1
          fi

      - name: Push Phase 28 documentation commits
        run: git push origin HEAD:main
