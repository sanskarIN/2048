name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, analyze, test, release gate, web build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Verify Flutter-managed metadata is synchronized
        run: git diff --exit-code -- pubspec.lock analysis_options.yaml

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Static analysis
        run: flutter analyze

      - name: Run tests
        run: flutter test --coverage

      - name: Verify release-candidate readiness metadata
        run: dart run tool/release_readiness.dart --json

      - name: Verify release promotion boundary
        shell: bash
        run: |
          version="$(awk '/^version:/{print $2}' pubspec.yaml)"
          if [[ "$version" == 0.9.* ]]; then
            if dart run tool/release_readiness.dart --stable --json; then
              echo "Stable release gate unexpectedly passed for release-candidate version $version."
              exit 1
            fi
            echo "Stable release gate correctly remains closed for release-candidate version $version."
          else
            dart run tool/release_readiness.dart --stable --json
          fi

      - name: Smoke-test deterministic solver benchmark
        run: dart run tool/solver_benchmark.dart 8

      - name: Build web release without missing-font warnings
        shell: bash
        run: |
          set -o pipefail
          flutter build web --release 2>&1 | tee web-build.log
          if grep -F "Expected to find fonts for" web-build.log; then
            echo "Web build completed with a missing icon-font asset warning."
            exit 1
          fi
