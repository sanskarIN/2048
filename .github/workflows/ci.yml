name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, analyze, test, release gates, audits, web build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: false

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Verify Flutter-managed metadata is synchronized
        run: git diff --exit-code -- pubspec.lock analysis_options.yaml

      - name: Verify formatting
        shell: bash
        run: |
          set +e
          dart format --output=none --set-exit-if-changed lib test tool
          format_status=$?
          set -e

          if [[ "$format_status" -ne 0 ]]; then
            echo "::group::Required Dart formatter changes"
            dart format lib test tool
            git diff -- lib test tool
            echo "::endgroup::"
            exit "$format_status"
          fi

      - name: Static analysis
        run: flutter analyze

      - name: Run tests
        run: flutter test --coverage

      - name: Verify release-candidate readiness metadata
        shell: bash
        run: |
          set -o pipefail
          dart run tool/release_readiness.dart --json | tee release-readiness.json

      - name: Report manual qualification status
        shell: bash
        run: |
          set -o pipefail
          dart run tool/release_qualification_status.dart --json --pending-only | tee release-qualification-status.json

      - name: Audit repository integrity and local documentation links
        shell: bash
        run: |
          set -o pipefail
          dart run tool/repository_audit.dart --json | tee repository-audit.json

      - name: Audit six-target cross-platform support
        shell: bash
        run: |
          set -o pipefail
          dart run tool/platform_support_audit.dart --json | tee platform-support-audit.json

      - name: Audit final source-completion contract
        shell: bash
        run: |
          set -o pipefail
          dart run tool/source_completion_audit.dart --json | tee source-completion-audit.json

      - name: Upload machine-readable source audit reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nova-2048-source-audit-reports
          path: |
            release-readiness.json
            release-qualification-status.json
            repository-audit.json
            platform-support-audit.json
            source-completion-audit.json
          if-no-files-found: error
          retention-days: 14

      - name: Verify stable gate remains fail-closed
        shell: bash
        run: |
          set +e
          dart run tool/release_readiness.dart --stable --json
          stable_status=$?
          set -e

          if grep -Eq '"status": "(pending|blocked)"' docs/release_qualification.json; then
            if [[ "$stable_status" -eq 0 ]]; then
              echo "Stable release gate unexpectedly passed with incomplete manual qualification."
              exit 1
            fi
            echo "Stable release gate correctly remains closed while manual qualification is incomplete."
          elif [[ "$stable_status" -eq 0 ]]; then
            echo "Stable release gate is open: metadata and all recorded manual evidence are complete."
          else
            echo "Manual evidence is complete, but stable-release metadata is not finalized yet."
          fi

      - name: Smoke-test deterministic solver benchmark
        run: dart run tool/solver_benchmark.dart 8

      - name: Build web release without missing-font warnings
        shell: bash
        run: |
          set -o pipefail
          flutter build web --release 2>&1 | tee web-build.log
          if grep -F "Expected to find fonts for" web-build.log; then
            echo "Web build completed with a missing icon-font asset warning."
            exit 1
          fi
