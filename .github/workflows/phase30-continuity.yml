name: Phase 30 Documentation Finalizer

on:
  push:
    branches: [main]
    paths:
      - docs/PHASE_30_INDEX_TRIGGER.md

permissions:
  contents: write

concurrency:
  group: phase30-documentation-finalizer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Finalize indexes, current phase, and remove helper
        shell: bash
        run: |
          git pull --rebase origin main

          python3 - <<'PY'
          from pathlib import Path

          def insert_after(path, marker, insertion, sentinel):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if sentinel in text:
                  return
              if marker not in text:
                  raise SystemExit(f'marker not found in {path}: {marker!r}')
              file.write_text(text.replace(marker, marker + insertion, 1), encoding='utf-8')

          insert_after(
              'README.md',
              '| Release qualification gate | [`docs/RELEASE_QUALIFICATION.md`](docs/RELEASE_QUALIFICATION.md) |',
              '\n| Qualification evidence recorder | [`docs/QUALIFICATION_RECORDER.md`](docs/QUALIFICATION_RECORDER.md) |',
              'docs/QUALIFICATION_RECORDER.md',
          )

          insert_after(
              'docs/README.md',
              '| [`RELEASE_QUALIFICATION.md`](RELEASE_QUALIFICATION.md) | Evidence manifest, candidate/stable readiness commands, fail-closed promotion rules, and stable-release sequence. |',
              '\n| [`QUALIFICATION_RECORDER.md`](QUALIFICATION_RECORDER.md) | Guarded CLI for listing and recording genuine manual qualification evidence without hand-editing JSON. |\n| [`PHASE_30_VERIFICATION.md`](PHASE_30_VERIFICATION.md) | Phase 30 recorder implementation, safety boundaries, regression coverage, and manual-evidence boundary. |',
              'QUALIFICATION_RECORDER.md',
          )

          insert_after(
              'docs/RELEASE_QUALIFICATION.md',
              'The source of truth for manual qualification state is:\n\n```text\ndocs/release_qualification.json\n```',
              '\n\nTo reduce hand-editing mistakes, maintainers may use `dart run tool/record_release_qualification.dart --list` and the guarded mutation commands documented in [`QUALIFICATION_RECORDER.md`](QUALIFICATION_RECORDER.md). The recorder does not perform or infer any real-world check; it only validates and records evidence explicitly supplied by the maintainer.',
              'record_release_qualification.dart --list',
          )

          log = Path('what_changed.md')
          lines = log.read_text(encoding='utf-8').splitlines()
          replacement = (
              '- **Current phase:** Phase 30 — guarded release-qualification evidence recorder implemented, '
              'formatted, regression-tested in source, documented, and added to the continuity log; '
              'the latest previously accepted full CI/native evidence remains the Phase 29 Version 1.5 baseline '
              'until a newer maintained workflow result is explicitly recorded; the stable qualification boundary '
              'remains 0/13 and GitHub issues #10 and #12 remain explicit'
          )
          for index, line in enumerate(lines):
              if line.startswith('- **Current phase:**'):
                  lines[index] = replacement
                  break
          else:
              raise SystemExit('Current phase line not found in what_changed.md')
          log.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

          git rm .github/workflows/phase30-continuity.yml docs/PHASE_30_INDEX_TRIGGER.md
          git add README.md docs/README.md docs/RELEASE_QUALIFICATION.md what_changed.md
          git config user.name 'Sanskar'
          git config user.email 'sanskarin@outlook.in'
          git commit -m 'docs: finalize phase 30 documentation indexes'
          git pull --rebase origin main
          git push origin HEAD:main
