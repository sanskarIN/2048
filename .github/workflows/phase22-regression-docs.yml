name: Phase 22 regression documentation refresh

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/phase22-regression-docs.yml

permissions:
  contents: write

concurrency:
  group: phase22-regression-docs
  cancel-in-progress: false

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"

      - name: Apply Phase 22 regression evidence updates
        run: python .github/scripts/phase22_regression_docs.py

      - name: Rebase and push documentation commits
        run: |
          git pull --rebase origin main
          git push origin HEAD:main
