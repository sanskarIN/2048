name: Phase 19 safe core docs updates

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase19-docs-safe-core.yml'

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure commit identity
        run: |
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
      - name: Update README
        env:
          BLOCK_B64: ""
        run: |
          python3 -c "from pathlib import Path; p=Path('README.md'); t=p.read_text(); old='a read-only bounded Move Replay, an isolated deterministic Auto Play / AI Demonstration sandbox,'; new='a read-only bounded Move Replay, portable spectator-only Full Replay Archives, an isolated deterministic Auto Play / AI Demonstration sandbox,'; p.write_text(t.replace(old,new,1) if old in t else t)"
          if ! grep -q '^## Full Replay Archive$' README.md; then printf '\n' >> README.md; echo "$BLOCK_B64" | base64 --decode >> README.md; fi
          git add README.md
          git commit -m "docs: add full replay archives to project overview"
      - name: Update architecture
        env:
          BLOCK_B64: ""
        run: |
          python3 -c "from pathlib import Path; p=Path('docs/ARCHITECTURE.md'); t=p.read_text(); old='Replay deliberately adds **no new persistence format or key**. It reads already-validated bounded Undo history and the current saved game, then creates defensive display copies through `ReplayTimeline`.'; new='Bounded **Move Replay** adds no persistence key. It reads already-validated bounded Undo history and the current saved game, then creates defensive display copies through `ReplayTimeline`. **Full Replay Archive** is separate and uses the project-owned `nova.replay_capture.v1` key for the active bounded deterministic action capture.'; p.write_text(t.replace(old,new,1) if old in t else t)"
          if ! grep -q '^## Full Replay Archive boundary$' docs/ARCHITECTURE.md; then printf '\n' >> docs/ARCHITECTURE.md; echo "$BLOCK_B64" | base64 --decode >> docs/ARCHITECTURE.md; fi
          git add docs/ARCHITECTURE.md
          git commit -m "docs: define full replay archive architecture"
      - name: Update data storage
        env:
          BLOCK_B64: ""
        run: |
          python3 -c "from pathlib import Path; p=Path('docs/DATA_STORAGE.md'); t=p.read_text().replace('`clearAll()` removes only the seven project-owned keys listed above.','`clearAll()` removes the eight project-owned keys, including the replay-capture key.'); p.write_text(t)"
          if ! grep -q '^## Full-session replay capture$' docs/DATA_STORAGE.md; then printf '\n' >> docs/DATA_STORAGE.md; echo "$BLOCK_B64" | base64 --decode >> docs/DATA_STORAGE.md; fi
          git add docs/DATA_STORAGE.md
          git commit -m "docs: document replay capture persistence"
      - name: Update privacy
        env:
          BLOCK_B64: ""
        run: |
          if ! grep -q '^## Full Replay Archive privacy$' docs/PRIVACY.md; then printf '\n' >> docs/PRIVACY.md; echo "$BLOCK_B64" | base64 --decode >> docs/PRIVACY.md; fi
          git add docs/PRIVACY.md
          git commit -m "docs: document full replay archive privacy"
      - name: Remove helper and push
        run: |
          git rm .github/workflows/phase19-docs-safe-core.yml
          git commit -m "chore: remove Phase 19 safe core docs helper"
          git pull --rebase origin main
          git push origin main
