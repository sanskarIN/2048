## Phase 14 — Portable Current-Game Backup/Restore + Complete Documentation

Phase 14 completes the next source-listed optional data-portability feature and expands the repository from a strong implementation record into a complete user, maintainer, platform, testing, security, privacy, and release documentation set. The project remains `0.9.0+1` release candidate; this phase does not claim universal zero-bug or physical-device/store readiness.

### Phase 14 goals and trust model

The portable backup feature was designed around one central rule: externally copied or edited JSON must never become trusted proof of lifetime progress.

The implemented scope therefore restores exactly one current game while deliberately excluding and isolating:

- lifetime statistics;
- achievement unlocks;
- streaks;
- Daily Challenge history;
- settings;
- old Undo history;
- analytics/account data (the default project has neither).

Every confirmed portable import becomes a locally controlled **unranked session**. The restored board remains playable/saveable and can create new Undo snapshots, but portable/editable data cannot inflate trusted local records.

### Portable backup codec

Added:

`lib/domain/game_backup.dart`

Envelope version 1:

```json
{
  "format": "2048-nova-game-backup",
  "version": 1,
  "exportedAt": "<ISO-8601 timestamp>",
  "game": { "...": "GameState JSON" }
}
```

Current constants:

```text
format: 2048-nova-game-backup
version: 1
maximum encoded input: 128 KiB
```

Import validation rejects:

- empty clipboard text;
- content above the maximum length before JSON parsing;
- malformed JSON;
- non-map top-level JSON;
- wrong format;
- unsupported version;
- invalid export timestamp;
- missing/non-map game payload;
- any embedded game state rejected by strict `GameState.fromJson()` validation.

The codec uses Dart JSON only; no new runtime dependency or network service was introduced.

### Persistent imported-game unranked marker

`LocalStore` now owns:

```text
nova.current_game_unranked.v1
```

This policy marker is intentionally stored outside the portable `GameState` payload so an edited backup cannot decide that it is trusted/ranked.

Behavior:

- confirmed import saves marker `true`;
- application/controller restart restores the unranked status;
- normal new game resets local policy to ranked/local behavior;
- current-game reset removes the marker;
- corrupt-current-game recovery removes the marker together with stale Undo data;
- Clear All removes the marker with the other project-owned keys;
- malformed non-boolean marker data is removed and fails safely.

### AppController imported-session policy

Added application state:

```dart
bool _currentGameUnranked = false;
bool get currentGameIsUnranked => game != null && _currentGameUnranked;
```

`importGameBackup()`:

- copies the validated imported state;
- rebuilds the engine from the imported configuration;
- refreshes terminal status under current engine rules;
- installs the board as the current game;
- clears previous-session Undo history;
- marks the current session unranked;
- persists the game and unranked marker;
- does not increment `gamesPlayed`.

The external backup's historical `bestScore` value is not trusted. The restored game display value is normalized against the imported current score and the device's existing local lifetime best, while lifetime statistics themselves remain authoritative and unchanged.

While an imported game is unranked, later moves do **not** update:

- `gamesPlayed`;
- `gamesWon`;
- lifetime total moves;
- lifetime total merges;
- lifetime best score;
- lifetime highest tile;
- current/best streak;
- achievements;
- Daily Challenge history.

A terminal imported game cannot award a local ranked win. Statistics reset also does not convert an imported session into ranked progress.

### Game Backup UI

Added:

`lib/features/backup/game_backup_screen.dart`

Application route:

```text
/backup
```

Home exposes a **Game Backup** card.

Export flow:

1. require a current game;
2. encode current game only;
3. copy JSON to the system clipboard;
4. show confirmation;
5. do not mutate player state.

Import flow:

1. read clipboard text only after explicit user action;
2. decode/strictly validate candidate;
3. show mode, board size, score, moves, highest tile, and source timestamp;
4. explain unranked policy;
5. require non-dismissible explicit confirmation;
6. Cancel leaves the existing current game unchanged;
7. Restore installs the unranked game and enters Game screen.

Home now distinguishes the session with:

```text
Continue Unranked Backup
```

instead of presenting portable progress as ordinary ranked progress.

### Phase 14 automated tests

Four focused test files were added:

`test/game_backup_test.dart` — 7 tests:

- exact encode/decode round trip;
- unrelated settings/stats/achievements/Daily/Undo excluded;
- empty/malformed rejection;
- unsupported format/version rejection;
- invalid timestamp/missing game rejection;
- strict embedded GameState validation;
- oversized input rejection.

`test/imported_game_policy_test.dart` — 5 tests:

- current game restored while imported historical lifetime best is ignored;
- imported moves do not alter player records, achievements, or Daily history;
- unranked marker survives restart and keeps later moves unranked;
- normal new game exits unranked policy;
- terminal imported game cannot award a local win.

`test/game_backup_screen_test.dart` — 4 tests:

- clipboard export produces a decodable current-game-only backup;
- valid import requires explicit confirmation and becomes unranked;
- cancel preserves an existing ranked game;
- malformed clipboard text is rejected without replacement.

`test/unranked_marker_test.dart` — 4 tests:

- marker round trip;
- malformed marker self-repair;
- current-game clear removes marker;
- corrupt-current-game recovery removes marker.

Phase 14 therefore adds **20 focused regression tests** to the Phase 13 suite of 92, producing a 112-test target. Final exact permanent-CI evidence is recorded in the Phase 14 verification subsection once the completed documentation state is verified.

### Transparent Phase 14 defects and development-tooling failures

The implementation log preserves real intermediate problems instead of hiding them.

#### Strict analyzer exposed unused backup test import

CI run:

```text
31781326279
```

failed after backup screen coverage was introduced because strict static analysis found an unused test import.

Fix:

```text
3446413574582c196a47877fe1bfbe63addbf71d
fix: remove unused backup test import
```

#### Oversized-input test fixture used invalid Dart syntax

The first oversized fixture used string multiplication syntax that Dart does not support. It was corrected before final verification.

Fix:

```text
a4a2de5bfb9e32fb9f02cf13b5019f69141ff567
fix: build oversized backup fixture with valid Dart
```

The replacement uses `List.filled(...).join()`.

#### Backup widget harness assumed an offscreen Home card was visible

The production Home screen is scrollable. The widget harness initially tried to tap the new Game Backup card without first bringing it into Flutter's default 800×600 test viewport.

Fix:

```text
24b2063f365b63a86009c9acbebf2c4bafe73bed
test: scroll game backup entry into widget viewport
```

The harness now calls `ensureVisible()` before tapping, mirroring the actual scrollable production UI.

#### Temporary one-time patch/wiring workflows

Several temporary one-time workflows used during the controller-policy migration failed for development-tooling reasons, including source-anchor mismatch, an invalid hand-written patch body, and a plain Ubuntu patch job trying to run `dart` without Flutter/Dart setup.

Relevant temporary runs included:

```text
