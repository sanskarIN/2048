### Remaining manual boundaries before stable `1.0.0`

Phase 14 does not eliminate manual release qualification. Remaining work includes:

- physical Android/iOS gameplay, lifecycle, termination, and save/resume;
- real touch, orientation, responsive layout, keyboard, and focus behavior;
- TalkBack, VoiceOver, and representative desktop/browser screen-reader qualification;
- long-session Undo, Daily, timed, move-limit, target-win/continue, Replay, and Auto Play testing;
- real platform Game Backup clipboard copy/import/cancel/restore behavior;
- imported unranked marker persistence after real app termination/relaunch;
- imported Undo behavior and representative Daily/Target/Time/Move-Limit backup states;
- real browser/email external handlers;
- native icon/splash visual review;
- Android distribution signing;
- Apple signing/provisioning;
- package/store privacy/data-safety/listing/screenshot review.

Portable backups remain plain JSON and are intentionally unranked. Move Replay remains bounded by retained Undo history. Auto Play remains a deterministic heuristic demonstration rather than a guarantee of optimal 2048 play.
