name: Finalize Phase 14 Log

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-phase14-log.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Append Phase 14 development record
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q '^## Phase 14 — Portable Current-Game Backup/Restore + Complete Documentation$' what_changed.md; then
            echo '' | base64 --decode >> what_changed.md
          fi

      - name: Remove helper workflow
        run: git rm .github/workflows/finalize-phase14-log.yml

      - name: Commit Phase 14 record
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: record portable backup and complete documentation phase"
          git pull --rebase origin main
          git push origin HEAD:main
