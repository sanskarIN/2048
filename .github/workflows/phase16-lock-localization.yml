name: Phase 16 Localization Lock

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/phase16-lock-localization.yml

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve and commit application lockfile
        shell: bash
        run: |
          flutter pub get
          rm .github/workflows/phase16-lock-localization.yml
          git config user.name Sanskar
          git config user.email sanskarin@outlook.in
          git add pubspec.lock
          git add -u .github/workflows/phase16-lock-localization.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "build: lock localization dependencies"
          git pull --rebase origin main
          git push origin HEAD:main
