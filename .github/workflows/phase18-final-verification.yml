name: Phase 18 final verification records

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/phase18-final-verification.yml

permissions:
  contents: write

jobs:
  finalize-phase18:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure commit identity
        run: |
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"

      - name: Add focused Phase 18 verification record
        run: |
          cat > docs/PHASE_18_VERIFICATION.md <<'EOF'
          # Phase 18 Verification — Bounded Expectimax and Solver Benchmarks

          This file is the focused verification record for the Phase 18 advanced-solver release-candidate work. The canonical cross-phase record remains [`VERIFICATION.md`](VERIFICATION.md).

          ## Qualified scope

          Phase 18 adds advanced automated solving only behind the existing isolated Auto Play Demo boundary:

          - bounded deterministic `ExpectimaxSolver`;
          - player/chance search using every empty-cell spawn position and the game probabilities: tile `2` at 90%, tile `4` at 10%;
          - explicit default limits of depth 2 and 50,000 explored nodes;
          - non-mutating hypothetical board search with no RNG consumption during evaluation;
          - `AutoplayStrategy.heuristic` and `AutoplayStrategy.expectimax`;
          - strategy switching that preserves sandbox board/score/moves/RNG while clearing only decision diagnostics;
          - visible expectimax explored-node diagnostics;
          - reusable deterministic `SolverBenchmark` library;
          - `dart run tool/solver_benchmark.dart` CLI harness;
          - English/Hindi strategy UI and updated in-app Guide/About copy;
          - 17 focused regression additions over the Phase 17 total.

          Normal player Hint remains the existing fast read-only heuristic and never invokes expectimax.

          ## Final maintained CI gate

          The final test-only correction commit is:

          ```text
          b114255b6f510f0e7ba8d0516e9a30eebf4451b8
          fix: import solver demo language enum
          ```

          Permanent CI evidence:

          ```text
          Workflow: CI
          Run: 31869835223
          Job: 94976646621
          Result: SUCCESS
          Date: 2026-08-15
          Runner: ubuntu-24.04
          Flutter: 3.47.0 stable
          Dart: 3.13.0
          DevTools: 2.60.0
          Dependency resolution: PASS
          Dart formatting: PASS — 80 files, 0 changed
          Flutter analyze: PASS — No issues found
          Automated tests: PASS — 161/161
          Flutter Web release build: PASS — build/web produced
          Flutter Web WASM dry run: PASS
          ```

          Phase 18 therefore moved the complete regression total from 144 to 161, exactly matching the 17 focused additions recorded for expectimax, strategy isolation, benchmark behavior, widget integration, and Hindi localization.

          The Web compiler again emitted the existing non-fatal Cupertino icon-font availability warning while still producing `build/web`. It is recorded as a warning, not misrepresented as a build failure.

          ## Current runtime native matrix

          The final runtime-source commit intentionally used to trigger the maintained native matrix is:

          ```text
          e324882fc861e9e4221020aabb00515c7366a6f7
          docs: clarify autoplay strategy isolation in source
          ```

          The later `b114255...` commit changes only a test import, so the runtime application source verified by the native matrix is unchanged.

          ```text
          Workflow: Platform Builds
          Run: 31869794809
          Result: SUCCESS

          Linux release
            Job: 94976574317
            flutter build linux --release: PASS

          Android release APK
            Job: 94976574376
            flutter build apk --release: PASS

          Windows release
            Job: 94976574323
            flutter build windows --release: PASS

          macOS and unsigned iOS release
            Job: 94976574495
            flutter build macos --release: PASS
            flutter build ios --release --no-codesign: PASS
          ```

          This is the latest hosted multi-platform compilation evidence for 2048 Nova and supersedes the Phase 17 matrix as the current native-build record.

          ## Acceptance failures retained for auditability

          ### Attempt 1 — duplicate localization key and benchmark CLI lints

          ```text
          Commit: 959f8a230484b0cbdf0e028eabbbe4847ef51d41
          CI run: 31869526679
          Formatting: PASS — 79 files, 0 changed
          Static analysis: FAIL — 9 issues
          Tests: skipped
          Web build: skipped
          ```

          Static analysis found:

          - one duplicate constant-map key for the Hindi `Strategy` translation;
          - eight `avoid_print` findings in `tool/solver_benchmark.dart`.

          The CLI was corrected to use `dart:io` `stdout.writeln`; the duplicate Phase 18 `Strategy` entry was removed so the pre-existing `Strategy` → `रणनीति` mapping remains the single translation source.

          ### Attempt 2 — missing test import

          The final runtime-source commit triggered a second maintained CI gate:

          ```text
          Commit: e324882fc861e9e4221020aabb00515c7366a6f7
          CI run: 31869794852
          Job: 94976548162
          Formatting: PASS — 80 files, 0 changed
          Static analysis: FAIL — 1 issue
          Tests: skipped
          Web build: skipped
          ```

          The only issue was `Undefined name 'AppLanguage'` in `test/solver_demo_localization_test.dart`, caused by a missing localization import in the new test harness. Production solver/runtime source was not implicated. Commit `b114255b6f510f0e7ba8d0516e9a30eebf4451b8` added the correct import, after which CI `31869835223` passed all 161 tests and Web/WASM verification.

          ## Focused regression additions

          Phase 18 adds:

          ```text
          test/expectimax_solver_test.dart          6 tests
          test/autoplay_strategy_test.dart          5 tests
          test/solver_benchmark_test.dart           3 tests
          test/solver_demo_screen_test.dart         +1 test
          test/localization_test.dart               +1 test
          test/solver_demo_localization_test.dart    1 test
          -------------------------------------------------
          Total Phase 18 additions                  17 tests
          ```

          Coverage verifies deterministic/legal search, terminal no-move handling, board immutability, node-budget enforcement, larger-board support, malformed-board rejection, strategy-switch state preservation, seeded expectimax reproducibility, bounded decision diagnostics, reset behavior, deterministic benchmark summaries, heuristic zero-search-node accounting, benchmark validation, trusted-state UI isolation, Hindi catalog strings, and Hindi strategy UI.

          ## Trust and performance boundary

          Expectimax and benchmark code do not depend on `AppController`, `LocalStore`, SharedPreferences, accounts, analytics, network services, or remote AI. Search runs on copied in-memory sandbox boards and does not update trusted player saves, lifetime statistics, per-mode records, achievements, streaks, or Daily Challenge history.

          The explicit search depth/node budget is a deterministic work bound, not a claim that every device will have identical wall-clock performance. Real low-end-device responsiveness remains a manual release check.

          ## Release boundary

          These green automated and hosted native-build gates qualify the Phase 18 source/test/runtime candidate. They do **not** by themselves promote the project to stable `1.0.0`.

          Stable release still requires the manual checks listed in [`ROADMAP.md`](../ROADMAP.md) and [`RELEASE_CHECKLIST.md`](RELEASE_CHECKLIST.md), including physical-device lifecycle/gameplay, real assistive-technology behavior, solver responsiveness on representative slower devices, real clipboard/platform handlers, native branding review, signing/provisioning, and store metadata/review.
          EOF
          git add docs/PHASE_18_VERIFICATION.md
          git commit -m "docs: add focused Phase 18 verification record"

      - name: Update canonical verification
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/VERIFICATION.md')
          text = path.read_text()
          heading = '## Phase 18 — Bounded Expectimax and solver benchmarks'
          if heading not in text:
              intro = 'This document records objective automated evidence for the current 2048 Nova release-candidate line. It distinguishes formatter/analyzer/test/Web verification, native compilation evidence, transparent intermediate failures, and manual release boundaries.\n'
              section = '''\n## Phase 18 — Bounded Expectimax and solver benchmarks\n\nDate: **2026-08-15**\n\nFinal maintained automated evidence:\n\n```text\nFinal CI commit: b114255b6f510f0e7ba8d0516e9a30eebf4451b8\nCI run: 31869835223\nCI job: 94976646621\nResult: SUCCESS\nFlutter: 3.47.0 stable\nDart: 3.13.0\nDevTools: 2.60.0\nFormatting: PASS — 80 files, 0 changed\nStatic analysis: PASS — No issues found\nTests: PASS — 161/161\nWeb release: PASS\nWeb WASM dry run: PASS\n\nRuntime native commit: e324882fc861e9e4221020aabb00515c7366a6f7\nPlatform Builds run: 31869794809\nResult: SUCCESS\nAndroid APK: PASS — job 94976574376\nLinux: PASS — job 94976574317\nWindows: PASS — job 94976574323\nmacOS: PASS — job 94976574495\nunsigned iOS: PASS — job 94976574495\n```\n\nThe later final CI commit changes only a test import, so the runtime application tree covered by the native matrix is unchanged. Phase 18 adds 17 focused tests to the Phase 17 total of 144. Normal Hint remains heuristic-only; bounded Expectimax and deterministic benchmarking remain isolated from trusted player state.\n\nTransparent acceptance failures are retained: CI `31869526679` caught one duplicate Hindi map key and eight benchmark-CLI `avoid_print` lints; CI `31869794852` later caught a missing `AppLanguage` import in the Hindi solver widget test. Both were corrected before the final 161-test green gate.\n\nThe Web build continued to emit the existing non-fatal Cupertino icon-font availability warning while successfully producing `build/web`. Hosted compilation does not replace physical-device/accessibility/performance/signing/store qualification.\n\nFocused details: [`PHASE_18_VERIFICATION.md`](PHASE_18_VERIFICATION.md).\n\n'''
              if intro not in text:
                  raise SystemExit('Verification intro not found')
              text = text.replace(intro, intro + section, 1)
          text = text.replace(
              'The newer current-source Phase 17 native matrix recorded above supersedes the Phase 16 matrix as the latest hosted multi-platform build evidence.',
              'The Phase 17 current-source matrix superseded Phase 16 at that time; the newer Phase 18 matrix recorded above is now the latest hosted multi-platform build evidence.',
          )
          path.write_text(text)
          PY
          git add docs/VERIFICATION.md
          git commit -m "docs: record Phase 18 canonical verification"

      - name: Index Phase 18 verification
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/README.md')
          text = path.read_text()
          row = '| [`PHASE_18_VERIFICATION.md`](PHASE_18_VERIFICATION.md) | Focused Phase 18 bounded-expectimax, 161-test, Web/WASM, and native-matrix acceptance record. |\n'
          if row not in text:
              marker = '| [`VERIFICATION.md`](VERIFICATION.md) | Compact current automated verification record. |\n'
              if marker not in text:
                  raise SystemExit('Verification index marker not found')
              text = text.replace(marker, marker + row, 1)
          path.write_text(text)
          PY
          git add docs/README.md
          git commit -m "docs: index Phase 18 verification evidence"

      - name: Record final Phase 18 testing gate
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/TESTING.md')
          text = path.read_text()
          heading = '## Phase 18 final maintained gate'
          if heading not in text:
              text += '''\n\n## Phase 18 final maintained gate\n\nPermanent CI run `31869835223` on final test commit `b114255b6f510f0e7ba8d0516e9a30eebf4451b8` is the authoritative Phase 18 automated acceptance result. Flutter 3.47.0 / Dart 3.13.0 formatted 80 files with 0 changes, reported no analyzer issues, passed **161/161 tests**, built the Flutter Web release successfully, and passed the Web WASM dry run.\n\nPhase 18 adds exactly 17 tests over the Phase 17 total of 144. They cover bounded expectimax, deterministic strategy isolation, seeded benchmark behavior, Auto Play strategy selection, Hindi solver catalog entries, and Hindi solver UI.\n\nTwo failed analyzer gates remain intentionally visible. CI `31869526679` caught a duplicate Hindi `Strategy` map key plus eight CLI `avoid_print` lints; CI `31869794852` caught a missing `AppLanguage` import in the new Hindi solver widget test. Neither failed run is counted as passing evidence. The corrections precede the final 161-test gate.\n\nThe current runtime tree is additionally covered by Platform Builds `31869794809`, which passed Android, Linux, Windows, macOS, and unsigned iOS release compilation. See [`PHASE_18_VERIFICATION.md`](PHASE_18_VERIFICATION.md).\n'''
          path.write_text(text)
          PY
          git add docs/TESTING.md
          git commit -m "docs: record final Phase 18 test gate"

      - name: Record latest platform matrix
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/PLATFORMS.md')
          text = path.read_text()
          heading = '## Phase 18 current runtime hosted build matrix'
          if heading not in text:
              text += '''\n\n## Phase 18 current runtime hosted build matrix\n\nThe latest hosted native-build evidence is Platform Builds run `31869794809` on runtime commit `e324882fc861e9e4221020aabb00515c7366a6f7`. All configured native targets completed successfully:\n\n- Android release APK — job `94976574376`;\n- Linux release — job `94976574317`;\n- Windows release — job `94976574323`;\n- macOS release — job `94976574495`;\n- unsigned iOS release — job `94976574495`.\n\nThe later final CI commit `b114255b6f510f0e7ba8d0516e9a30eebf4451b8` changes only a test import and does not alter runtime application source, so this matrix covers the accepted Phase 18 runtime tree. It supersedes the Phase 17 matrix as the latest hosted native compilation evidence.\n\nHosted builds demonstrate compilation/package success only; physical-device behavior, expectimax responsiveness on representative slower devices, accessibility/focus, signed iOS distribution, signing/provisioning, and store qualification remain manual release requirements.\n'''
          text = text.replace(
              'The latest hosted native-build evidence is Platform Builds run `31867788753` on commit `d33d65840aff67c4e9bf69ad203f46b85146093c`.',
              'The Phase 17 hosted native-build evidence was Platform Builds run `31867788753` on commit `d33d65840aff67c4e9bf69ad203f46b85146093c`.',
          )
          path.write_text(text)
          PY
          git add docs/PLATFORMS.md
          git commit -m "docs: record Phase 18 native build matrix"

      - name: Record maintained workflow evidence
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/CI_CD.md')
          text = path.read_text()
          heading = '## Phase 18 maintained workflow evidence'
          if heading not in text:
              text += '''\n\n## Phase 18 maintained workflow evidence\n\nPhase 18 final automated qualification uses permanent CI run `31869835223` and Platform Builds run `31869794809`. CI passed formatting (80 files, 0 changed), static analysis, **161/161 tests**, Web release compilation, and the Web WASM dry run under Flutter 3.47.0 / Dart 3.13.0.\n\nThe native workflow passed Android APK, Linux, Windows, macOS, and unsigned iOS release builds on runtime commit `e324882fc861e9e4221020aabb00515c7366a6f7`. The later CI-only commit `b114255b6f510f0e7ba8d0516e9a30eebf4451b8` fixes a missing test import and leaves runtime source unchanged.\n\nIntermediate analyzer failures `31869526679` and `31869794852` are retained in the verification/work log. The first caught a duplicate Hindi translation key and CLI `avoid_print` issues; the second caught a missing localization import in a widget test. Permanent quality gates were not weakened to bypass either issue.\n'''
          path.write_text(text)
          PY
          git add docs/CI_CD.md
          git commit -m "docs: record Phase 18 workflow evidence"

      - name: Add Phase 18 verification to changelog
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('CHANGELOG.md')
          text = path.read_text()
          bullet = '- Phase 18 final gate: CI `31869835223` on `b114255b6f510f0e7ba8d0516e9a30eebf4451b8` passed formatting (80 files / 0 changes), analysis, **161/161 tests**, Web release, and the Web WASM dry run under Flutter 3.47.0 / Dart 3.13.0.\n'
          if bullet not in text:
              marker = '### Verification\n\n'
              if marker not in text:
                  raise SystemExit('Changelog verification marker not found')
              extra = bullet + '- Phase 18 native matrix: Platform Builds `31869794809` on runtime `e324882fc861e9e4221020aabb00515c7366a6f7` passed Android APK, Linux, Windows, macOS, and unsigned iOS release builds.\n- Phase 18 acceptance history remains visible: CI `31869526679` caught a duplicate Hindi key plus benchmark CLI lints; CI `31869794852` caught a missing `AppLanguage` test import. Both were corrected before the final green gate.\n'
              text = text.replace(marker, marker + extra, 1)
          path.write_text(text)
          PY
          git add CHANGELOG.md
          git commit -m "docs: record Phase 18 final verification in changelog"

      - name: Finalize Phase 18 what changed log
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('what_changed.md')
          text = path.read_text()
          heading = '## Final Phase 18 maintained acceptance and native matrix'
          if heading not in text:
              text += '''\n\n## Final Phase 18 maintained acceptance and native matrix\n\nPhase 18 was not declared complete from source inspection. The completed source/test candidate was passed through the permanent CI gate and the full hosted native matrix.\n\n### Acceptance attempt 1 — duplicate translation key and CLI lint findings\n\n```text\nCommit: 959f8a230484b0cbdf0e028eabbbe4847ef51d41\nCI run: 31869526679\nFormatting: PASS — 79 files, 0 changed\nStatic analysis: FAIL — 9 issues\nTests: skipped\nWeb build: skipped\n```\n\nThe analyzer found one duplicate constant-map key for Hindi `Strategy` plus eight `avoid_print` lints in `tool/solver_benchmark.dart`. The benchmark CLI was changed to `dart:io` `stdout.writeln`, and the duplicate newly-added solver `Strategy` key was removed so the already-existing `Strategy` → `रणनीति` entry remains the shared source.\n\n### Acceptance attempt 2 — missing localization import in Hindi solver test\n\nA final runtime-source documentation commit was used to trigger the maintained CI/native workflows on the complete Phase 18 runtime tree:\n\n```text\ne324882fc861e9e4221020aabb00515c7366a6f7\ndocs: clarify autoplay strategy isolation in source\n```\n\nIts CI gate stopped at one test-code analyzer error:\n\n```text\nCI run: 31869794852\nCI job: 94976548162\nFormatting: PASS — 80 files, 0 changed\nStatic analysis: FAIL — 1 issue\nCause: Undefined name 'AppLanguage' in test/solver_demo_localization_test.dart\nTests: skipped\nWeb build: skipped\n```\n\nProduction solver/runtime code was not implicated. The new Hindi widget test was missing the localization module import. It was corrected in:\n\n```text\nb114255b6f510f0e7ba8d0516e9a30eebf4451b8\nfix: import solver demo language enum\n```\n\n### Authoritative Phase 18 CI gate\n\nThe permanent CI workflow then completed successfully:\n\n```text\nCommit: b114255b6f510f0e7ba8d0516e9a30eebf4451b8\nCI workflow run: 31869835223\nCI job: 94976646621\nResult: SUCCESS\nRunner: ubuntu-24.04\nFlutter: 3.47.0 stable\nDart: 3.13.0\nDevTools: 2.60.0\nDependency resolution: PASS\nFormatting: PASS — 80 files, 0 changed\nStatic analysis: PASS — No issues found\nAutomated regression tests: PASS — 161/161\nFlutter Web release build: PASS — build/web produced\nFlutter Web WASM dry run: PASS\n```\n\nThe complete test total moved from 144 in Phase 17 to 161 in Phase 18, exactly matching the 17 focused expectimax/strategy/benchmark/localization additions. The Web compiler emitted the existing non-fatal Cupertino icon-font availability warning but still produced `build/web`.\n\n### Current runtime native matrix\n\nThe full permanent Platform Builds workflow completed against runtime commit `e324882fc861e9e4221020aabb00515c7366a6f7`. The later `b114...` fix changes only a test import, so runtime application source is identical.\n\n```text\nPlatform Builds workflow run: 31869794809\nResult: SUCCESS\n\nLinux release\n  Job: 94976574317\n  flutter build linux --release: PASS\n\nAndroid release APK\n  Job: 94976574376\n  flutter build apk --release: PASS\n\nWindows release\n  Job: 94976574323\n  flutter build windows --release: PASS\n\nmacOS and unsigned iOS release\n  Job: 94976574495\n  flutter build macos --release: PASS\n  flutter build ios --release --no-codesign: PASS\n```\n\nThis supersedes the Phase 17 native matrix as the latest hosted multi-platform compilation evidence.\n\n### Phase 18 qualification status\n\nThe bounded deterministic Expectimax strategy, selectable Auto Play strategy layer, benchmark library/CLI, English/Hindi solver UI, and all existing project behavior are accepted by the maintained automated gates. No failing analyzer/test/native build is being hidden or counted as passing evidence.\n\nStable `1.0.0` remains intentionally unpromoted because hosted CI cannot replace physical Android/iOS lifecycle/gameplay checks, real TalkBack/VoiceOver/desktop screen-reader checks, expectimax responsiveness on representative slower devices, real clipboard/platform-handler behavior, long-session checks, native splash/icon review, signing/provisioning/notarization, and store metadata/review.\n\nFocused permanent evidence is recorded in:\n\n```text\ndocs/PHASE_18_VERIFICATION.md\n```\n'''
          path.write_text(text)
          PY
          git add what_changed.md
          git commit -m "docs: finalize Phase 18 acceptance work log"

      - name: Remove helper and push final verification commits
        run: |
          git rm .github/workflows/phase18-final-verification.yml
          git commit -m "chore: remove Phase 18 final verification helper"
          git pull --rebase origin main
          git push origin HEAD:main
