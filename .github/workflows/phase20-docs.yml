name: Phase 20 documentation commits

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase20-docs.yml'

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure commit identity
        run: |
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
      - name: Apply documentation updates
        run: python3 tools/phase20_docs.py
      - name: Remove temporary documentation tools
        run: |
          git rm tools/phase20_docs.py .github/workflows/phase20-docs.yml
          git commit -m "chore: remove Phase 20 documentation helper"
          git pull --rebase origin main
          git push origin HEAD:main
