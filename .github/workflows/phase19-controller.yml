name: Phase 19 replay controller integration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase19-controller.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure commit identity
        run: |
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"

      - name: Record full-session replay actions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/app/state/app_controller.dart')
          text = path.read_text()
          def rep(old, new):
              global text
              if old not in text:
                  raise SystemExit('missing anchor: ' + old[:80])
              text = text.replace(old, new, 1)
          rep("import '../../domain/game_types.dart';\n", "import '../../domain/game_types.dart';\nimport '../../domain/replay_archive.dart';\n")
          rep('  bool _currentGameUnranked = false;\n', '  bool _currentGameUnranked = false;\n  ReplayCapture? _replayCapture;\n')
          rep('  bool get currentGameIsUnranked => game != null && _currentGameUnranked;\n', '  bool get currentGameIsUnranked => game != null && _currentGameUnranked;\n  ReplayCapture? get replayCapture => _replayCapture;\n')
          rep('    game = await store.loadGame();\n', '    game = await store.loadGame();\n    final storedReplayCapture = await store.loadReplayCapture();\n')
          rep('    if (game != null) {\n      _engine = GameEngine(config: game!.config);\n', '    if (game != null) {\n      _engine = GameEngine(config: game!.config);\n      if (storedReplayCapture != null &&\n          storedReplayCapture.belongsTo(game!) &&\n          _isReplayCaptureValidForCurrent(storedReplayCapture, game!)) {\n        _replayCapture = storedReplayCapture;\n      } else {\n        _replayCapture = ReplayCapture.incomplete(game!);\n        if (storedReplayCapture != null) repairedSession = true;\n      }\n')
          rep('      if (current.status != previousStatus) {\n        if (!_currentGameUnranked) {', '      if (current.status != previousStatus) {\n        _replayCapture?.appendStatusRefresh(DateTime.now());\n        if (!_currentGameUnranked) {')
          rep('    }\n    _unlockAchievements();\n', '    } else if (storedReplayCapture != null) {\n      await store.clearReplayCapture();\n    }\n    _unlockAchievements();\n')
          rep('    game = _engine!.createGame(bestScore: stats.bestScore);\n    _undo.clear();', '    game = _engine!.createGame(bestScore: stats.bestScore);\n    _replayCapture = ReplayCapture.start(game!);\n    _undo.clear();')
          rep('      final snapshot = current.copy();\n      final outcome = engine.move(current, direction);', '      final snapshot = current.copy();\n      final now = DateTime.now();\n      final outcome = engine.move(current, direction, now: now);')
          rep('      _undo.add(snapshot);\n      if (_undo.length > 50) _undo.removeAt(0);', '      _undo.add(snapshot);\n      if (_undo.length > 50) _undo.removeAt(0);\n      (_replayCapture ??= ReplayCapture.incomplete(snapshot))\n          .appendMove(direction, now);')
          rep('    game = restored;\n    _engine = GameEngine(config: game!.config);', '    game = restored;\n    final capture = _replayCapture;\n    if (capture != null && capture.startsAtSessionStart) {\n      capture.appendUndo(DateTime.now());\n    } else {\n      _replayCapture = ReplayCapture.incomplete(restored);\n    }\n    _engine = GameEngine(config: game!.config);')
          rep('    await store.saveUndoHistory(_undo);\n    if (!_currentGameUnranked) {', '    await store.saveUndoHistory(_undo);\n    if (_replayCapture != null) {\n      await store.saveReplayCapture(_replayCapture!);\n    }\n    if (!_currentGameUnranked) {')
          rep('    final before = current.status;\n    engine.refreshStatus(current);', '    final before = current.status;\n    final now = DateTime.now();\n    engine.refreshStatus(current, now: now);')
          rep('    if (before != current.status) {\n      if (!_currentGameUnranked) {', '    if (before != current.status) {\n      _replayCapture?.appendStatusRefresh(now);\n      if (!_currentGameUnranked) {')
          rep('    game!.hasAcknowledgedWin = true;\n    game!.status = GameStatus.playing;', '    final now = DateTime.now();\n    game!.hasAcknowledgedWin = true;\n    game!.status = GameStatus.playing;\n    _replayCapture?.appendContinueAfterWin(now);')
          rep('    game = restored;\n    _undo.clear();\n    _currentGameUnranked = true;', '    game = restored;\n    _replayCapture = ReplayCapture.incomplete(restored);\n    _undo.clear();\n    _currentGameUnranked = true;')
          rep('    await store.saveUndoHistory(_undo);\n    await store.saveCurrentGameUnranked(true);', '    await store.saveUndoHistory(_undo);\n    await store.saveReplayCapture(_replayCapture!);\n    await store.saveCurrentGameUnranked(true);')
          rep('    _engine = null;\n    _undo.clear();\n    _currentGameUnranked = false;\n    await store.clearGame();', '    _engine = null;\n    _undo.clear();\n    _replayCapture = null;\n    _currentGameUnranked = false;\n    await store.clearGame();')
          rep('    game = null;\n    _engine = null;\n    _undo.clear();\n    dailyHistory.clear();', '    game = null;\n    _engine = null;\n    _undo.clear();\n    _replayCapture = null;\n    dailyHistory.clear();')
          rep('    await store.saveUndoHistory(_undo);\n    await store.saveStats(stats.toJson());', '    await store.saveUndoHistory(_undo);\n    if (_replayCapture != null) {\n      await store.saveReplayCapture(_replayCapture!);\n    }\n    await store.saveStats(stats.toJson());')
          rep('  bool _belongsToCurrentSession(GameState snapshot, GameState current) {\n', '  bool _isReplayCaptureValidForCurrent(\n    ReplayCapture capture,\n    GameState current,\n  ) {\n    try {\n      final frames = ReplayArchivePlayer.build(capture);\n      if (frames.isEmpty) return false;\n      if (capture.overflowed) return true;\n      return ReplayArchivePlayer.equivalent(frames.last, current);\n    } on Object {\n      return false;\n    }\n  }\n\n  bool _belongsToCurrentSession(GameState snapshot, GameState current) {\n')
          path.write_text(text)
          PY
          git add lib/app/state/app_controller.dart
          git commit -m "feat: record full-session replay actions"

      - name: Remove helper and push
        run: |
          git rm .github/workflows/phase19-controller.yml
          git commit -m "chore: remove Phase 19 replay controller helper"
          git push origin main
