# Phase 28 disposable validation change: this comment exists only to exercise the
# SHA-pinned pull-request dependency-review workflow and will not be merged.
name: Dependency Review

on:
  pull_request:
    branches: [main]
    paths:
      - pubspec.yaml
      - pubspec.lock
      - android/**
      - .github/workflows/**

permissions:
  contents: read

jobs:
  dependency-review:
    name: Review dependency changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        with:
          fail-on-severity: high
