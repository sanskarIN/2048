name: Phase 27 documentation finalizer

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/phase-27-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Configure commit identity
        run: |
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"

      - name: Apply verified Phase 27 documentation updates
        run: python3 tool/phase27_finalize.py

      - name: Commit continuity log
        run: |
          git add what_changed.md
          git commit -m "docs: record Phase 27 Android continuity"

      - name: Commit compact verification
        run: |
          git add docs/VERIFICATION.md
          git commit -m "docs: record Phase 27 current verification"

      - name: Commit artifact ledger
        run: |
          git add docs/RELEASE_ARTIFACTS.md
          git commit -m "docs: record Phase 27 hosted artifacts"

      - name: Commit documentation index
        run: |
          git add docs/README.md
          git commit -m "docs: index Phase 27 Android records"

      - name: Commit platform guide
        run: |
          git add docs/PLATFORMS.md
          git commit -m "docs: document accepted Android toolchain baseline"

      - name: Commit changelog
        run: |
          git add CHANGELOG.md
          git commit -m "docs: record Phase 27 Android hardening"

      - name: Verify clean generated result
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git status --short
            exit 1
          fi

      - name: Push Phase 27 documentation commits
        run: git push origin HEAD:main
