name: Phase 19 final verification recorder

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase19-final-verification.yml'

permissions:
  actions: read
  contents: write

jobs:
  verify-and-record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure commit identity
        run: |
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"

      - name: Wait for maintained CI and native matrix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git log --format='%H' --grep='^docs: codify replay archive trust boundary in source$' -n 1)"
          if [ -z "$SOURCE_SHA" ]; then
            echo "Final Phase 19 source trigger commit not found" >&2
            exit 1
          fi
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"

          CI_RUN=""
          PLATFORM_RUN=""
          for attempt in $(seq 1 100); do
            CI_JSON="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&per_page=10")"
            CI_RUN="$(printf '%s' "$CI_JSON" | jq -r '.workflow_runs[0].id // empty')"
            CI_STATUS="$(printf '%s' "$CI_JSON" | jq -r '.workflow_runs[0].status // empty')"
            CI_CONCLUSION="$(printf '%s' "$CI_JSON" | jq -r '.workflow_runs[0].conclusion // empty')"

            PLATFORM_JSON="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/platform-builds.yml/runs?head_sha=$SOURCE_SHA&per_page=10")"
            PLATFORM_RUN="$(printf '%s' "$PLATFORM_JSON" | jq -r '.workflow_runs[0].id // empty')"
            PLATFORM_STATUS="$(printf '%s' "$PLATFORM_JSON" | jq -r '.workflow_runs[0].status // empty')"
            PLATFORM_CONCLUSION="$(printf '%s' "$PLATFORM_JSON" | jq -r '.workflow_runs[0].conclusion // empty')"

            if [ "$CI_STATUS" = "completed" ] && [ "$PLATFORM_STATUS" = "completed" ]; then
              break
            fi
            sleep 12
          done

          if [ -z "$CI_RUN" ] || [ -z "$PLATFORM_RUN" ]; then
            echo "Required maintained workflow run was not found" >&2
            exit 1
          fi

          CI_JSON="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&per_page=10")"
          PLATFORM_JSON="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/platform-builds.yml/runs?head_sha=$SOURCE_SHA&per_page=10")"
          CI_CONCLUSION="$(printf '%s' "$CI_JSON" | jq -r '.workflow_runs[0].conclusion // empty')"
          PLATFORM_CONCLUSION="$(printf '%s' "$PLATFORM_JSON" | jq -r '.workflow_runs[0].conclusion // empty')"
          if [ "$CI_CONCLUSION" != "success" ]; then
            echo "Maintained CI did not succeed: $CI_CONCLUSION" >&2
            exit 1
          fi
          if [ "$PLATFORM_CONCLUSION" != "success" ]; then
            echo "Platform Builds did not succeed: $PLATFORM_CONCLUSION" >&2
            exit 1
          fi

          CI_JOBS="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN/jobs?per_page=100")"
          CI_JOB="$(printf '%s' "$CI_JOBS" | jq -r '.jobs[] | select(.name == "Format, analyze, test, web build") | .id' | head -n1)"
          if [ -z "$CI_JOB" ]; then
            echo "CI job id not found" >&2
            exit 1
          fi

          PLATFORM_JOBS="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PLATFORM_RUN/jobs?per_page=100")"
          ANDROID_JOB="$(printf '%s' "$PLATFORM_JOBS" | jq -r '.jobs[] | select(.name == "Android release APK") | .id' | head -n1)"
          LINUX_JOB="$(printf '%s' "$PLATFORM_JOBS" | jq -r '.jobs[] | select(.name == "Linux release") | .id' | head -n1)"
          WINDOWS_JOB="$(printf '%s' "$PLATFORM_JOBS" | jq -r '.jobs[] | select(.name == "Windows release") | .id' | head -n1)"
          APPLE_JOB="$(printf '%s' "$PLATFORM_JOBS" | jq -r '.jobs[] | select(.name == "macOS and unsigned iOS release") | .id' | head -n1)"

          for pair in "Android:$ANDROID_JOB" "Linux:$LINUX_JOB" "Windows:$WINDOWS_JOB" "Apple:$APPLE_JOB"; do
            name="${pair%%:*}"
            id="${pair#*:}"
            if [ -z "$id" ]; then
              echo "$name native job id not found" >&2
              exit 1
            fi
            conclusion="$(printf '%s' "$PLATFORM_JOBS" | jq -r --argjson id "$id" '.jobs[] | select(.id == $id) | .conclusion')"
            if [ "$conclusion" != "success" ]; then
              echo "$name native job did not succeed: $conclusion" >&2
              exit 1
            fi
          done

          gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$CI_JOB/logs" > /tmp/phase19-ci.log || true
          if ! grep -q '183 tests passed' /tmp/phase19-ci.log; then
            echo "Final CI log did not confirm 183 passing tests" >&2
            exit 1
          fi
          if ! grep -q 'No issues found' /tmp/phase19-ci.log; then
            echo "Final CI log did not confirm clean analysis" >&2
            exit 1
          fi
          if ! grep -q 'Formatted 89 files (0 changed)' /tmp/phase19-ci.log && ! grep -q 'Formatted 88 files (0 changed)' /tmp/phase19-ci.log; then
            echo "Final CI log did not confirm clean formatting" >&2
            exit 1
          fi
          if ! grep -q 'Built build/web' /tmp/phase19-ci.log; then
            echo "Final CI log did not confirm Web release build" >&2
            exit 1
          fi
          if ! grep -q 'Wasm dry run succeeded' /tmp/phase19-ci.log; then
            echo "Final CI log did not confirm WASM dry run" >&2
            exit 1
          fi

          FORMAT_COUNT="$(grep -oE 'Formatted [0-9]+ files \(0 changed\)' /tmp/phase19-ci.log | tail -n1 | grep -oE '[0-9]+' | head -n1)"
          FLUTTER_LINE="$(grep -m1 '^Flutter 3\.47\.0' /tmp/phase19-ci.log || true)"
          if [ -z "$FLUTTER_LINE" ]; then
            echo "Final CI toolchain did not report Flutter 3.47.0" >&2
            exit 1
          fi

          echo "CI_RUN=$CI_RUN" >> "$GITHUB_ENV"
          echo "CI_JOB=$CI_JOB" >> "$GITHUB_ENV"
          echo "PLATFORM_RUN=$PLATFORM_RUN" >> "$GITHUB_ENV"
          echo "ANDROID_JOB=$ANDROID_JOB" >> "$GITHUB_ENV"
          echo "LINUX_JOB=$LINUX_JOB" >> "$GITHUB_ENV"
          echo "WINDOWS_JOB=$WINDOWS_JOB" >> "$GITHUB_ENV"
          echo "APPLE_JOB=$APPLE_JOB" >> "$GITHUB_ENV"
          echo "FORMAT_COUNT=$FORMAT_COUNT" >> "$GITHUB_ENV"

      - name: Add focused Phase 19 verification record
        run: |
          cat > docs/PHASE_19_VERIFICATION.md <<EOF
          # Phase 19 Verification - Portable Full-Session Replay Archives

          This file is the focused verification record for the Phase 19 portable replay release-candidate work. The canonical cross-phase record remains [VERIFICATION.md](VERIFICATION.md).

          ## Qualified scope

          Phase 19 adds a separate portable spectator replay system while preserving the existing bounded Undo-backed Move Replay:

          - versioned `nova2048.fullReplay` JSON, version 1;
          - deterministic event capture for move, Undo, continue-after-win, and status refresh;
          - recorded elapsed event time supplied back into timed engine rules;
          - complete, incomplete, and overflowed capture policy;
          - hard 4,096-event capture bound and 1,000,000-character encoded input bound;
          - corruption-safe local capture persistence under `nova.replay_capture.v1`;
          - strict deterministic reconstruction and invalid-action rejection;
          - explicit clipboard/manual archive open;
          - spectator-only imported replay UI with scrub/step/playback controls;
          - English/Hindi archive controls and trust messaging;
          - 22 focused tests over the Phase 18 baseline.

          Imported replay data never becomes the live player game and cannot update trusted statistics, achievements, streaks, Daily history, settings, or per-mode records. JSON self-consistency is not proof of authorship or anti-cheat authenticity.

          ## Final maintained CI gate

          ```text
          Final verification staging commit: $GITHUB_SHA
          Runtime source trigger: $SOURCE_SHA
          CI run: $CI_RUN
          CI job: $CI_JOB
          Result: SUCCESS
          Date: 2026-08-15
          Runner: ubuntu-24.04
          Flutter: 3.47.0 stable
          Dart: 3.13.0
          DevTools: 2.60.0
          Formatting: PASS - $FORMAT_COUNT files, 0 changed
          Static analysis: PASS - No issues found
          Automated tests: PASS - 183/183
          Flutter Web release build: PASS - build/web produced
          Flutter Web WASM dry run: PASS
          ```

          The verification staging commit changes workflow/documentation only; runtime application source is the source tree rooted at `$SOURCE_SHA`.

          ## Current runtime native matrix

          ```text
          Workflow: Platform Builds
          Runtime commit: $SOURCE_SHA
          Run: $PLATFORM_RUN
          Result: SUCCESS

          Android release APK
            Job: $ANDROID_JOB
            flutter build apk --release: PASS

          Linux release
            Job: $LINUX_JOB
            flutter build linux --release: PASS

          Windows release
            Job: $WINDOWS_JOB
            flutter build windows --release: PASS

          macOS and unsigned iOS release
            Job: $APPLE_JOB
            macOS release build: PASS
            unsigned iOS release build: PASS
          ```

          This supersedes the Phase 18 matrix as the latest hosted multi-platform compilation evidence.

          ## Focused regression additions

          ```text
          test/replay_archive_test.dart                8
          test/replay_capture_store_test.dart          3
          test/replay_capture_controller_test.dart     4
          test/replay_archive_screen_test.dart         4
          test/replay_archive_navigation_test.dart     1
          test/replay_archive_localization_test.dart   2
          ------------------------------------------------
          Phase 19 additions                          22
          ```

          The total regression suite moved from 161 in Phase 18 to 183 in Phase 19.

          ## Earlier clean behavioral gate

          Before the final documentation/native qualification pass, permanent CI run `31871817119` / job `94981543084` on commit `4a16608c9f8e94de529ef79ca5d213a81b66baae` passed formatting, analysis, 183/183 tests, Web release, and WASM dry run. It is retained as earlier behavioral evidence, while the final gate above is the current qualification record.

          ## Transparent intermediate failures

          Phase 19 retains helper/formatting/documentation automation failures in `what_changed.md`. The failures that occurred before target source/document commits are not treated as passing evidence. The first combined TESTING/CHANGELOG/work-log helper also failed before push, so its ephemeral edits were not counted until split successful helpers committed them later.

          ## Release boundary

          Green hosted CI and native compilation do not by themselves promote stable `1.0.0`. Remaining manual release checks include physical-device lifecycle/gameplay, real clipboard behavior for large replay archives, long replay responsiveness and timer cleanup, 4,096-event boundary behavior, English/Hindi large-text and assistive-technology checks, native branding review, signing/provisioning/notarization, and store metadata/review.
          EOF
          git add docs/PHASE_19_VERIFICATION.md
          git commit -m "docs: add Phase 19 final verification record"

      - name: Update canonical verification
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path('docs/VERIFICATION.md')
          text = path.read_text()
          marker = '## Phase 19 - Portable Full-Session Replay Archives\n'
          if marker not in text:
              intro_end = text.find('\n## ')
              section = f'''\n\n## Phase 19 - Portable Full-Session Replay Archives\n\nDate: **2026-08-15**\n\n```text\nRuntime source trigger: {os.environ['SOURCE_SHA']}\nFinal CI staging commit: {os.environ['GITHUB_SHA']}\nCI run: {os.environ['CI_RUN']}\nCI job: {os.environ['CI_JOB']}\nResult: SUCCESS\nFlutter: 3.47.0 stable\nDart: 3.13.0\nDevTools: 2.60.0\nFormatting: PASS - {os.environ['FORMAT_COUNT']} files, 0 changed\nStatic analysis: PASS - No issues found\nTests: PASS - 183/183\nWeb release: PASS\nWeb WASM dry run: PASS\n\nPlatform Builds run: {os.environ['PLATFORM_RUN']}\nAndroid APK: PASS - job {os.environ['ANDROID_JOB']}\nLinux: PASS - job {os.environ['LINUX_JOB']}\nWindows: PASS - job {os.environ['WINDOWS_JOB']}\nmacOS: PASS - job {os.environ['APPLE_JOB']}\nunsigned iOS: PASS - job {os.environ['APPLE_JOB']}\n```\n\nPhase 19 adds 22 focused tests over the Phase 18 total of 161 and qualifies the portable spectator-only Full Replay Archive runtime. Imported replay remains isolated from trusted player state. Hosted compilation still does not replace physical-device, assistive-technology, clipboard, long-session performance, signing, or store qualification.\n\nFocused details: [`PHASE_19_VERIFICATION.md`](PHASE_19_VERIFICATION.md).\n'''
              if intro_end < 0:
                  text += section
              else:
                  text = text[:intro_end] + section + text[intro_end:]
              path.write_text(text)
          PY
          git add docs/VERIFICATION.md
          git commit -m "docs: promote Phase 19 verification as current evidence"

      - name: Index focused Phase 19 verification
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/README.md')
          text = path.read_text()
          row = '| [`PHASE_19_VERIFICATION.md`](PHASE_19_VERIFICATION.md) | Focused Phase 19 portable full-replay, 183-test, Web/WASM, and native-matrix acceptance record. |\n'
          if 'PHASE_19_VERIFICATION.md' not in text:
              anchor = '| [`PHASE_18_VERIFICATION.md`](PHASE_18_VERIFICATION.md)'
              pos = text.find(anchor)
              if pos >= 0:
                  text = text[:pos] + row + text[pos:]
              else:
                  text += '\n' + row
              path.write_text(text)
          PY
          git add docs/README.md
          git commit -m "docs: index Phase 19 verification"

      - name: Record final testing evidence
        run: |
          cat >> docs/TESTING.md <<EOF

          ## Phase 19 final current-source qualification

          Final maintained CI on the finished runtime/documentation state:

          ```text
          Runtime source trigger: $SOURCE_SHA
          Final CI staging commit: $GITHUB_SHA
          CI run: $CI_RUN
          CI job: $CI_JOB
          Formatting: PASS - $FORMAT_COUNT files, 0 changed
          Static analysis: PASS - No issues found
          Tests: PASS - 183/183
          Web release: PASS
          Web WASM dry run: PASS
          Platform Builds run: $PLATFORM_RUN - SUCCESS
          ```

          The final CI staging commit contains no later runtime behavior change; the native matrix qualifies runtime source at `$SOURCE_SHA`. Manual replay clipboard/performance/accessibility/lifecycle checks remain outside automated evidence.
          EOF
          git add docs/TESTING.md
          git commit -m "docs: record final Phase 19 testing evidence"

      - name: Record latest native platform matrix
        run: |
          cat >> docs/PLATFORMS.md <<EOF

          ## Phase 19 current runtime hosted build matrix

          Latest hosted native-build evidence is Platform Builds run `$PLATFORM_RUN` on runtime commit `$SOURCE_SHA`:

          - Android release APK - PASS - job `$ANDROID_JOB`;
          - Linux release - PASS - job `$LINUX_JOB`;
          - Windows release - PASS - job `$WINDOWS_JOB`;
          - macOS release - PASS - job `$APPLE_JOB`;
          - unsigned iOS release - PASS - job `$APPLE_JOB`.

          This supersedes Phase 18 as the current hosted compilation record. It verifies compile/package success only; physical-device replay clipboard behavior, long replay responsiveness, lifecycle/timer cleanup, assistive-technology quality, signed distribution, and store qualification remain manual requirements.
          EOF
          git add docs/PLATFORMS.md
          git commit -m "docs: record Phase 19 native build matrix"

      - name: Record maintained CI evidence
        run: |
          cat >> docs/CI_CD.md <<EOF

          ## Phase 19 final maintained workflow evidence

          Runtime source trigger `$SOURCE_SHA` received successful Platform Builds run `$PLATFORM_RUN`. Final maintained CI on staging commit `$GITHUB_SHA` completed as run `$CI_RUN`, job `$CI_JOB`, with clean formatting ($FORMAT_COUNT files, 0 changed), clean analysis, 183/183 tests, Web release, and Web WASM dry run.

          Native jobs also succeeded: Android `$ANDROID_JOB`, Linux `$LINUX_JOB`, Windows `$WINDOWS_JOB`, and macOS plus unsigned iOS `$APPLE_JOB`. The staging commit changes verification workflow/documentation only, so the qualified runtime behavior remains the source tree at `$SOURCE_SHA`.
          EOF
          git add docs/CI_CD.md
          git commit -m "docs: record Phase 19 maintained workflow evidence"

      - name: Add Phase 19 final verification to changelog
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path('CHANGELOG.md')
          text = path.read_text()
          line = f"- Phase 19 final portable replay gate: CI `{os.environ['CI_RUN']}` / job `{os.environ['CI_JOB']}` passed formatting, analysis, **183/183 tests**, Web release, and WASM dry run; Platform Builds `{os.environ['PLATFORM_RUN']}` passed Android `{os.environ['ANDROID_JOB']}`, Linux `{os.environ['LINUX_JOB']}`, Windows `{os.environ['WINDOWS_JOB']}`, and macOS + unsigned iOS `{os.environ['APPLE_JOB']}` on runtime source `{os.environ['SOURCE_SHA']}`.\n"
          if 'Phase 19 final portable replay gate' not in text:
              text = text.replace('### Verification\n', '### Verification\n' + line, 1)
              path.write_text(text)
          PY
          git add CHANGELOG.md
          git commit -m "docs: record Phase 19 final verification in changelog"

      - name: Finalize what changed log
        run: |
          cat >> what_changed.md <<EOF

          ## Final Phase 19 maintained acceptance and native matrix

          The complete Phase 19 runtime was frozen after protocol, persistence, controller, UI, localization, tests, and documentation were synchronized. A genuine `lib/**` source-level maintenance-contract commit then triggered the permanent maintained runtime workflows:

          ```text
          Runtime source trigger: $SOURCE_SHA
          docs: codify replay archive trust boundary in source
          ```

          Final maintained CI is recorded on the verification staging commit, which changes workflow/documentation only and therefore does not alter runtime application behavior:

          ```text
          Final CI staging commit: $GITHUB_SHA
          CI run: $CI_RUN
          CI job: $CI_JOB
          Result: SUCCESS
          Flutter: 3.47.0 stable
          Dart: 3.13.0
          DevTools: 2.60.0
          Formatting: PASS - $FORMAT_COUNT files, 0 changed
          Static analysis: PASS - No issues found
          Automated tests: PASS - 183/183
          Flutter Web release: PASS - build/web produced
          Flutter Web WASM dry run: PASS
          ```

          Current runtime native matrix:

          ```text
          Platform Builds run: $PLATFORM_RUN
          Runtime commit: $SOURCE_SHA
          Result: SUCCESS

          Android release APK: PASS - job $ANDROID_JOB
          Linux release: PASS - job $LINUX_JOB
          Windows release: PASS - job $WINDOWS_JOB
          macOS release: PASS - job $APPLE_JOB
          unsigned iOS release: PASS - job $APPLE_JOB
          ```

          This supersedes Phase 18 as the latest hosted multi-platform compilation evidence. The total regression suite remains 183/183, exactly 22 above the Phase 18 total of 161.

          Phase 19 is accepted by the maintained automated gates. No helper parse/transport/formatting failure is being treated as passing evidence; all such intermediate failures remain recorded above.

          Stable `1.0.0` remains intentionally unpromoted. Manual release boundaries still include physical Android/iOS gameplay and lifecycle checks, real TalkBack/VoiceOver/Narrator/browser-screen-reader behavior, real large replay clipboard handling, long replay responsiveness and timer cleanup, the 4,096-event boundary on representative devices, English/Hindi large-text behavior, native splash/icon review, signing/provisioning/notarization, and store metadata/review.

          Focused permanent verification is available at:

          ```text
          docs/PHASE_19_VERIFICATION.md
          ```
          EOF
          git add what_changed.md
          git commit -m "docs: finalize Phase 19 acceptance work log"

      - name: Remove temporary Phase 19 workflows and push evidence
        run: |
          git ls-files '.github/workflows/phase19-*.yml' | xargs -r git rm
          git commit -m "chore: remove Phase 19 final verification helpers"
          git pull --rebase origin main
          git push origin main
