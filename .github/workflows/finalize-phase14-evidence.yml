name: Finalize Phase 14 Evidence

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-phase14-evidence.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Append final evidence
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q '^## Phase 14 Final Verification Addendum$' what_changed.md; then
            echo '' | base64 --decode >> what_changed.md
          fi
          if ! grep -q '^### Final Phase 14 verification addendum$' CHANGELOG.md; then
            echo '' | base64 --decode >> CHANGELOG.md
          fi

      - name: Remove helper workflow
        run: git rm .github/workflows/finalize-phase14-evidence.yml

      - name: Commit final evidence
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: finalize Phase 14 verification evidence"
          git pull --rebase origin main
          git push origin HEAD:main
