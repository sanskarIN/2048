name: Append Phase 15 Development Log

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/append-phase15-log.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: append-phase15-development-log
  cancel-in-progress: false

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Append Phase 15 and remove temporary files
        shell: bash
        run: |
          cat .github/phase15-log-append.md >> what_changed.md
          git rm .github/phase15-log-append.md
          git rm .github/workflows/append-phase15-log.yml
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
          git add what_changed.md
          git commit -m "docs: record Phase 15 challenge code implementation"
          git pull --rebase origin main
          git push origin main
