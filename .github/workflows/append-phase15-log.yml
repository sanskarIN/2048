name: Append Phase 15 Development Log

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/append-phase15-log.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: append-phase15-development-log
  cancel-in-progress: false

jobs:
  append:
    runs-on: ubuntu-latest
    env:
      P1: "","P2":"","P3":"","P4":""
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Append Phase 15 and remove helper
        shell: bash
        run: |
          python3 -c 'import base64, os; payload="".join(os.environ[f"P{i}"] for i in range(1, 5)); open("what_changed.md", "ab").write(base64.b64decode(payload))'
          git rm .github/workflows/append-phase15-log.yml
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
          git add what_changed.md
          git commit -m "docs: record Phase 15 challenge code implementation"
          git pull --rebase origin main
          git push origin main
