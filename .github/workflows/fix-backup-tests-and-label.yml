name: Fix Backup Tests And Label

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-backup-tests-and-label.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply small fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          test = Path('test/game_backup_test.dart')
          text = test.read_text(encoding='utf-8')
          text = text.replace(
              "    final oversized = 'x' * (GameBackup.maxEncodedLength + 1);",
              "    final oversized = List.filled(GameBackup.maxEncodedLength + 1, 'x').join();",
          )
          test.write_text(text, encoding='utf-8')

          home = Path('lib/features/home/home_screen.dart')
          text = home.read_text(encoding='utf-8')
          old = "                    label: const Text('Continue Game'),"
          new = "                    label: Text(\n                      controller.currentGameIsUnranked\n                          ? 'Continue Unranked Backup'\n                          : 'Continue Game',\n                    ),"
          if old in text:
              text = text.replace(old, new, 1)
          home.write_text(text, encoding='utf-8')
          PY
          dart format test/game_backup_test.dart lib/features/home/home_screen.dart

      - name: Remove one-time workflow
        run: git rm .github/workflows/fix-backup-tests-and-label.yml

      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git add test/game_backup_test.dart lib/features/home/home_screen.dart .github/workflows/fix-backup-tests-and-label.yml
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: clarify unranked backup continuation"
          git pull --rebase origin main
          git push origin HEAD:main
