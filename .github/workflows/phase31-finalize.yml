name: Phase 31 Documentation Finalizer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase31-finalize.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase31-documentation-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Apply Phase 31 documentation synchronization
        run: python3 tool/phase31_finalize.py

      - name: Verify expected documentation changes
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '# Phase 31 — Read-only release qualification status reporting' what_changed.md
          grep -Fq 'release_qualification_status.dart' docs/RELEASE_QUALIFICATION.md
          grep -Fq 'QUALIFICATION_STATUS.md' docs/README.md
          grep -Fq 'Read-only Version 1.5 qualification status reporter' CHANGELOG.md

      - name: Remove one-shot finalizer
        run: rm -f tool/phase31_finalize.py .github/workflows/phase31-finalize.yml

      - name: Commit synchronized documentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'sanskarIN'
          git config user.email 'sanskarin@outlook.in'
          git add CHANGELOG.md docs/README.md docs/RELEASE_QUALIFICATION.md what_changed.md tool/phase31_finalize.py .github/workflows/phase31-finalize.yml
          if git diff --cached --quiet; then
            echo 'No Phase 31 documentation changes were required.'
            exit 0
          fi
          git commit -m 'docs: finalize Phase 31 qualification reporting'
          git push origin HEAD:main
