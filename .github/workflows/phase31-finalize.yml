name: Phase 31 Finalize

on:
  push:
    branches: [main]
    paths:
      - docs/PHASE_31_TRIGGER.md

permissions:
  contents: write

concurrency:
  group: phase31-finalize-${{ github.ref }}
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Finalize Phase 31 source and documentation
        shell: bash
        run: |
          git pull --rebase origin main

          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_required(path, old, new):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'marker not found in {path}: {old!r}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          def insert_after_once(path, marker, insertion, sentinel):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if sentinel in text:
                  return
              if marker not in text:
                  raise SystemExit(f'marker not found in {path}: {marker!r}')
              file.write_text(text.replace(marker, marker + insertion, 1), encoding='utf-8')

          def append_once(path, heading, body):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if heading in text:
                  return
              file.write_text(text.rstrip() + '\n\n' + body.strip() + '\n', encoding='utf-8')

          replace_required(
              'tool/repository_audit.dart',
              "continuity.contains('**Current phase:** Phase 30')",
              "continuity.contains('**Current phase:** Phase 31')",
          )
          replace_required(
              'tool/repository_audit.dart',
              'what_changed.md must identify Phase 30 as the current phase.',
              'what_changed.md must identify Phase 31 as the current phase.',
          )
          replace_required(
              'test/current_release_state_test.dart',
              'primary continuity header points at Phase 30 state',
              'primary continuity header points at Phase 31 state',
          )
          replace_required(
              'test/current_release_state_test.dart',
              "contains('**Current phase:** Phase 30')",
              "contains('**Current phase:** Phase 31')",
          )
          replace_required(
              'docs/REPOSITORY_AUDIT.md',
              'the continuity log identifies the current Phase 30 state;',
              'the continuity log identifies the current Phase 31 state;',
          )

          insert_after_once(
              'README.md',
              '| Qualification evidence recorder | [`docs/QUALIFICATION_RECORDER.md`](docs/QUALIFICATION_RECORDER.md) |',
              '\n| Repository integrity audit | [`docs/REPOSITORY_AUDIT.md`](docs/REPOSITORY_AUDIT.md) |',
              'docs/REPOSITORY_AUDIT.md',
          )
          insert_after_once(
              'docs/README.md',
              '| [`PHASE_30_VERIFICATION.md`](PHASE_30_VERIFICATION.md) | Phase 30 recorder implementation, safety boundaries, regression coverage, and manual-evidence boundary. |',
              '\n| [`REPOSITORY_AUDIT.md`](REPOSITORY_AUDIT.md) | Required-file, release-state, temporary-workflow, and local Markdown-link integrity audit used by permanent CI. |\n| [`PHASE_31_VERIFICATION.md`](PHASE_31_VERIFICATION.md) | Final repository-integrity, open-source hygiene, release-state drift, and documentation-hardening record. |',
              'REPOSITORY_AUDIT.md',
          )
          insert_after_once(
              'docs/RELEASE_CHECKLIST.md',
              '- [x] `dart run tool/release_readiness.dart --json` validates candidate metadata/manifest structure',
              '\n- [x] `dart run tool/repository_audit.dart --json` validates required repository files, release-state consistency, temporary-workflow cleanup, and local Markdown links',
              'tool/repository_audit.dart --json',
          )
          insert_after_once(
              'ROADMAP.md',
              '- Evidence-backed release qualification infrastructure: `docs/release_qualification.json`, `docs/RELEASE_QUALIFICATION.md`, and `tool/release_readiness.dart` keep normal release-candidate CI usable while making strict stable-release mode fail until every required real-world qualification item has recorded passed evidence and release metadata is actually `1.5.0`.',
              '\n- Permanent repository-integrity auditing now fails CI on required-file omissions, current-version/qualification drift, leftover one-shot maintenance files, and broken local Markdown documentation links while keeping external-link reachability and real-device qualification outside the deterministic audit boundary.',
              'Permanent repository-integrity auditing now fails CI',
          )
          insert_after_once(
              'CHANGELOG.md',
              '## [Unreleased]',
              '\n\n### Final repository hardening\n\n- Added a permanent repository-integrity audit CLI and process-level fixtures for required files, release-state consistency, local Markdown links, temporary workflow cleanup, and version/qualification drift.\n- Fixed the stale current-release regression that still expected Phase 29 after the Phase 30 continuity update.\n- Added `.editorconfig`, `.gitattributes`, GitHub funding metadata, and issue-template support/security routing without changing deterministic gameplay or the 0/13 real-world qualification boundary.\n- Wired the repository audit into permanent CI and documented the final Phase 31 maintenance boundary.\n',
              '### Final repository hardening',
          )

          append_once(
              'docs/CI_CD.md',
              '## Repository integrity audit',
              '''
          ## Repository integrity audit

          Permanent CI runs `dart run tool/repository_audit.dart --json` after the release-candidate readiness check. The audit fails on required repository-file omissions, package/runtime/qualification version drift, leftover known one-shot maintenance paths, and broken repository-local Markdown links. It is deterministic and offline: it does not crawl external websites and it does not replace physical-device, accessibility, signing, or store qualification.

          The audit implementation is `tool/repository_audit.dart`; its maintenance contract is documented in `docs/REPOSITORY_AUDIT.md` and process-level failure modes are covered by `test/repository_audit_cli_test.dart`.
          ''',
          )
          append_once(
              'docs/TESTING.md',
              '## Repository audit regression coverage',
              '''
          ## Repository audit regression coverage

          `test/repository_audit_cli_test.dart` executes the repository-audit CLI against isolated temporary roots. It covers a clean fixture, broken local Markdown links, runtime/package version drift, qualification-candidate drift, forbidden temporary maintenance files, and unclosed Markdown-fence warnings. `test/current_release_state_test.dart` also guards the permanent CI invocation so the audit cannot silently disappear from the maintained gate.

          The live CI command is `dart run tool/repository_audit.dart --json`. A passing audit is source/repository evidence only and must not be interpreted as completion of the 13 real-world manual qualification checks.
          ''',
          )
          append_once(
              'docs/DEVELOPMENT.md',
              '## Repository integrity before committing',
              '''
          ## Repository integrity before committing

          In addition to formatting, analysis, and tests, run `dart run tool/repository_audit.dart --json` before submitting documentation/release-maintenance changes. It detects missing required project files, current-version and qualification-manifest drift, known temporary maintenance leftovers, and broken local Markdown links. See `docs/REPOSITORY_AUDIT.md` for scope and limitations.
          ''',
          )
          append_once(
              'CONTRIBUTING.md',
              '## Repository integrity check',
              '''
          ## Repository integrity check

          Before opening a pull request that changes documentation, release metadata, workflows, or project structure, run `dart run tool/repository_audit.dart --json` from the repository root. Fix broken local links and release-state drift rather than bypassing the check. External website availability and the manual 13-item real-world release qualification remain separate responsibilities.
          ''',
          )

          phase31 = Path('docs/PHASE_31_VERIFICATION.md')
          if not phase31.exists():
              phase31.write_text('''# Phase 31 Verification — Final Repository Integrity and Open-Source Hardening

Date: 2026-08-18

## Scope

Phase 31 is the final source-controlled hardening pass for the Version `1.5.0+15` release-candidate line. It does not add a new gameplay subsystem. The focus is preventing repository, documentation, release-state, and open-source-maintenance drift before real-world qualification.

## Defect fixed

`test/current_release_state_test.dart` still asserted that `what_changed.md` identified Phase 29 even after Phase 30 correctly became the current continuity phase. The stale regression would have failed the next complete test run. The assertion was updated before finalization and then advanced with the Phase 31 continuity state.

## Repository integrity tooling

Added `tool/repository_audit.dart` and wired it into permanent CI. The audit validates required project/open-source/release/workflow files, package/runtime/qualification version consistency, the current continuity phase and 0/13 manual boundary, absence of known temporary Phase 30 maintenance files, and repository-local Markdown destinations without making network requests.

Added `test/repository_audit_cli_test.dart` with process-level fixtures covering clean acceptance, broken local-link rejection, runtime marketing-version drift, qualification-candidate drift, temporary-workflow rejection, and unclosed Markdown-fence warnings. `test/current_release_state_test.dart` additionally guards the permanent CI wiring.

## Open-source hygiene

Added:

- `.editorconfig` for cross-editor text consistency;
- `.gitattributes` for text/binary classification;
- `.github/FUNDING.yml` for the existing project support destinations;
- `.github/ISSUE_TEMPLATE/config.yml` to disable unstructured blank issues and route support/security questions to the maintained policies.

No credential, signing secret, analytics service, account system, cloud dependency, advertising SDK, or new runtime package was introduced.

## Documentation

Added `docs/REPOSITORY_AUDIT.md` and indexed the audit in the root/documentation maps. Updated CI/CD, testing, development, contributing, release-checklist, roadmap, changelog, and continuity documentation so the maintained source and release process describe the same gate.

## Deliberate non-changes

- The Android namespace/application ID remains `com.sanskarin.nova_2048`. Its Gradle namespace, application ID, Kotlin package, and manifest activity resolution are internally consistent; changing it during final hardening would create application-identity/update risk rather than fix a demonstrated defect.
- AGP 9.3.x remains deferred under issue #10; the qualified baseline stays AGP 9.1.0, Kotlin 2.4.10, Gradle 9.7.0, and JDK 17 until the documented upstream/toolchain problem is defensibly resolved.
- GitHub `main` branch protection remains an external repository-setting task tracked by issue #12.
- No optional cloud/account/camera-scanner subsystem was added because the existing offline-first feature set is complete for this release line and late scope expansion would increase release risk.

## Qualification boundary

`docs/release_qualification.json` remains the source of truth for the 13 representative real-world checks. Phase 31 does not synthesize physical-device, assistive-technology, clipboard/file/browser/email-handler, long-session, native-branding, signing/provisioning, or store-distribution evidence. Stable release promotion must remain fail-closed until those checks are genuinely performed and recorded.

## Automated acceptance

The Phase 29 full CI/native evidence remains the last previously accepted evidence until a newer maintained workflow result is explicitly retrieved and recorded. Phase 31 source changes are intentionally not described as green merely because they were committed. Permanent CI now contains the formatter, analyzer, complete test suite, release-candidate gate, repository audit, stable fail-closed check, solver smoke run, and warning-enforced Web release build.
''', encoding='utf-8')

          log = Path('what_changed.md')
          text = log.read_text(encoding='utf-8')
          text = re.sub(
              r'^- \*\*Current phase:\*\*.*$',
              '- **Current phase:** Phase 31 — final repository-integrity and open-source hardening complete in source control, including the Phase 30 guarded release-qualification evidence recorder, permanent local-document/release-state auditing, open-source maintenance metadata, and stale-current-state regression repair; the latest previously accepted full CI/native evidence remains the Phase 29 Version 1.5 baseline until a newer maintained workflow result is explicitly recorded; the stable qualification boundary remains 0/13 and GitHub issues #10 and #12 remain explicit',
              text,
              count=1,
              flags=re.MULTILINE,
          )
          phase_heading = '## Phase 31 — Final repository integrity and open-source hardening'
          if phase_heading not in text:
              text = text.rstrip() + '''

## Phase 31 — Final repository integrity and open-source hardening

Date: 2026-08-18

The final source-controlled hardening pass fixed a stale current-phase regression, added the permanent `tool/repository_audit.dart` gate with process-level failure fixtures, wired it into CI, added repository/editor/funding/issue-routing hygiene files, and synchronized the repository audit across README, documentation index, CI/CD, testing, development, contribution, release-checklist, roadmap, changelog, and focused Phase 31 verification documentation.

The audit now fails closed on required-file omissions, runtime/package/qualification version drift, known temporary maintenance leftovers, and broken local Markdown destinations while remaining deterministic/offline. It does not substitute network reachability checks or any of the 13 representative real-world qualification items.

No deterministic game-engine behavior, player-save trust boundary, Challenge Code protocol, Backup unranked policy, Replay spectator policy, Auto Play isolation, localization architecture, platform runner, package identity, or runtime dependency was changed during this final hardening pass.

The manual stable-release boundary remains 0/13. AGP issue #10 and repository-protection issue #12 remain explicit external/toolchain tasks rather than being hidden or falsely marked complete.
'''
          log.write_text(text.rstrip() + '\n', encoding='utf-8')
          PY

          rm -f docs/PHASE_31_TRIGGER.md .github/workflows/phase31-finalize.yml
          git add -A
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
          git commit -m "docs: finalize phase 31 repository hardening"
          git pull --rebase origin main
          git push origin HEAD:main
