name: Finalize Version 1.5 Evidence Once
# Registered on main; this maintainer-authored edit triggers the one-shot run.

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-v15-evidence-once.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Record accepted final automated evidence
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          phase = Path('docs/PHASE_30_VERIFICATION.md')
          text = phase.read_text(encoding='utf-8')
          old = "The formatter commit above is objective evidence that the initial audit/test Dart files reached the repository-managed formatter. A newer complete CI result for the final source is **not** claimed here until the maintained verification PR completes and is inspected."
          new = """The formatter commit above is objective evidence that the initial audit/test Dart files reached the repository-managed formatter.

### Final accepted Version 1.5 automated verification

The formatter-clean Version 1.5 source commit `e94965bdb7e464cdd1076f247d0f10977ab20c19` was verified through comment-only PR #18. The verification branch changed no behavior and was closed unmerged after all maintained checks completed, leaving `main` on the exact formatter-clean source.

Accepted evidence:

- CI run `32142335530`, job `95727735420`: **SUCCESS** on Flutter 3.47.0 / Dart 3.13.0; 112 Dart files formatter-clean; analyzer clean; 262/262 tests passed; release-candidate readiness gate passed; repository integrity audit passed; strict stable gate correctly remained closed at 0/13; deterministic solver smoke passed; WASM dry-run passed; Web release build passed without missing-font warnings.
- Dependency Review run `32142335654`: **SUCCESS**.
- Platform Builds run `32142335514`: **SUCCESS** across Android release APK + AAB (job `95727735642`), Linux release (`95727735432`), Windows release (`95727735566`), and macOS + unsigned iOS release (`95727735651`), including packaging, SHA-256 checksum generation, and artifact upload.

This is automated source/build evidence only. It does not change `docs/release_qualification.json`, which remains 0/13 until the required real-device, accessibility, external-handler, distribution-signing/provisioning, branding, and store-metadata checks are genuinely performed."""
          if old not in text:
              raise SystemExit('Expected Phase 30 stale-evidence marker was not found')
          phase.write_text(text.replace(old, new, 1), encoding='utf-8')

          log = Path('what_changed.md')
          log_text = log.read_text(encoding='utf-8')
          marker = '## Phase 30 final automated Version 1.5 acceptance'
          if marker not in log_text:
              log_text += """

## Phase 30 final automated Version 1.5 acceptance

- Formatter-clean source: `e94965bdb7e464cdd1076f247d0f10977ab20c19`.
- Verification PR #18 was comment-only and closed unmerged after acceptance, preserving the exact formatter-clean source on `main`.
- CI run `32142335530`, job `95727735420`: SUCCESS — Flutter 3.47.0 / Dart 3.13.0, 112 Dart files formatter-clean, analyzer clean, 262/262 tests, candidate release gate, repository audit, deterministic solver smoke, WASM dry-run, and Web release build all passed; strict stable gate correctly remained closed.
- Dependency Review run `32142335654`: SUCCESS.
- Platform Builds run `32142335514`: SUCCESS — Android APK/AAB job `95727735642`, Linux `95727735432`, Windows `95727735566`, macOS + unsigned iOS `95727735651`, including checksums and qualification-artifact upload.
- Manual stable-release qualification remains 0/13. No physical-device, assistive-technology, real external-handler, private distribution-signing/provisioning, branding-presentation, or store-metadata evidence was synthesized.
"""
              log.write_text(log_text, encoding='utf-8')
          PY

          git rm .github/workflows/finalize-v15-evidence-once.yml
          git add docs/PHASE_30_VERIFICATION.md what_changed.md
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
          git commit -m "docs: record final Version 1.5 automated acceptance"
          git push origin HEAD:main
