name: Finalize Phase 16 Evidence

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/phase16-finalize.yml

permissions:
  contents: write

concurrency:
  group: phase16-final-evidence
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply final verified evidence
        shell: bash
        run: |
          python3 .phase16_finalization.py
          git config user.name Sanskar
          git config user.email sanskarin@outlook.in

          commit_file() {
            file="$1"
            message="$2"
            git add "$file"
            if ! git diff --cached --quiet; then
              git commit -m "$message"
            fi
          }

          commit_file docs/TESTING.md "docs: record Phase 16 localization test evidence"
          commit_file docs/VERIFICATION.md "docs: record Phase 16 localization verification"
          commit_file CHANGELOG.md "docs: record final Phase 16 quality gates"
          commit_file docs/LOCALIZATION.md "docs: add verified localization build evidence"
          commit_file what_changed.md "docs: record complete Phase 16 localization work"

          rm .phase16_finalization.py .phase16_log.md .github/workflows/phase16-finalize.yml
          git add -u .phase16_finalization.py .phase16_log.md .github/workflows/phase16-finalize.yml
          git commit -m "chore: remove Phase 16 finalization helpers"

          git pull --rebase origin main
          git push origin HEAD:main
