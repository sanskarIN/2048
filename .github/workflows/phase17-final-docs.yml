name: Phase 17 final verification docs

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/phase17-final-docs.yml

permissions:
  contents: write

jobs:
  finalize-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure commit identity
        run: |
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"

      - name: Prepend Phase 17 canonical verification
        env:
          VER_B64: 
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          path = Path('docs/VERIFICATION.md')
          text = path.read_text()
          if '## Phase 17 — Trusted per-mode records' in text:
              raise SystemExit('Phase 17 canonical verification already present')
          intro = 'This document records objective automated evidence for the current 2048 Nova release-candidate line. It distinguishes formatter/analyzer/test/Web verification, native compilation evidence, transparent intermediate failures, and manual release boundaries.\n'
          if intro not in text:
              raise SystemExit('Verification intro marker not found')
          section = base64.b64decode(os.environ['VER_B64']).decode('utf-8')
          path.write_text(text.replace(intro, intro + section, 1))
          PY
          git add docs/VERIFICATION.md
          git commit -m "docs: record Phase 17 canonical verification"

      - name: Index the focused verification record
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/README.md')
          text = path.read_text()
          row = '| [`PHASE_17_VERIFICATION.md`](PHASE_17_VERIFICATION.md) | Focused Phase 17 trusted per-mode-record acceptance history and final 144-test Web/WASM gate. |\n'
          if row not in text:
              marker = '| [`VERIFICATION.md`](VERIFICATION.md) | Compact current automated verification record. |\n'
              if marker not in text:
                  raise SystemExit('Documentation verification row not found')
              text = text.replace(marker, marker + row, 1)
          path.write_text(text)
          PY
          git add docs/README.md
          git commit -m "docs: index Phase 17 verification evidence"

      - name: Record final Phase 17 testing evidence
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/TESTING.md')
          text = path.read_text()
          heading = '## Phase 17 final maintained gate'
          if heading not in text:
              text += '''\n\n## Phase 17 final maintained gate\n\nThe permanent `CI` workflow run `31867499047` on commit `c443f9fde0cc243269be57515772378c06284e86` is the authoritative Phase 17 automated acceptance result. Flutter 3.47.0 / Dart 3.13.0 formatted 74 files with 0 changes, reported no analyzer issues, passed **144/144 tests**, built the Flutter Web release successfully, and passed the Web WASM dry run.\n\nThe two prior acceptance attempts remain documented rather than hidden: run `31867316152` caught an unused test local during analysis; run `31867370893` reached 142 passing / 2 failing tests because the localized Statistics widget harness incorrectly expected combined mode-record metadata to be split into separate `Text` widgets. Commits `f42a8ab18edd4661a066419de0daa84a2ce22f85` and `c443f9fde0cc243269be57515772378c06284e86` corrected those test-quality issues before the final green gate.\n\nSee [`PHASE_17_VERIFICATION.md`](PHASE_17_VERIFICATION.md) for the focused acceptance record.\n'''
          path.write_text(text)
          PY
          git add docs/TESTING.md
          git commit -m "docs: record final Phase 17 test gate"

      - name: Extend release qualification checklist
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/RELEASE_CHECKLIST.md')
          text = path.read_text()
          automated = '- [x] Trusted per-mode best-score/highest-tile persistence, legacy migration, ranked reset baseline, imported-backup isolation, locally seeded ranking, and English/Hindi Statistics presentation are regression tested in the 144-test Phase 17 gate\n'
          if automated not in text:
              marker = '- [x] Normal new local game exits imported unranked policy\n'
              if marker not in text:
                  raise SystemExit('Release checklist automated marker not found')
              text = text.replace(marker, marker + automated, 1)
          manual = '- [ ] Verify per-mode record cards, board/target metadata, Statistics reset baselines, and imported-backup exclusion during representative full-game sessions\n'
          if manual not in text:
              marker = '- [ ] Verify statistics and achievements during representative full-game sessions\n'
              if marker not in text:
                  raise SystemExit('Release checklist manual marker not found')
              text = text.replace(marker, marker + manual, 1)
          accessibility = '- [ ] Verify expanded per-mode Statistics cards and localized board/target metadata with TalkBack, VoiceOver, representative desktop/browser screen reader, large text, English, and हिन्दी\n'
          if accessibility not in text:
              marker = '- [ ] Verify high contrast and non-color tile-value identification\n'
              if marker not in text:
                  raise SystemExit('Release checklist accessibility marker not found')
              text = text.replace(marker, accessibility + marker, 1)
          path.write_text(text)
          PY
          git add docs/RELEASE_CHECKLIST.md
          git commit -m "docs: add Phase 17 release qualification checks"

      - name: Add Phase 17 verification to changelog
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('CHANGELOG.md')
          text = path.read_text()
          bullet = '- Phase 17 trusted per-mode records final gate: CI run `31867499047` on commit `c443f9fde0cc243269be57515772378c06284e86` used Flutter 3.47.0 / Dart 3.13.0; formatting passed with 74 files / 0 changes, analysis reported no issues, **144/144 tests passed**, the Web release build succeeded, and the WASM dry run passed.\n'
          if bullet not in text:
              marker = '### Verification\n\n'
              if marker not in text:
                  raise SystemExit('CHANGELOG Verification marker not found')
              extra = bullet + '- Phase 17 acceptance history remains visible: CI `31867316152` caught an unused test local during analysis, and CI `31867370893` reached 142 passed / 2 failed because localized combined metadata was incorrectly asserted as separate widgets; both test-quality defects were corrected before the final green gate.\n'
              text = text.replace(marker, marker + extra, 1)
          path.write_text(text)
          PY
          git add CHANGELOG.md
          git commit -m "docs: record Phase 17 final gate in changelog"

      - name: Append final Phase 17 work log
        env:
          LOG_B64: 
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          path = Path('what_changed.md')
          text = path.read_text()
          heading = '## Final Phase 17 maintained acceptance gate'
          if heading not in text:
              text += base64.b64decode(os.environ['LOG_B64']).decode('utf-8')
          path.write_text(text)
          PY
          git add what_changed.md
          git commit -m "docs: finalize Phase 17 work log"

      - name: Remove helper and push final documentation commits
        run: |
          git rm .github/workflows/phase17-final-docs.yml
          git commit -m "chore: remove Phase 17 final docs helper"
          git pull --rebase origin main
          git push origin HEAD:main
