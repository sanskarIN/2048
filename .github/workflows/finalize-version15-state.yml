name: Version 1.5 Final State Synchronizer

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-version15-state.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: version15-final-state-synchronizer
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Synchronize current Version 1.5 records
        run: python3 .github/scripts/finalize_version15_state.py

      - name: Remove temporary synchronizer inputs
        run: rm -f .github/workflows/finalize-version15-state.yml .github/scripts/finalize_version15_state.py

      - name: Commit final Version 1.5 state
        shell: bash
        run: |
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
          git add CHANGELOG.md ROADMAP.md docs/VERIFICATION.md what_changed.md test/current_release_state_test.dart .github/workflows/finalize-version15-state.yml .github/scripts/finalize_version15_state.py
          if git diff --cached --quiet; then
            echo "Version 1.5 current-state records are already synchronized."
            exit 0
          fi
          git commit -m "chore: finalize Version 1.5 release-candidate state"
          git pull --rebase origin main
          git push origin HEAD:main
