name: Phase 19 user documentation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase19-docs-user.yml'

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure commit identity
        run: |
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
      - name: Update Phase 19 user documentation
        env:
          SCRIPT_B64: ""
        run: |
          echo "$SCRIPT_B64" | base64 --decode > /tmp/update_docs.py
          python3 /tmp/update_docs.py
      - name: Commit user guide
        run: |
          git add docs/USER_GUIDE.md
          git commit -m "docs: add full replay archive user guide"
      - name: Commit development guide
        run: |
          git add docs/DEVELOPMENT.md
          git commit -m "docs: define replay archive development rules"
      - name: Commit FAQ
        run: |
          git add docs/FAQ.md
          git commit -m "docs: answer full replay archive questions"
      - name: Commit troubleshooting
        run: |
          git add docs/TROUBLESHOOTING.md
          git commit -m "docs: add full replay archive troubleshooting"
      - name: Remove helper and push
        run: |
          git rm .github/workflows/phase19-docs-user.yml
          git commit -m "chore: remove Phase 19 user documentation helper"
          git pull --rebase origin main
          git push origin main
