name: Phase 19 core documentation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase19-docs-core.yml'

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure commit identity
        run: |
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
      - name: Update core Phase 19 documentation
        env:
          SCRIPT_B64: ""
        run: |
          echo "$SCRIPT_B64" | base64 --decode > /tmp/update_docs.py
          python3 /tmp/update_docs.py
      - name: Commit README
        run: |
          git add README.md
          git commit -m "docs: add full replay archives to project overview"
      - name: Commit architecture
        run: |
          git add docs/ARCHITECTURE.md
          git commit -m "docs: define full replay archive architecture"
      - name: Commit storage
        run: |
          git add docs/DATA_STORAGE.md
          git commit -m "docs: document replay capture persistence"
      - name: Commit privacy
        run: |
          git add docs/PRIVACY.md
          git commit -m "docs: document full replay archive privacy"
      - name: Remove helper and push
        run: |
          git rm .github/workflows/phase19-docs-core.yml
          git commit -m "chore: remove Phase 19 core documentation helper"
          git pull --rebase origin main
          git push origin main
