name: Phase 17 changelog and work log

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/phase17-log.yml

permissions:
  contents: write

jobs:
  phase17-log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure commit identity
        run: |
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"

      - name: Update release-facing changelog
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('CHANGELOG.md')
          text = path.read_text()
          sentinel = 'Trusted local **per-mode records**'
          if sentinel in text:
              raise SystemExit('Phase 17 changelog entries already exist')
          added = '''### Added\n- Trusted local **per-mode records** for best score and highest tile, with best-score board-size/target metadata, backward-compatible persistence, and localized expandable Statistics cards.\n- Ten focused Phase 17 regression tests covering per-mode serialization/migration, ranked tracking/reset behavior, imported-backup isolation, and English/Hindi Statistics presentation.\n'''
          changed = '''### Changed\n- Statistics reset now clears historical per-mode records while rebuilding only the observable baseline for a ranked active session; an imported unranked session rebuilds none.\n- Ranked legacy current games can seed missing per-mode records during startup repair without inventing records for historical games that are no longer observable.\n'''
          security = '''### Security\n- Portable/editable Game Backup progress is excluded from per-mode record updates across import, continued moves, restart restoration, and statistics reset.\n- Persisted per-mode record values are sanitized/bounded before use, and unknown future mode keys are ignored.\n'''
          if text.count('### Added\n') < 1 or text.count('### Changed\n') < 1 or text.count('### Security\n') < 1:
              raise SystemExit('Expected changelog sections not found')
          text = text.replace('### Added\n', added, 1)
          text = text.replace('### Changed\n', changed, 1)
          text = text.replace('### Security\n', security, 1)
          path.write_text(text)
          PY
          git add CHANGELOG.md
          git commit -m "docs: add Phase 17 per-mode records to changelog"

      - name: Append detailed Phase 17 work log
        env:
          PHASE17_LOG_B64: 
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path
          path = Path('what_changed.md')
          text = path.read_text()
          heading = '# Phase 17 — Trusted per-mode records'
          if heading in text:
              raise SystemExit('Phase 17 work log already exists')
          entry = base64.b64decode(os.environ['PHASE17_LOG_B64']).decode('utf-8')
          path.write_text(text + entry)
          PY
          git add what_changed.md
          git commit -m "docs: record complete Phase 17 implementation work"

      - name: Remove helper and push
        run: |
          git rm .github/workflows/phase17-log.yml
          git commit -m "chore: remove Phase 17 changelog helper"
          git pull --rebase origin main
          git push origin HEAD:main
