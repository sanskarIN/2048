name: Append Phase 11 Progress

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/append-phase11-progress.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Append verified Phase 11 evidence
        shell: bash
        run: |
          set -euo pipefail
          cat .github/phase11-progress-addendum.md >> what_changed.md
          git rm .github/phase11-progress-addendum.md
          git rm .github/workflows/append-phase11-progress.yml

      - name: Commit progress log and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          git add what_changed.md .github
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
          git commit -m "docs: finalize phase eleven development log"
          git pull --rebase origin main
          git push origin HEAD:main
