name: Phase 20 guide localization

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase20-guide-l10n.yml'

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure commit identity
        run: |
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
      - name: Add Hindi guide translation
        env:
          BLOCK_B64: ""
        run: |
          echo "$BLOCK_B64" | base64 --decode > /tmp/phase20_guide_hi.txt
          python3 -c 'from pathlib import Path; p=Path("lib/core/localization/hindi_translations.dart"); t=p.read_text(); b=Path("/tmp/phase20_guide_hi.txt").read_text(); i=t.rfind("};"); key="Home can open Game Backup to copy one validated current-game JSON backup to the clipboard, save the same backup as a .nova2048 file"; p.write_text(t if key in t else t[:i]+b+t[i:])'
          git add lib/core/localization/hindi_translations.dart
          git commit -m "feat: localize file backup guide"
      - name: Remove helper and push
        run: |
          git rm .github/workflows/phase20-guide-l10n.yml
          git commit -m "chore: remove Phase 20 guide localization helper"
          git pull --rebase origin main
          git push origin HEAD:main
