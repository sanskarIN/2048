name: Phase 18 solver localization

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/phase18-localization.yml

permissions:
  contents: write

jobs:
  localize-solver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure commit identity
        run: |
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"

      - name: Add Hindi solver strategy strings
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('lib/core/localization/hindi_translations.dart')
          text = path.read_text()
          if "'Deterministic local solver demonstration'" in text:
              raise SystemExit('Phase 18 solver translations already exist')
          addition = """  'Deterministic local solver demonstration':\n      'निर्धारक स्थानीय सॉल्वर प्रदर्शन',\n  'Choose the fast heuristic or a bounded expectimax search. Both run only inside this isolated deterministic sandbox, never change your saved game, statistics, achievements, or Daily history, and never consume the live game RNG. Normal Hint remains the fast heuristic and is not replaced by expectimax.':\n      'तेज़ ह्यूरिस्टिक या सीमित एक्सपेक्टिमैक्स खोज चुनें। दोनों केवल इस अलग निर्धारक सैंडबॉक्स में चलते हैं, आपके सेव गेम, आँकड़े, उपलब्धियाँ या डेली हिस्ट्री को कभी नहीं बदलते और लाइव गेम RNG का उपयोग नहीं करते। सामान्य संकेत तेज़ ह्यूरिस्टिक ही रहता है और उसे एक्सपेक्टिमैक्स से नहीं बदला जाता।',\n  'Strategy': 'रणनीति',\n  'Search nodes': 'खोज नोड',\n  'Heuristic': 'ह्यूरिस्टिक',\n  'Expectimax': 'एक्सपेक्टिमैक्स',\n"""
          marker = '};\n'
          index = text.rfind(marker)
          if index < 0:
              raise SystemExit('Translation map terminator not found')
          path.write_text(text[:index] + addition + text[index:])
          PY
          git add lib/core/localization/hindi_translations.dart
          git commit -m "feat: localize solver strategy controls in Hindi"

      - name: Remove temporary helper and push
        run: |
          git rm .github/workflows/phase18-localization.yml
          git commit -m "chore: remove Phase 18 localization helper"
          git pull --rebase origin main
          git push origin HEAD:main
