name: Format Version 1.6 Widget Test Once

on:
  push:
    branches:
      - feature/v1.6-custom-mode-builder
    paths:
      - .github/workflows/format-v16-test-once.yml

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: feature/v1.6-custom-mode-builder

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: false

      - name: Install dependencies
        run: flutter pub get

      - name: Canonically format Dart source
        run: dart format lib test tool

      - name: Commit canonical formatting and remove helper
        run: |
          git rm .github/workflows/format-v16-test-once.yml
          git add lib test tool
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
          git commit -m "style: canonically format Version 1.6 widget test"
          git push origin HEAD:feature/v1.6-custom-mode-builder
