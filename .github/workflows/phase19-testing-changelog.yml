name: Phase 19 testing and changelog records

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase19-testing-changelog.yml'

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure commit identity
        run: |
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
      - name: Update testing documentation
        env:
          BLOCK_B64: ""
        run: |
          if ! grep -q '^## Phase 19 — Full Replay Archive regression coverage$' docs/TESTING.md; then printf '\n' >> docs/TESTING.md; echo "$BLOCK_B64" | base64 --decode >> docs/TESTING.md; fi
          git add docs/TESTING.md
          git commit -m "docs: record Phase 19 replay regression coverage"
      - name: Update changelog
        env:
          ADDED_B64: ""
          CHANGED_B64: ""
          VER_B64: "LSBQaGFzZSAxOSBmaXJzdCBjbGVhbiByZXBsYXkgZ2F0ZTogQ0kgYDMxODcxODE3MTE5YCBvbiBgNGExNjYwOGM5ZjhlOTRkZTUyOWVmNzljYTVkMjEzYTgxYjY2YmFhZWAgcGFzc2VkIGZvcm1hdHRpbmcgKDg4IGZpbGVzLCAwIGNoYW5nZXMpLCBhbmFseXNpcywgKioxODMvMTgzIHRlc3RzKiosIFdlYiByZWxlYXNlLCBhbmQgV2ViIFdBU00gZHJ5IHJ1bi4="
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          p = Path('CHANGELOG.md')
          t = p.read_text()
          added = base64.b64decode(os.environ['ADDED_B64']).decode()
          changed = base64.b64decode(os.environ['CHANGED_B64']).decode()
          ver = base64.b64decode(os.environ['VER_B64']).decode()
          if 'Portable spectator-only **Full Replay Archives**' not in t:
              t = t.replace('### Added\n', '### Added\n' + added + '\n', 1)
          if '`GameEngine.move` accepts an optional event time' not in t:
              t = t.replace('### Changed\n', '### Changed\n' + changed + '\n', 1)
          if 'Phase 19 first clean replay gate' not in t:
              t = t.replace('### Verification\n', '### Verification\n' + ver + '\n', 1)
          p.write_text(t)
          PY
          git add CHANGELOG.md
          git commit -m "docs: add full replay archives to changelog"
      - name: Remove helper and push
        run: |
          git rm .github/workflows/phase19-testing-changelog.yml
          git commit -m "chore: remove Phase 19 testing changelog helper"
          git pull --rebase origin main
          git push origin main
