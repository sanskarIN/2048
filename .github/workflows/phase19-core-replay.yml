name: Phase 19 core replay implementation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase19-core-replay.yml'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure commit identity
        run: |
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"

      - name: Add deterministic replay event clock
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/domain/game_engine.dart')
          text = path.read_text()
          old = '''  MoveOutcome move(GameState state, Direction direction) {
            refreshStatus(state);'''
          new = '''  MoveOutcome move(
            GameState state,
            Direction direction, {
            DateTime? now,
          }) {
            refreshStatus(state, now: now);'''
          if old not in text:
              raise SystemExit('move signature anchor missing')
          text = text.replace(old, new, 1)
          old = '''      refreshStatus(state);
                return const MoveOutcome(changed: false, scoreGain: 0, merges: 0);'''
          new = '''      refreshStatus(state, now: now);
                return const MoveOutcome(changed: false, scoreGain: 0, merges: 0);'''
          if old not in text:
              raise SystemExit('invalid move refresh anchor missing')
          text = text.replace(old, new, 1)
          old = '''    refreshStatus(state);
            return MoveOutcome('''
          new = '''    refreshStatus(state, now: now);
            return MoveOutcome('''
          if old not in text:
              raise SystemExit('final move refresh anchor missing')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          git add lib/domain/game_engine.dart
          git commit -m "feat: add deterministic replay event clock"

      - name: Remove repaired helper and push
        run: |
          git rm .github/workflows/phase19-core-replay.yml
          git commit -m "chore: remove Phase 19 core replay helper"
          git push origin main
