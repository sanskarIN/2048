name: Phase 19 core replay implementation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase19-core-replay.yml'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure commit identity
        run: |
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"

      - name: Add deterministic replay event clock
        env:
          PATCH_B64: 
        run: |
          echo "$PATCH_B64" | base64 --decode > /tmp/patch.py
          python3 /tmp/patch.py
          git add lib/domain/game_engine.dart
          git commit -m "feat: add deterministic replay event clock"

      - name: Add full-session replay archive protocol
        env:
          PATCH_B64: 
        run: |
          echo "$PATCH_B64" | base64 --decode > /tmp/patch.py
          python3 /tmp/patch.py
          git add lib/domain/replay_archive.dart
          git commit -m "feat: add full-session replay archive protocol"

      - name: Persist bounded replay capture
        env:
          PATCH_B64: 
        run: |
          echo "$PATCH_B64" | base64 --decode > /tmp/patch.py
          python3 /tmp/patch.py
          git add lib/data/local_store.dart
          git commit -m "feat: persist bounded full-session replay capture"

      - name: Record replay actions in app controller
        env:
          PATCH_B64:  VucmFua2VkID0gZmFsc2U7XG4iCiAgICAiICBSZXBsYXlDYXB0dXJlPyBfcmVwbGF5Q2FwdHVyZTtcbiIsCiAgICAxLAp9CnRleHQgPSB0ZXh0LnJlcGxhY2UoCiAgICAiICBib29sIGdldCBjdXJyZW50R2FtZUlzVW5yYW5rZWQgPT4gZ2FtZSAhPSBudWxsICYmIF9jdXJyZW50R2FtZV 
        run: |
          echo "$PATCH_B64" | base64 --decode > /tmp/patch.py
          python3 /tmp/patch.py
          git add lib/app/state/app_controller.dart
          git commit -m "feat: record full-session replay actions"

      - name: Remove helper and push
        run: |
          git rm .github/workflows/phase19-core-replay.yml
          git commit -m "chore: remove Phase 19 core replay helper"
          git push origin main
