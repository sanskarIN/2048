name: Finalize Phase 11 Log

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-phase11-log.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for objective verification
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TARGET_CI_SHA="$(git rev-parse HEAD)"
          TARGET_CODE_SHA="$(git log -1 --format=%H -- lib/)"
          CI_RUN_ID=""
          PLATFORM_RUN_ID=""

          for _ in $(seq 1 120); do
            CI_DATA="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${TARGET_CI_SHA}&per_page=5")"
            CI_RUN_ID="$(printf '%s' "$CI_DATA" | jq -r '.workflow_runs[0].id // empty')"
            CI_STATUS="$(printf '%s' "$CI_DATA" | jq -r '.workflow_runs[0].status // empty')"
            CI_CONCLUSION="$(printf '%s' "$CI_DATA" | jq -r '.workflow_runs[0].conclusion // empty')"
            if [[ "$CI_STATUS" == "completed" ]]; then
              [[ "$CI_CONCLUSION" == "success" ]] || { echo "CI concluded: $CI_CONCLUSION"; exit 1; }
              break
            fi
            sleep 5
          done
          [[ -n "$CI_RUN_ID" ]] || { echo "No CI run found for $TARGET_CI_SHA"; exit 1; }
          CI_STATE="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CI_RUN_ID}" --jq '.status + ":" + (.conclusion // "")')"
          [[ "$CI_STATE" == "completed:success" ]] || { echo "CI did not finish successfully: $CI_STATE"; exit 1; }

          for _ in $(seq 1 180); do
            PLATFORM_DATA="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/platform-builds.yml/runs?head_sha=${TARGET_CODE_SHA}&per_page=5")"
            PLATFORM_RUN_ID="$(printf '%s' "$PLATFORM_DATA" | jq -r '.workflow_runs[0].id // empty')"
            PLATFORM_STATUS="$(printf '%s' "$PLATFORM_DATA" | jq -r '.workflow_runs[0].status // empty')"
            PLATFORM_CONCLUSION="$(printf '%s' "$PLATFORM_DATA" | jq -r '.workflow_runs[0].conclusion // empty')"
            if [[ "$PLATFORM_STATUS" == "completed" ]]; then
              [[ "$PLATFORM_CONCLUSION" == "success" ]] || { echo "Platform builds concluded: $PLATFORM_CONCLUSION"; exit 1; }
              break
            fi
            sleep 5
          done
          [[ -n "$PLATFORM_RUN_ID" ]] || { echo "No platform build run found for $TARGET_CODE_SHA"; exit 1; }
          PLATFORM_STATE="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PLATFORM_RUN_ID}" --jq '.status + ":" + (.conclusion // "")')"
          [[ "$PLATFORM_STATE" == "completed:success" ]] || { echo "Platform builds did not finish successfully: $PLATFORM_STATE"; exit 1; }

          echo "TARGET_CI_SHA=$TARGET_CI_SHA" >> "$GITHUB_ENV"
          echo "TARGET_CODE_SHA=$TARGET_CODE_SHA" >> "$GITHUB_ENV"
          echo "CI_RUN_ID=$CI_RUN_ID" >> "$GITHUB_ENV"
          echo "PLATFORM_RUN_ID=$PLATFORM_RUN_ID" >> "$GITHUB_ENV"

      - name: Append Phase 11 development and verification record
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import subprocess

          repo = os.environ['GITHUB_REPOSITORY']
          ci_run = os.environ['CI_RUN_ID']
          platform_run = os.environ['PLATFORM_RUN_ID']
          ci_sha = os.environ['TARGET_CI_SHA']
          code_sha = os.environ['TARGET_CODE_SHA']

          def gh_json(path):
              raw = subprocess.check_output(['gh', 'api', path], text=True)
              return json.loads(raw)

          ci_jobs = gh_json(f'repos/{repo}/actions/runs/{ci_run}/jobs?per_page=100')['jobs']
          ci_job = next(job for job in ci_jobs if job['name'] == 'Format, analyze, test, web build')
          ci_steps = {step['name']: step.get('conclusion') for step in ci_job['steps']}

          platform_jobs = gh_json(f'repos/{repo}/actions/runs/{platform_run}/jobs?per_page=100')['jobs']
          platform_lines = []
          for job in platform_jobs:
              builds = []
              for step in job['steps']:
                  name = step['name']
                  if 'build' in name.lower() or 'release' in name.lower():
                      builds.append(f"{name}: {step.get('conclusion')}")
              details = '; '.join(builds)
              suffix = f" — {details}" if details else ''
              platform_lines.append(f"- {job['name']}: **{str(job.get('conclusion')).upper()}**{suffix}")

          commit_log = subprocess.check_output(
              ['git', 'log', '--since=2026-08-14T05:15:00Z', '--format=- `%H` — `%s`'],
              text=True,
          ).strip()

          addendum = f'''

---

## 2026-08-14 — Phase 11 continued hardening and completeness pass

### Scope completed

This continuation audited the release-candidate behavior against the project master prompt and tightened correctness, persistence integrity, accessibility, interaction safety, hints, Daily Challenge history, statistics, documentation, and automated regression coverage without promoting the version beyond `0.9.0+1`.

Completed work includes:

- blocked game mutation after a non-Endless target is reached until the player explicitly acknowledges the win;
- preserved win/streak accounting when continuing beyond a target and across application restarts;
- applied terminal statistics when timed challenges expire without a move;
- reconciled restored timed/challenge status during startup before a stale session can be resumed;
- strictly validated persisted configuration types, modes, board dimensions, counters, RNG state, score invariants, status, win acknowledgement, timestamps, and save schemas;
- safely recovered malformed settings/statistics/achievement values;
- filtered undo snapshots from other sessions and preserved lifetime best score across Undo;
- self-healed partially corrupt undo and Daily Challenge collections instead of discarding valid neighboring records;
- deduplicated Daily Challenge history by UTC date seed, preserving the stronger score/move pairing, peak tile, completion/win state, and newest update timestamp;
- prevented weaker Daily replays from downgrading the saved best result;
- added confirmation before replacing a recoverable current game from mode selection or Daily Challenge entry points;
- removed misleading Continue behavior for completed/lost saved games;
- protected terminal win/game-over dialogs from accidental barrier/back dismissal;
- added deterministic heuristic hints using empty-cell mobility, immediate merge value, highest-tile corner placement, monotonicity, smoothness, and deterministic tie-breaking without consuming game RNG;
- suppressed hints for terminal games;
- added H/U/P/Escape/R desktop shortcuts and visible shortcut guidance;
- limited one-second challenge refresh work to timed games only;
- added board-size and row/column tile semantics for assistive technologies;
- added average moves/merges statistics and clarified active-session-safe statistics reset behavior;
- added direct GitHub bug-report-template access plus in-app release notes and credits;
- expanded README, architecture, testing, accessibility, roadmap, hint-solver, guide, and changelog documentation;
- removed the previously broken one-time progress-finalizer workflow before continuing repository work.

### Regression coverage added/expanded

Focused tests were added or expanded for:

- win acknowledgement and terminal movement blocking;
- win streak preservation after continue and relaunch;
- timed challenge expiry statistics and startup reconciliation;
- malformed settings, statistics, achievements, game configuration, game state, and Daily records;
- stale undo session filtering and lifetime best-score preservation;
- local persistence self-repair and Daily history deduplication;
- Daily replay best-result preservation;
- terminal hint suppression and deterministic hint-solver immutability/quality boundaries;
- board and positional tile accessibility semantics;
- recoverable-game replacement confirmation;
- lost-game Home state;
- keyboard shortcuts and terminal-dialog route-back protection;
- statistics reset while a game is active.

### Transparent CI defect found and fixed during this pass

A real analyzer failure occurred in CI run `31773193609` after a new controller test referenced `ThemeMode` without importing Flutter Material. It was not hidden or treated as a canceled superseded run. Commit `21c08cb6df5b89f9cbac3f9a65a6ac164404fef3` (`fix: import material theme mode in controller tests`) corrected the regression before the continuation proceeded.

### Phase 11 commit trail

{commit_log}

### Final automated quality verification

```text
Verification commit: {ci_sha}
CI workflow run: {ci_run}
Formatting: {ci_steps.get('Verify formatting')}
Static analysis: {ci_steps.get('Static analysis')}
Automated tests: {ci_steps.get('Run tests')}
Web release build: {ci_steps.get('Build web release')}
Overall CI job: {ci_job.get('conclusion')}
```

The final quality gate verifies the complete source/test state used by this continuation. The one-time finalizer itself only appends this documentation record and removes its own workflow file after verification.

### Final native release-build verification for production code

```text
Production-code head used for latest native build trigger: {code_sha}
Platform Builds workflow run: {platform_run}
```

{chr(10).join(platform_lines)}

The native workflow remains a hosted-runner compilation/build verification. The iOS job is intentionally unsigned, as signing/provisioning credentials are not stored in the repository.

### Release-candidate status after Phase 11

- Project/version remains **2048 Nova `0.9.0+1`**.
- No known automated formatter, analyzer, test, Web build, or configured native build blocker remains in the verified state above.
- Repository automation continues to use `Sanskar <sanskarin@outlook.in>` for repository-writing workflow commits.
- Work was split into meaningful atomic Conventional Commits; artificial no-op commit spam was not used.
- `what_changed.md` remains the primary continuity/evidence record rather than relying on chat history.

### Remaining manual release boundaries before 1.0.0

Automated success is not a claim of absolute zero bugs or universal device readiness. Before promotion to `1.0.0`, the remaining release qualification includes:

- physical Android and iOS gameplay/lifecycle/save-resume testing;
- touch/gesture checks across representative screen sizes and orientations;
- VoiceOver/TalkBack and representative desktop/browser screen-reader testing;
- keyboard/focus/shortcut checks on representative desktop/browser environments;
- long-session, Daily, timed, move-limit, win/continue, restart, and Undo testing;
- real browser/email-handler verification;
- native splash/icon presentation review;
- store signing/provisioning and distribution packaging;
- final store/privacy metadata, listing, and screenshot review where required.

Optional post-stable work such as broader localization, import/export, replay visualization, deeper visual-regression matrices, and an isolated advanced AI demonstration mode remains non-blocking and must not destabilize the verified core.
'''

          path = pathlib.Path('what_changed.md')
          path.write_text(path.read_text(encoding='utf-8') + addendum, encoding='utf-8')
          PY

      - name: Remove one-time finalizer
        run: git rm .github/workflows/finalize-phase11-log.yml

      - name: Commit final progress record
        run: |
          set -euo pipefail
          git add what_changed.md .github/workflows/finalize-phase11-log.yml
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
          git commit -m "docs: finalize phase eleven verification log"
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin main
          git push origin HEAD:main
