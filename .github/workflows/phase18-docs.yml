name: Phase 18 advanced solver documentation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/phase18-docs.yml

permissions:
  contents: write

jobs:
  phase18-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure commit identity
        run: |
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"

      - name: Update project overview
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('README.md')
          text = path.read_text()
          text = text.replace(
            'an isolated Auto Play demonstration, statistics, achievements',
            'an isolated Auto Play demonstration with heuristic and bounded expectimax strategies, deterministic solver benchmarks, statistics, achievements',
          )
          old = '- Optional **Auto Play Demo** with pause/resume, single-step control, speed selection, deterministic seed reset, and demo-only metrics. It uses an isolated heuristic sandbox and never writes player saves, lifetime statistics, achievements, or Daily history.'
          new = '- Optional **Auto Play Demo** with pause/resume, single-step control, speed selection, deterministic seed reset, Heuristic/Expectimax strategy selection, visible expectimax search-node diagnostics, and demo-only metrics. Both strategies run in the isolated sandbox and never write player saves, lifetime statistics, achievements, or Daily history.'
          if old not in text:
              raise SystemExit('README Auto Play feature marker not found')
          text = text.replace(old, new, 1)
          old = 'The optional Auto Play Demo reuses this heuristic inside its own seeded in-memory Endless sandbox, where automatic demo moves remain separate from the player\'s game and records.\n\nSee [`docs/HINT_SOLVER.md`](docs/HINT_SOLVER.md).'
          new = 'The optional Auto Play Demo keeps Heuristic as its fast default and also offers a bounded deterministic Expectimax strategy. Expectimax models every empty-cell 2/4 spawn using the game\'s 90%/10% probabilities, uses explicit search-depth/node limits, and never consumes the live game RNG while evaluating candidates. Both strategies stay inside the seeded in-memory Endless sandbox, where automatic demo moves remain separate from the player\'s game and records.\n\nA reusable seeded benchmark suite and CLI compare the strategies reproducibly without touching player data. See [`docs/HINT_SOLVER.md`](docs/HINT_SOLVER.md) and [`docs/SOLVER_BENCHMARKS.md`](docs/SOLVER_BENCHMARKS.md).'
          if old not in text:
              raise SystemExit('README solver section marker not found')
          text = text.replace(old, new, 1)
          text = text.replace(
            '| Hint + Auto Play | [`docs/HINT_SOLVER.md`](docs/HINT_SOLVER.md) |',
            '| Hint + Auto Play | [`docs/HINT_SOLVER.md`](docs/HINT_SOLVER.md) |\n| Solver strategies + benchmarks | [`docs/SOLVER_BENCHMARKS.md`](docs/SOLVER_BENCHMARKS.md) |',
            1,
          )
          path.write_text(text)
          PY
          git add README.md
          git commit -m "docs: add advanced solver to project overview"

      - name: Update documentation index
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/README.md')
          text = path.read_text()
          text = text.replace(
            'read-only Replay, an isolated heuristic Auto Play Demo, portable current-game backup/restore',
            'read-only Replay, an isolated Heuristic/Expectimax Auto Play Demo with deterministic solver benchmarks, portable current-game backup/restore',
          )
          old = '| [`HINT_SOLVER.md`](HINT_SOLVER.md) | Deterministic heuristic Hint and Auto Play Demo behavior and limitations. |'
          new = '| [`HINT_SOLVER.md`](HINT_SOLVER.md) | Deterministic heuristic Hint plus isolated Heuristic/Expectimax Auto Play behavior and limitations. |\n| [`SOLVER_BENCHMARKS.md`](SOLVER_BENCHMARKS.md) | Bounded expectimax design, node limits, sandbox trust boundary, deterministic benchmark library, and CLI harness. |'
          if old not in text:
              raise SystemExit('docs index solver row not found')
          text = text.replace(old, new, 1)
          old = '- **Auto Play sandbox:** `lib/domain/autoplay_session.dart`.'
          new = '- **Auto Play sandbox:** `lib/domain/autoplay_session.dart`.\n- **Advanced solver:** `lib/domain/expectimax_solver.dart`.\n- **Solver benchmark library:** `lib/domain/solver_benchmark.dart`.'
          if old not in text:
              raise SystemExit('docs source-of-truth solver marker not found')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          git add docs/README.md
          git commit -m "docs: index expectimax and solver benchmarks"

      - name: Advance roadmap
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('ROADMAP.md')
          text = path.read_text()
          old = '- Isolated deterministic **Auto Play Demo** with pause/resume, single-step control, speed selection, seed reset, and strict separation from player saves/statistics/achievements/Daily history.'
          new = '- Isolated deterministic **Auto Play Demo** with pause/resume, single-step control, speed selection, seed reset, selectable Heuristic/bounded-Expectimax strategies, visible search-node diagnostics, a deterministic benchmark suite/CLI, and strict separation from player saves/statistics/achievements/Daily history.'
          if old not in text:
              raise SystemExit('ROADMAP completed Auto Play marker not found')
          text = text.replace(old, new, 1)
          optional = '- Optional expectimax or another advanced solver behind the already-isolated Auto Play Demo boundary, plus a benchmark suite.\n'
          if optional not in text:
              raise SystemExit('ROADMAP expectimax optional marker not found')
          text = text.replace(optional, '- Optional deeper/adaptive or alternative solver strategies only if they preserve the existing Auto Play sandbox, deterministic benchmark coverage, explicit resource limits, and normal Hint behavior.\n', 1)
          manual_marker = '- Long-session and real-device Daily/timed/move-limit/Undo/win-continue testing.\n'
          addition = '- Representative Auto Play Heuristic/Expectimax strategy switching, pause behavior, performance/responsiveness, localization, and accessibility checks on real targets.\n'
          if addition not in text:
              text = text.replace(manual_marker, manual_marker + addition, 1)
          path.write_text(text)
          PY
          git add ROADMAP.md
          git commit -m "docs: mark bounded expectimax roadmap work complete"

      - name: Extend architecture documentation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/ARCHITECTURE.md')
          text = path.read_text()
          heading = '## Phase 18 advanced solver boundary'
          if heading not in text:
              text += '''\n\n## Phase 18 advanced solver boundary\n\nPhase 18 extends only the isolated Auto Play domain. `lib/domain/expectimax_solver.dart` owns bounded look-ahead search; `lib/domain/solver_benchmark.dart` owns reproducible seeded benchmark aggregation; `AutoplaySession` chooses between `heuristic` and `expectimax`. None of those types depends on `AppController`, `LocalStore`, SharedPreferences, accounts, network services, analytics, or Flutter widgets.\n\nNormal `GameEngine.hint()` still delegates to `HintSolver`; expectimax is deliberately **not** inserted into the player Hint path. This preserves fast suggestion-only gameplay behavior and prevents a potentially heavier search from becoming an invisible cost of pressing Hint.\n\nExpectimax player nodes choose a legal direction. Chance nodes enumerate every empty cell and both real spawn values (`2` at 90%, `4` at 10%). Search is bounded by depth and an explicit maximum explored-node count. Hypothetical boards are copies, so search does not consume the sandbox or live-game RNG. Only after `AutoplaySession` chooses one direction does its isolated seeded `GameEngine` execute the real move/spawn.\n\nChanging Auto Play strategy clears only decision diagnostics and pauses the UI timer. It does not reset the sandbox board, score, moves, or RNG. Reset Seed recreates the sandbox opening while retaining the selected strategy. The benchmark runner creates fresh seeded sandbox sessions and returns metrics only; it has no path to trusted player persistence.\n'''
          path.write_text(text)
          PY
          git add docs/ARCHITECTURE.md
          git commit -m "docs: define bounded expectimax architecture boundary"

      - name: Extend development guide
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/DEVELOPMENT.md')
          text = path.read_text()
          heading = '## Solver strategy and benchmark changes'
          if heading not in text:
              text += '''\n\n## Solver strategy and benchmark changes\n\nNormal Hint and Auto Play strategy work have different performance/trust contracts. Keep normal Hint in `hint_solver.dart` fast, read-only, and suggestion-only. Advanced automatic strategies belong behind `AutoplaySession`, not in `AppController`.\n\nFor expectimax or future search changes:\n\n- never consume live/sandbox RNG while evaluating hypothetical boards;\n- simulate on defensive board copies;\n- preserve deterministic ordering/tie behavior;\n- keep explicit search-depth and node/work bounds;\n- test legal/no-move behavior, input immutability, resource limits, and larger boards;\n- keep Auto Play state in memory only;\n- do not write statistics, achievements, Daily history, saves, or ranking records;\n- update English/Hindi UI copy and accessibility checks when strategy controls change.\n\nRun the deterministic benchmark comparison with:\n\n```bash\ndart run tool/solver_benchmark.dart\n```\n\nOr pass a positive per-seed move budget:\n\n```bash\ndart run tool/solver_benchmark.dart 500\n```\n\nThe benchmark is a regression/performance-comparison aid, not proof of globally optimal 2048 play. See [`SOLVER_BENCHMARKS.md`](SOLVER_BENCHMARKS.md).\n'''
          path.write_text(text)
          PY
          git add docs/DEVELOPMENT.md
          git commit -m "docs: add advanced solver development workflow"

      - name: Extend privacy and testing docs
        run: |
          python - <<'PY'
          from pathlib import Path
          privacy = Path('docs/PRIVACY.md')
          text = privacy.read_text()
          heading = '## Advanced solver privacy boundary'
          if heading not in text:
              text += '''\n\n## Advanced solver privacy boundary\n\nHeuristic, bounded Expectimax, and the deterministic solver benchmark run entirely on local in-memory board state. They send no board, seed, score, decision, benchmark metric, or diagnostic to a project server or third party. No remote AI/model API is used.\n\nExpectimax is available only through the isolated Auto Play sandbox. Its search-node count and expected-value calculation are transient diagnostics; they are not persisted as player data or analytics. The benchmark library/CLI creates fresh seeded sandbox sessions and writes no project preference key.\n'''
          privacy.write_text(text)

          testing = Path('docs/TESTING.md')
          text = testing.read_text()
          heading = '## Phase 18 advanced solver regression coverage'
          if heading not in text:
              text += '''\n\n## Phase 18 advanced solver regression coverage\n\nPhase 18 adds focused coverage for bounded Expectimax and the reusable benchmark layer on top of the Phase 17 total of 144 tests. New coverage includes deterministic/legal recommendations, terminal no-move handling, input-board immutability, explicit node-budget enforcement, larger-board support, malformed-board rejection, strategy-switch state preservation, seeded expectimax sequence reproducibility, decision diagnostics, reset behavior, deterministic benchmark summaries, heuristic zero-search-node accounting, benchmark validation, strategy-selection UI isolation, Hindi solver catalog strings, and Hindi strategy-control presentation.\n\nThe final Phase 18 test total and authoritative CI/native run IDs are recorded only after the candidate source/docs stop moving and the permanent workflows complete. Intermediate analyzer/test failures remain documented in `what_changed.md` rather than being treated as passing evidence.\n'''
          testing.write_text(text)
          PY
          git add docs/PRIVACY.md docs/TESTING.md
          git commit -m "docs: document solver privacy and regression coverage"

      - name: Extend release checklist
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/RELEASE_CHECKLIST.md')
          text = path.read_text()
          section = '''\n\n## Phase 18 solver qualification\n\nAutomated/source:\n\n- [x] Normal Hint remains heuristic-only and read-only.\n- [x] Expectimax search is deterministic for a fixed board/configuration.\n- [x] Expectimax simulates hypothetical spawns without consuming game RNG.\n- [x] Search work is bounded by explicit depth/node limits.\n- [x] Auto Play strategy switching preserves sandbox board/RNG state and trusted player isolation.\n- [x] Reusable seeded benchmark runner is deterministic and validates input.\n- [x] English/Hindi strategy controls have automated localization coverage.\n\nManual before stable release:\n\n- [ ] Verify Heuristic/Expectimax switching and node diagnostics on representative phone/desktop/web layouts.\n- [ ] Verify expectimax responsiveness on slower representative devices and confirm no UI lockup during practical single-step/Auto Play use.\n- [ ] Verify Hindi/English labels, large-text wrapping, keyboard/focus behavior, and screen-reader output for the added strategy controls/metrics.\n- [ ] Confirm long-running Auto Play remains isolated from player saves/statistics/achievements/Daily records on real targets.\n'''
          if '## Phase 18 solver qualification' not in text:
              text += section
          path.write_text(text)
          PY
          git add docs/RELEASE_CHECKLIST.md
          git commit -m "docs: add Phase 18 solver release checks"

      - name: Update changelog
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('CHANGELOG.md')
          text = path.read_text()
          if 'Bounded deterministic **Expectimax**' not in text:
              text = text.replace('### Added\n', '''### Added\n- Bounded deterministic **Expectimax** strategy for the isolated Auto Play Demo, including real 90%/10% 2/4 chance-node modeling, explicit depth/node limits, deterministic tie behavior, and non-mutating search.\n- Selectable Heuristic/Expectimax Auto Play strategy controls with visible expectimax search-node diagnostics; strategy switching pauses playback without resetting sandbox board/RNG state.\n- Reusable deterministic solver benchmark library plus `dart run tool/solver_benchmark.dart` CLI for fixed-seed Heuristic/Expectimax regression comparisons.\n- Advanced solver unit, benchmark, strategy-isolation, widget, and Hindi localization regression coverage.\n''', 1)
              text = text.replace('### Changed\n', '''### Changed\n- Normal player Hint deliberately remains the fast read-only heuristic; bounded Expectimax is available only inside the isolated Auto Play sandbox.\n- In-app Guide/About and English/Hindi solver copy now distinguish Heuristic, Expectimax, sandbox isolation, and benchmark/resource-limit boundaries.\n''', 1)
          path.write_text(text)
          PY
          git add CHANGELOG.md
          git commit -m "docs: add Phase 18 advanced solver changelog"

      - name: Append Phase 18 implementation log
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('what_changed.md')
          text = path.read_text()
          heading = '# Phase 18 — Bounded Expectimax and deterministic solver benchmarks'
          if heading not in text:
              text += '''\n\n# Phase 18 — Bounded Expectimax and deterministic solver benchmarks\n\nDate: **2026-08-15**\n\n## Starting state\n\nPhase 18 started after Phase 17 had a current-source 144/144 CI gate and a green Android/Linux/Windows/macOS/unsigned-iOS hosted native matrix. The roadmap still listed an optional advanced expectimax solver plus benchmark suite behind the already-isolated Auto Play boundary.\n\n## Scope implemented\n\nPhase 18 adds an advanced deterministic search strategy without changing trusted player gameplay:\n\n- `lib/domain/expectimax_solver.dart` — bounded deterministic expectimax search;\n- `AutoplayStrategy.heuristic` / `AutoplayStrategy.expectimax`;\n- strategy-aware `AutoplaySession` diagnostics;\n- Heuristic/Expectimax selector in Auto Play Demo;\n- visible expectimax explored-node diagnostics;\n- `lib/domain/solver_benchmark.dart` reusable seeded benchmark runner;\n- `tool/solver_benchmark.dart` deterministic CLI harness;\n- Hindi solver controls plus updated in-app Guide/About content;\n- focused unit/widget/localization regression tests;\n- complete solver/benchmark documentation.\n\nNormal `GameEngine.hint()` remains the original fast `HintSolver` path. Expectimax is deliberately sandbox-only.\n\n## Expectimax search model\n\nThe search alternates player and chance nodes. Player nodes select the highest-value legal move. Chance nodes enumerate every empty cell and both supported spawn values using the game probabilities: tile 2 at 90% and tile 4 at 10%. Search uses copied boards only and does not consume RNG while evaluating hypothetical outcomes.\n\nDefault resource bounds are:\n\n```text\nsearchDepth = 2\nmaxNodes = 50000\n```\n\nWhen the node budget is exhausted, search falls back to deterministic board evaluation. This prevents an unbounded tree from becoming an invisible device-performance cost.\n\n## Auto Play strategy behavior\n\nHeuristic remains the default. Changing to/from Expectimax:\n\n- pauses automatic playback;\n- preserves sandbox board, score, moves, and RNG state;\n- clears only prior decision diagnostics;\n- never touches `AppController` trusted player state.\n\nReset Seed recreates the deterministic opening while retaining the selected strategy.\n\n## Benchmark design\n\n`SolverBenchmark.run()` accepts a strategy, deterministic seed list, and positive per-seed move budget. It returns immutable per-seed results plus aggregate score/move/peak-tile/search-node metrics. The CLI defaults to seeds `2048`, `4096`, `8192`, `20260815` and 200 moves per seed.\n\nThe harness is for reproducible regression comparison, not a claim that one strategy is globally optimal.\n\n## Focused Phase 18 tests added before final acceptance\n\n```text\ntest/expectimax_solver_test.dart        6 tests\ntest/autoplay_strategy_test.dart        5 tests\ntest/solver_benchmark_test.dart         3 tests\ntest/solver_demo_screen_test.dart       +1 strategy-selection test\ntest/localization_test.dart             +1 solver-catalog test\ntest/solver_demo_localization_test.dart 1 Hindi UI test\n```\n\nThat is 17 focused additions over the Phase 17 total of 144, for an expected complete total of **161 tests** before final CI confirmation.\n\n## Transparent first analyzer failure\n\nThe first full Phase 18 source gate reached formatting successfully but static analysis stopped the candidate before tests:\n\n```text\nCI run: 31869526679\nCommit: 959f8a230484b0cbdf0e028eabbbe4847ef51d41\nFormatting: PASS — 79 files, 0 changed\nStatic analysis: FAIL — 9 issues\nTests: skipped\nWeb build: skipped\n```\n\nThe issues were:\n\n1. a duplicate Hindi `Strategy` key introduced when the solver-specific translation block added a key already used by the How-to-Play strategy section;\n2. eight `avoid_print` findings in the command-line benchmark harness.\n\nCorrections:\n\n- the benchmark CLI now uses `dart:io` `stdout.writeln` instead of `print`;\n- the duplicate added `Strategy` entry was removed while keeping the existing Hindi `रणनीति` translation as the single source for both Guide and Solver UI.\n\nThese defects and the failing run are retained here rather than being hidden. No test/Web success is claimed from that run.\n\n## Major Phase 18 commits\n\n```text\n9c0031de9b2185076a81cbe2b1a7f5f53bccc7de  feat: add bounded deterministic expectimax solver\nf1bd44c59cf6c8ac3f2e5e4a327405664b5275ba  feat: add selectable autoplay solver strategies\n36f467c5d0154b8d88a23d123c73eeb78504f821  test: cover bounded expectimax recommendations\nc57dde0766fae40d9c6bd88c5b6c941f5cd7bcca  test: cover expectimax autoplay strategy isolation\nbec975c05b1911e9570a5946b787e1dce52cb0b3  feat: add deterministic solver benchmark harness\nd406b850b44a80f3be1c6f8e9c8acd6fd0e5fa3c  feat: expose expectimax strategy in solver demo\n5f4c8d0d7f2a4242fec65721516f7f97e72d6766  test: cover solver demo strategy selection\n3274373f129fd7694803fd6fd90035a180557837  feat: add reusable deterministic solver benchmark suite\ndecf3cdb32d5c4842f27a4c2255780ed1ab0b6a6  refactor: use reusable solver benchmark suite\n1e8e198fa499e7ef0a29982319c8433b4dcc6ed2  test: cover deterministic solver benchmark suite\n8cee4e0cc1bb91b40b114709bf5dd5ae007ba396  fix: use stdout for solver benchmark output\n98b26714e1354f7a76d57230bee2805352ef5cd0  docs: explain solver strategies in in-app guide\n2e693af2fa3e80e54390a3756d2f8b90a2821e34  docs: add expectimax to in-app release highlights\naa23cbb1419d0dbaebabf8243ecda6d7e9c6eb0a  test: cover Hindi advanced solver translations\n9cb2f3734ca89b238eafabaf98da2c5fee66da45  test: cover Hindi expectimax solver demo UI\n11112fe91fed0d85bc9d90289965e8bd6ea479a0  docs: document expectimax solver and benchmark suite\n959f8a230484b0cbdf0e028eabbbe4847ef51d41  docs: document heuristic and expectimax solver boundary\n```\n\nAdditional small localization-helper/fix commits remain in Git history because they reflect real repository operations. Empty commits were not created solely to increase the count.\n\n## Acceptance status at this point\n\nPhase 18 is not marked accepted by this entry alone. The final permanent CI and current-source native matrix are recorded only after all source/tests/documentation stop moving and the maintained workflows complete against the final candidate. Stable `1.0.0` remains separately blocked on the documented physical-device/accessibility/signing/store qualification.\n'''
          path.write_text(text)
          PY
          git add what_changed.md
          git commit -m "docs: record complete Phase 18 implementation work"

      - name: Remove helper and push documentation commits
        run: |
          git rm .github/workflows/phase18-docs.yml
          git commit -m "chore: remove Phase 18 documentation helper"
          git pull --rebase origin main
          git push origin HEAD:main
