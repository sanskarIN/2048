name: Wire Game Backup UI

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/wire-game-backup-ui.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wire route and Home entry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          app = Path('lib/app/nova_app.dart')
          text = app.read_text(encoding='utf-8')
          import_line = "import '../features/backup/game_backup_screen.dart';\n"
          if import_line not in text:
              anchor = "import '../features/achievements/achievements_screen.dart';\n"
              if anchor not in text:
                  raise SystemExit('nova_app import anchor missing')
              text = text.replace(anchor, anchor + import_line, 1)
          route_line = "              '/backup': (_) => const GameBackupScreen(),\n"
          if route_line not in text:
              anchor = "              '/daily': (_) => const DailyChallengeScreen(),\n"
              if anchor not in text:
                  raise SystemExit('nova_app route anchor missing')
              text = text.replace(anchor, anchor + route_line, 1)
          app.write_text(text, encoding='utf-8')

          home = Path('lib/features/home/home_screen.dart')
          text = home.read_text(encoding='utf-8')
          card = "                _NavCard('Game Backup', Icons.backup_rounded, '/backup'),\n"
          if card not in text:
              anchor = "                _NavCard('Settings', Icons.tune_rounded, '/settings'),\n"
              if anchor not in text:
                  raise SystemExit('home card anchor missing')
              text = text.replace(anchor, anchor + card, 1)
          home.write_text(text, encoding='utf-8')
          PY
          dart format lib/app/nova_app.dart lib/features/home/home_screen.dart

      - name: Remove one-time workflow
        run: git rm .github/workflows/wire-game-backup-ui.yml

      - name: Commit UI wiring
        shell: bash
        run: |
          set -euo pipefail
          git add lib/app/nova_app.dart lib/features/home/home_screen.dart .github/workflows/wire-game-backup-ui.yml
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
          git commit -m "feat: surface game backup tools from home"
          git pull --rebase origin main
          git push origin HEAD:main
