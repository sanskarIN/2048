name: Finalize Progress Log

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-progress-log.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Append final hardening and verification record
        shell: bash
        run: |
          cat >> what_changed.md <<'EOF'

---

## 2026-08-14 — Final post-hardening verification addendum

### Additional hardening completed after the first release-candidate verification

The final QA pass added the following release-safety improvements without changing the intended gameplay rules:

- External destinations are now restricted to validated `https` links with a host or non-empty `mailto` links.
- Unsupported, insecure, malformed, `javascript:`, `file:`, and empty destinations are rejected.
- If an approved external destination cannot be opened by the device, the app shows a friendly message with a **Copy** action instead of exposing a raw failure.
- Daily Challenge continuation is now explicit: an available current Daily game continues normally; a completed historical run uses a confirmed **Replay** flow; an unavailable in-progress run uses a confirmed **Restart** flow.
- Persisted `GameConfig` now validates board size, target powers of two, move-limit bounds, time-limit bounds, and non-negative random seeds before use.
- `GameState` now has an explicit schema version constant, rejects unsupported future schemas, migrates legacy schema `0`, validates row dimensions and tile values, rejects negative/invalid counters, validates RNG bounds, and requires a valid persisted start time for timed challenges.
- Save validation is defensive: malformed or unsafe persisted data fails with `FormatException`, which the local-store recovery layer handles without crashing normal startup.
- New regression coverage was added for external URI policy, future-schema rejection, legacy-schema migration, invalid tiles/configuration, and timed-save timestamps.
- The dedicated Dart-format workflow now runs for `lib/**` and `test/**` changes on `main`; its post-hardening run formatted the modified save-state file and committed the result with the configured repository automation identity.

