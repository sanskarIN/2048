### Remaining non-automated release boundaries

No automated release-blocking compile, analyzer, test, or configured build failure remains in the final verified release-candidate state. This does **not** justify claiming absolute zero bugs or universal physical-device readiness. Before promoting `0.9.0+1` to `1.0.0`, the remaining manual release checklist still includes:

- physical Android/iOS device gameplay checks
- touch/gesture testing across representative screen sizes and orientations
- screen-reader testing on real supported platforms
- keyboard/focus testing on representative desktop/browser environments
- long-session save/resume and challenge testing on physical devices
- real external browser/email-handler checks
- store signing/provisioning and distribution packaging
- iOS signing/provisioning for deployable App Store/device artifacts
- final store/privacy metadata review where required by the chosen distribution channel

The project therefore remains on the **0.9.0+1 release-candidate line** until those manual/device/store checks are completed. Optional roadmap features such as advanced AI demonstration, replay/export/import, localization expansion, and deeper visual-regression matrices remain non-blocking post-stable work and must not destabilize the verified core.
EOF

      - name: Remove one-time finalization workflow
        run: git rm .github/workflows/finalize-progress-log.yml

      - name: Commit final progress record
        run: |
          git add what_changed.md .github/workflows/finalize-progress-log.yml
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
          git commit -m "docs: finalize post-hardening verification log"
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin main
          git push origin HEAD:main
