name: Phase 21 apply

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/phase21-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply and test Phase 21 changes
        run: python3 tool/phase21_apply.py
      - name: Push generated commits
        run: git push origin main
      - name: Remove temporary Phase 21 tools
        run: |
          git reset --hard HEAD
          git rm tool/phase21_apply.py .github/workflows/phase21-apply.yml
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
          git commit -m "chore: remove Phase 21 implementation tools"
          git push origin main

# Direct fast-forward sync: focused tests pass before push; generated workspace noise is discarded only after the source commits are published.
