name: Phase 16 Language Settings

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/phase16-language-settings.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Persist language in AppSettings
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/app/state/app_controller.dart')
          text = path.read_text()
          replacements = [
              ("import '../../core/theme/nova_theme.dart';", "import '../../core/localization/nova_localizations.dart';\nimport '../../core/theme/nova_theme.dart';"),
              ("    this.themeMode = ThemeMode.system,\n    this.palette = NovaPalette.classic,", "    this.themeMode = ThemeMode.system,\n    this.language = AppLanguage.system,\n    this.palette = NovaPalette.classic,"),
              ("  ThemeMode themeMode;\n  NovaPalette palette;", "  ThemeMode themeMode;\n  AppLanguage language;\n  NovaPalette palette;"),
              ("        'themeMode': themeMode.name,\n        'palette': palette.name,", "        'themeMode': themeMode.name,\n        'language': language.storageValue,\n        'palette': palette.name,"),
              ("      themeMode: theme,\n      palette: palette,", "      themeMode: theme,\n      language: AppLanguageX.parse(json['language']),\n      palette: palette,"),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'missing anchor: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          dart_file='lib/app/state/app_controller.dart'
          rm .github/workflows/phase16-language-settings.yml
          git config user.name Sanskar
          git config user.email sanskarin@outlook.in
          git add "$dart_file"
          git add -u .github/workflows/phase16-language-settings.yml
          git commit -m "feat: persist app language preference"
          git pull --rebase origin main
          git push origin HEAD:main
