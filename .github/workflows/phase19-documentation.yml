              insert='''\n## Full Replay Archive privacy\n\nFull Replay Archive records a bounded local action sequence for newly started sessions. The active capture stores the validated opening game state plus move/Undo/continue/status events and elapsed action timing. It is local project data and is not uploaded, synchronized, analyzed, or sent to a remote AI service.\n\nSelecting **Copy full replay** writes a complete archive to the system clipboard only after the explicit user action. **Open from clipboard** reads clipboard text only after explicit action; manual text entry is also available. The app does not monitor the clipboard in the background. Platform clipboard history/synchronization is controlled by the operating system/browser.\n\nA shared replay can reveal game configuration, seed/RNG state, opening board, move directions, timing, and reconstructed score/board evolution. The JSON is not encrypted or signed. Share it only when you intend to share that gameplay information.\n\nOpening a replay is spectator-only. Imported archive text is validated and reconstructed in memory but is never installed as the live game and cannot import lifetime statistics, achievements, streaks, Daily history, settings, or per-mode records. Structural/deterministic validity is not proof of authorship.\n\n'''
