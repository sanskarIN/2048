# Phase 19 — Portable Full-Session Replay Archives

Date: **2026-08-15**

## Starting state

Phase 19 started from the completed Phase 18 candidate: bounded deterministic Expectimax plus solver benchmarks, 161/161 tests, Web/WASM green, and a full Android/Linux/Windows/macOS/unsigned-iOS hosted runtime matrix. The roadmap still listed full-session replay export/import as a non-blocking optional expansion beyond the existing bounded Undo-backed Move Replay.

The chosen Phase 19 design preserves the existing Move Replay rather than replacing it. Move Replay remains the lightweight current-game + retained-Undo spectator view. Full Replay Archive is a separate portable deterministic action protocol for sessions captured from their actual start.

## Full replay protocol

Added `lib/domain/replay_archive.dart` with:

- `ReplayEventKind.move`, `undo`, `continueAfterWin`, and `statusRefresh`;
- strict `ReplayEvent` parsing with bounded elapsed milliseconds and move-direction rules;
- `ReplayCapture.start(...)` for complete newly started sessions;
- `ReplayCapture.incomplete(...)` for legacy/restored/imported progress whose earlier actions do not exist locally;
- hard `ReplayCapture.maxEvents = 4096` safety bound;
- overflow state that stops further full-history recording without stopping normal gameplay;
- `ReplayArchive` format `nova2048.fullReplay`, version 1, maximum encoded length 1,000,000 characters;
- strict envelope/export-time/capture validation;
- `ReplayArchivePlayer` deterministic reconstruction and defensive spectator frames;
- legality checks for moves, Undo, continue-after-win, status refresh, and chronological event order;
- state equivalence checks that deliberately exclude external lifetime-best normalization from replay identity.

Portable export is allowed only when capture began at the session start and did not overflow. The encoder reconstructs the sequence before producing archive text. Imported archive JSON is user-editable; deterministic validation establishes self-consistency, not authorship, cryptographic authenticity, or anti-cheat proof.

## Deterministic replay timing

`GameEngine.move` now accepts optional `DateTime? now` and forwards it to status reconciliation. Existing callers remain compatible. Replay reconstruction derives each event timestamp from `initialState.startedAt + elapsedMilliseconds` and supplies that original event time to engine move/status rules. This prevents Time Challenge replay from depending on the spectator device's current clock.

## Replay capture persistence and controller integration

`LocalStore` now owns `nova.replay_capture.v1` with save/load/clear behavior. Malformed capture persistence is removed safely. Corrupt current-game recovery removes associated replay metadata, and `clearGame` / `clearAll` remove the capture.

`AppController` now:

- starts a complete capture on every fresh `newGame`;
- records successful moves with direction/time;
- records valid Undo actions;
- records explicit continue-after-win;
- records status-only timed transitions;
- saves replay capture with session persistence;
- restores only a capture that belongs to the current session and deterministically reconstructs consistently;
- falls back to incomplete capture when valid current progress exists without trustworthy complete replay metadata;
- creates incomplete capture for Game Backup imports;
- clears replay state with the current game/all data.

An overflowed capture may represent only the valid recorded prefix, so startup does not require its last captured frame to equal later live progress. It remains non-exportable.

## Full Replay Archive UI

Added `lib/features/replay/replay_archive_screen.dart`:

- complete/incomplete/overflow/no-capture status explanation;
- Copy full replay, enabled only for complete exportable capture;
- explicit Open from clipboard;
- manual replay-text entry alternative;
- strict archive validation with failure feedback;
- in-memory imported spectator frames;
- first/previous/next/latest navigation;
- slider scrubbing;
- play/pause;
- 1/2/4 frames per second;
- score/move/highest/frame metrics;
- explicit imported-spectator label;
- return from imported replay to current replay;
- event count / 4096 disclosure;
- reduced-motion board behavior.

Move Replay links to the Full Replay Archive workspace in both normal and no-live-game states. Therefore a user can open a received replay without first creating a player game.

Imported spectator replay never calls a player-state import path and never becomes trusted progress.

## English/Hindi localization

Added Hindi strings for Full Replay Archive title/navigation, complete/incomplete/overflow status, copy/clipboard/manual-open actions, spectator labels, validation failures, Guide content, privacy copy, and About release highlights. Added two focused catalog tests plus a Hindi archive-screen widget test.

