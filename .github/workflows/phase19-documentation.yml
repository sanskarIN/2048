name: Phase 19 documentation updates

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase19-documentation.yml'

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure commit identity
        run: |
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"

      - name: Update project overview
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('README.md'); t=p.read_text()
          t=t.replace('a read-only bounded Move Replay, an isolated deterministic Auto Play / AI Demonstration sandbox,', 'a read-only bounded Move Replay, portable spectator-only Full Replay Archives, an isolated deterministic Auto Play / AI Demonstration sandbox,')
          marker='- Read-only Move Replay using validated bounded Undo history, with defensive copies, scrub/step/playback controls, and no player-state mutation.\n'
          add=marker+'- Portable spectator-only Full Replay Archives using a versioned deterministic action protocol, strict reconstruction validation, explicit clipboard/manual import, and a 4,096-event safety bound.\n'
          if marker in t and '4,096-event safety bound' not in t: t=t.replace(marker,add,1)
          if '## Full Replay Archive' not in t:
              t += '''\n\n## Full Replay Archive\n\nA newly started local game records a bounded deterministic replay action stream from its opening state. Complete captures can be copied as versioned `nova2048.fullReplay` JSON and opened later from clipboard or manual text in spectator mode. Recorded actions include valid moves, Undo, explicit continue-after-win, and timed status transitions; replay reconstruction supplies the recorded event time to the engine so timed modes do not depend on the spectator device clock.\n\nFull replay capture is capped at **4,096 events**. When that safety bound is reached the normal game continues, but portable full-session export is disabled rather than silently claiming a truncated archive is complete. Legacy/restored/Game Backup sessions that did not start with full capture remain playable but are marked incomplete for full-session export.\n\nImported replay archives never replace the live game and cannot import statistics, achievements, streaks, Daily results, per-mode records, settings, or trusted progress. The JSON is user-editable: strict validation proves deterministic self-consistency, not authorship or anti-cheat authenticity. See [`docs/REPLAY_ARCHIVES.md`](docs/REPLAY_ARCHIVES.md).\n'''
          p.write_text(t)
          PY
          git add README.md && git commit -m "docs: add full replay archives to project overview"

      - name: Update architecture
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('docs/ARCHITECTURE.md'); t=p.read_text()
          t=t.replace('- `replay_timeline.dart` — read-only timeline builder that filters current-session Undo snapshots, removes impossible/future frames, orders retained moves, and returns defensive unmodifiable copies plus the authoritative current frame.\n', '- `replay_timeline.dart` — read-only bounded Move Replay timeline builder that filters current-session Undo snapshots, removes impossible/future frames, orders retained moves, and returns defensive unmodifiable copies plus the authoritative current frame.\n- `replay_archive.dart` — versioned full-session replay event model, strict portable JSON codec, deterministic reconstruction player, event/time validation, and spectator-state equivalence checks.\n')
          t=t.replace('- current-game unranked marker.\n', '- current-game unranked marker;\n- bounded in-progress full-session replay capture.\n')
          t=t.replace('Replay deliberately adds **no new persistence format or key**. It reads already-validated bounded Undo history and the current saved game, then creates defensive display copies through `ReplayTimeline`.\n', 'Bounded **Move Replay** adds no persistence key; it reads already-validated Undo history and the current saved game, then creates defensive display copies through `ReplayTimeline`. **Full Replay Archive** is a separate feature and uses the project-owned `nova.replay_capture.v1` key for the active bounded deterministic action capture. Portable archive text itself is not stored as an imported player record.\n')
          t=t.replace('- imported-current-game unranked policy.\n', '- imported-current-game unranked policy;\n- current full-session replay capture creation, persistence, repair, and action recording.\n')
          old='The Replay feature snapshots the current controller game, loads existing persisted Undo history, delegates filtering/copying to `ReplayTimeline`, and renders a spectator-only timeline. It offers scrub, first/previous/next/latest, play/pause, and 1/2/4-frame-per-second controls. It never calls player move, Undo, statistics, achievement, or Daily-history mutation methods.\n'
          new=old+'\nThe Full Replay Archive feature reads the controller-owned bounded capture for export, validates portable archive text through `ReplayArchive`, reconstructs defensive spectator frames with `ReplayArchivePlayer`, and offers clipboard/manual open plus scrub/step/playback controls. Imported replay frames stay in feature memory and are never installed as `AppController.game`.\n'
          if old in t and 'Full Replay Archive feature reads' not in t: t=t.replace(old,new,1)
          if '## Full Replay Archive boundary' not in t:
              t += '''\n\n## Full Replay Archive boundary\n\nFull Replay Archive intentionally does **not** extend trusted player progress. A fresh `AppController.newGame()` creates `ReplayCapture.start(game)`. Valid moves, Undo, continue-after-win, and status-only timed transitions append compact events with elapsed milliseconds. `LocalStore` persists the active capture under `nova.replay_capture.v1`; it is removed with the current game/clear-all and malformed data is discarded during safe recovery.\n\nOn startup a stored capture must belong to the current session and reconstruct consistently through `ReplayArchivePlayer`. If replay metadata is missing, malformed, or mismatched while the current game itself is valid, the game is preserved and replay capture falls back to an incomplete local capture rather than trusting unrelated history. Imported Game Backup progress is also incomplete by design because earlier sender actions are not available.\n\nPortable export requires `startsAtSessionStart == true` and `overflowed == false`. The action list is capped at 4,096 events; overflow disables complete export while gameplay continues. Portable decode validates format/version/export time, capture flags, event shape/order/times, move legality, Undo legality, continue-after-win state, timed status transitions, event count, and total encoded size.\n\nOpening an archive constructs defensive spectator frames only. It never calls the controller's move/import/statistics APIs and cannot update saves, achievements, streaks, Daily history, or per-mode records. Because JSON is editable, the format is deterministic validation—not proof of authorship. See [`REPLAY_ARCHIVES.md`](REPLAY_ARCHIVES.md).\n'''
          p.write_text(t)
          PY
          git add docs/ARCHITECTURE.md && git commit -m "docs: define full replay archive architecture"

