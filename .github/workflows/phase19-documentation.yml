          new='''## Replay changes\n\nBoth replay systems are spectator-only. Bounded Move Replay must continue to use defensive copies and reject stale/future Undo snapshots; its controls must never call player mutation methods such as `move()` or `undo()`. Because Undo storage is bounded, do not advertise Move Replay as guaranteed complete from move zero.\n\nFull Replay Archive is a separate portable protocol. Changes must preserve:\n\n- explicit archive format/versioning and pre-parse size bounds;\n- strict `GameState` reuse for the opening state;\n- deterministic event ordering/timing and action legality validation;\n- replay-time injection for timed rules rather than spectator wall-clock dependence;\n- a hard 4,096-event capture bound;\n- complete-vs-incomplete capture semantics without inventing legacy history;\n- corruption-safe persistence under the project-owned replay-capture key;\n- spectator-only imported archives that never replace `AppController.game`;\n- no trusted statistics/achievement/streak/Daily/per-mode mutation from portable replay text;\n- documentation that JSON validity is not authorship/authentication.\n\nPure protocol/player changes belong in `lib/domain/replay_archive.dart`; active capture orchestration belongs in `AppController`/`LocalStore`; UI belongs in `lib/features/replay/`. Clipboard access must continue through `TextClipboard`. Add protocol, persistence/controller, UI, navigation, and localization regressions when behavior changes. See [`REPLAY_ARCHIVES.md`](REPLAY_ARCHIVES.md).\n'''
