          section='''\n\n## Full Replay Archive\n\nFrom Move Replay you can open **Full Replay Archive** even when no live game is available, which allows a received portable replay to be opened without replacing player progress.\n\nFor a game started after full-session capture support is active, the archive records the opening state plus deterministic valid moves, Undo actions, explicit continue-after-win actions, and timed status-only transitions. Choose **Copy full replay** to place a complete `nova2048.fullReplay` JSON archive on the clipboard. Use **Open from clipboard** or **Enter replay text** to view another archive.\n\nImported archives are spectator-only. You can scrub, step, play/pause, jump to ends, and choose 1/2/4 frames per second, but the imported board never becomes your live game and cannot update statistics, achievements, streaks, Daily results, or per-mode records.\n\nCapture is capped at 4,096 events. If a session reaches the cap, gameplay continues but complete export is disabled. Legacy games or Game Backup sessions whose earlier actions were never recorded are also not falsely exported as full sessions.\n\nReplay JSON is editable and not signed, so a valid archive means the sequence reconstructs consistently—not that the app has authenticated who played it. See [`REPLAY_ARCHIVES.md`](REPLAY_ARCHIVES.md).\n'''
