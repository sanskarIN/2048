              t=t.replace(row,row+'| `nova.replay_capture.v1` | JSON string | Bounded deterministic replay capture for the active session. |\n',1)
          t=t.replace('- the unranked-import marker is removed;\n', '- the unranked-import marker is removed;\n- the associated replay capture is removed;\n')
          t=t.replace('- current-game unranked marker.\n\nIt does not erase', '- current-game unranked marker;\n- current-session replay capture.\n\nIt does not erase')
          t=t.replace('`clearAll()` removes only the seven project-owned keys listed above.', '`clearAll()` removes only the eight project-owned keys listed above.')
          old='- **Move Replay** adds no persistence key. It builds defensive display frames from the current game and validated Undo history.\n'
          new=old+'- **Full Replay Archive** uses `nova.replay_capture.v1` only for the active bounded capture. Portable imported archive text is spectator-only and is not written as player progress. Malformed/mismatched replay capture is discarded or downgraded to incomplete capture while preserving a separately valid current game.\n'
          if old in t and 'Full Replay Archive** uses `nova.replay_capture.v1`' not in t: t=t.replace(old,new,1)
          if '## Full-session replay capture' not in t:
              t += '''\n\n## Full-session replay capture\n\n`nova.replay_capture.v1` stores the active `ReplayCapture` JSON: a copied initial game state, `startsAtSessionStart`, `overflowed`, and at most 4,096 ordered replay events. Events record elapsed milliseconds plus the action kind and, for moves, direction. The capture is saved with player-session persistence so a complete newly started replay can survive restart without storing a full board snapshot for every move.\n\nLegacy/restored sessions can receive an incomplete capture so later replay-related code remains safe without inventing missing earlier actions. A Game Backup import always receives an incomplete capture. Incomplete or overflowed captures cannot be encoded as portable full-session archives.\n\nReplay capture belongs to the current game lifecycle: corrupt current-game recovery, Reset Current Game, and Clear All remove it. Clearing statistics or achievements does not erase a valid active replay capture because those resets do not replace the active board.\n\nPortable replay JSON is separate from this preference key: opening imported replay text is a spectator-only in-memory operation and does not install that external capture as trusted current game data.\n'''
          t=t.replace('Challenge Code and Game Backup clipboard access happens only after explicit user actions.', 'Challenge Code, Game Backup, and Full Replay Archive clipboard access happens only after explicit user actions.')
          p.write_text(t)
          PY
          git add docs/DATA_STORAGE.md && git commit -m "docs: document replay capture persistence"

      - name: Update privacy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('docs/PRIVACY.md'); t=p.read_text()
          t=t.replace('- a boolean marker indicating whether the current game was restored from a portable backup and must remain unranked.\n', '- a boolean marker indicating whether the current game was restored from a portable backup and must remain unranked;\n- a bounded deterministic replay capture for the active session.\n')
