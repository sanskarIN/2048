          git add docs/RELEASE_CHECKLIST.md && git commit -m "docs: add Phase 19 replay release checks"

      - name: Update platform guide
        run: |
          cat >> docs/PLATFORMS.md <<'EOF'

## Full Replay Archive platform behavior

Full Replay Archive uses Flutter's clipboard through the existing `TextClipboard` abstraction. **Copy full replay** writes only after explicit action; **Open from clipboard** reads only after explicit action; manual text entry remains available when clipboard access is restricted. Browser/OS clipboard permission, history, cross-device synchronization, and maximum practical clipboard sizes differ by environment and therefore remain manual platform checks.

Replay reconstruction itself is local Dart/Flutter logic and requires no project server. Hosted compilation can verify that the runtime source builds for configured targets, but it cannot establish real-device responsiveness for long valid captures, platform clipboard UX, screen-reader behavior, or timer cleanup after lifecycle transitions. Those checks remain in `RELEASE_CHECKLIST.md`.
EOF
          git add docs/PLATFORMS.md && git commit -m "docs: document replay archive platform behavior"

      - name: Update CI guide
        run: |
          cat >> docs/CI_CD.md <<'EOF'

## Phase 19 replay archive gate scope

The permanent CI gate now includes full-session replay protocol, persistence/controller capture, spectator UI/navigation, and Hindi localization tests in addition to all previous regressions. Replay archive changes remain subject to the same formatter → analyzer → full tests → Web release sequence. Runtime `lib/**` changes also trigger the permanent native Platform Builds matrix according to its path filters.

A green hosted gate proves the tested archive code parses/reconstructs the covered deterministic sequences and compiles on configured targets. It does not prove real platform clipboard behavior, long-session performance, assistive-technology quality, lifecycle timer behavior, signing, or store acceptance.
EOF
          git add docs/CI_CD.md && git commit -m "docs: document Phase 19 CI scope"

      - name: Update backup trust documentation
        run: |
          cat >> docs/BACKUP_AND_RESTORE.md <<'EOF'

## Interaction with Full Replay Archive

A Game Backup restores current progress but does not contain the sender's earlier action history. Therefore `AppController.importGameBackup()` creates an **incomplete** local replay capture for the restored board. The imported game remains playable/unranked and can continue saving/Undo normally, but it cannot be exported later as though 2048 Nova had captured the sender's complete session from move zero.

Starting a fresh local game after backup restore creates a new complete replay capture for that new session. Opening a portable Full Replay Archive is different again: it is spectator-only and never installs current-game progress at all.
EOF
          git add docs/BACKUP_AND_RESTORE.md && git commit -m "docs: separate backup progress from full replay capture"

