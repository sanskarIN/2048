      - name: Update FAQ
        run: |
          cat >> docs/FAQ.md <<'EOF'

## What is Full Replay Archive?

Full Replay Archive is the portable spectator replay system. A newly started session records a bounded deterministic action stream from its opening state. A complete capture can be copied as versioned JSON and opened later without replacing the current game.

It is different from Move Replay: Move Replay reuses the latest retained Undo snapshots and can therefore start after move zero, while Full Replay Archive can represent the whole newly recorded session even after old gameplay Undo snapshots have fallen out of the 50-snapshot Undo window.

## Can an imported Full Replay Archive change my score or records?

No. Opening an archive builds spectator frames in memory. It does not install a game, import statistics, unlock achievements, change streaks, write Daily history, or improve per-mode records.

## Why is Copy full replay disabled?

Portable full-session export requires a capture that began with the session and did not exceed the safety limit. Legacy/restored/Game Backup progress does not contain earlier unrecorded actions, so it is marked incomplete. A session that exceeds 4,096 recorded events is marked overflowed. In either case the game remains playable, but the app will not mislabel partial history as a complete replay.

## Are Full Replay Archives signed or proof that someone achieved a score?

No. The archive is validated for structure and deterministic self-consistency, but JSON is editable. It is not a digital signature, identity proof, anti-cheat record, or trusted leaderboard submission.

## What information can a replay archive reveal?

A shared archive can expose game configuration, seed/RNG state, opening board, move/Undo/continue/status actions, action timing, and the score/board sequence reconstructed from them. The project does not upload that data automatically; clipboard/manual sharing is an explicit user action.
EOF
          git add docs/FAQ.md && git commit -m "docs: answer full replay archive questions"

      - name: Update troubleshooting
        run: |
          cat >> docs/TROUBLESHOOTING.md <<'EOF'

## Copy full replay is disabled

A portable full-session replay is available only when capture started with the current game and has not overflowed its 4,096-event bound. Legacy saves and Game Backup imports do not contain the missing earlier actions, so their replay capture is intentionally incomplete. Start a new local game to create a complete capture from move zero.

If the current session exceeded 4,096 replay events, normal gameplay continues but export stays disabled rather than producing an incomplete archive labeled as complete.

## Full Replay Archive import is rejected

A replay archive must be valid JSON with format `nova2048.fullReplay`, version `1`, a valid export timestamp, a complete non-overflowed capture, no more than 4,096 events, and a valid `GameState` opening state. Event times must be ordered and bounded; move/Undo/win-continuation/status-refresh actions must be legal when deterministically reconstructed.

A Challenge Code or Game Backup is a different portable format and cannot be opened as a replay archive. See [`REPLAY_ARCHIVES.md`](REPLAY_ARCHIVES.md).

## Opening a replay did not create a playable game

That is intentional. Portable replay import is spectator-only. Use Challenge Codes to start a fresh shared configuration or Game Backup to restore editable progress (which becomes unranked).

## A timed replay diverges from the original status

Version 1 records elapsed event timing and supplies it to the engine during reconstruction. If a development change causes divergence, inspect `GameEngine.move(..., now:)`, `refreshStatus(..., now:)`, replay event ordering, and capture persistence. Do not “fix” replay by using the viewer's current clock.
EOF
          git add docs/TROUBLESHOOTING.md && git commit -m "docs: add full replay archive troubleshooting"

      - name: Update security policy
        run: |
          cat >> SECURITY.md <<'EOF'

## Full Replay Archive input boundary

Portable Full Replay Archive JSON is untrusted user-editable input. The decoder enforces a maximum encoded length, exact format/version, export timestamp, strict opening `GameState`, complete/non-overflowed capture flags, a maximum of 4,096 events, event type/direction/time validation, nondecreasing elapsed time, and deterministic action reconstruction. Invalid moves, impossible Undo, invalid continue-after-win, and redundant/invalid status-refresh actions fail closed.

Replay import is spectator-only and does not call the current-game import path. A structurally valid replay cannot assert trusted lifetime statistics, achievements, streaks, Daily history, or per-mode records. The format is not encrypted, signed, or authenticated; deterministic consistency does not establish player identity or anti-cheat authenticity.

Full Replay Archive uses the same explicit `TextClipboard` boundary as Challenge Codes and Game Backup. Copy/open reads or writes clipboard text only after user action. The platform may independently retain or synchronize clipboard history, so replay text should be treated as shareable gameplay data rather than a secret-storage mechanism.
EOF
          git add SECURITY.md && git commit -m "docs: define full replay archive security boundary"

