name: Bootstrap Flutter Platforms

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-platforms.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: false

      - name: Generate platform runners
        run: >-
          flutter create .
          --platforms=android,ios,linux,macos,windows
          --project-name=nova_2048
          --org=com.sanskarin

      - name: Commit generated platform files
        run: |
          git add android ios linux macos windows .metadata .gitignore
          if git diff --cached --quiet; then
            echo "No platform runner changes were required."
            exit 0
          fi
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
          git commit -m "build: generate Flutter platform runners"
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin main
          git push origin HEAD:main
