name: Phase 21 product copy

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/phase21-product-copy.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply localized product copy and focused tests
        run: python3 tool/phase21_product_copy.py
      - name: Push Phase 21 product-copy commits
        run: git push origin main
      - name: Remove temporary product-copy tools
        run: |
          git reset --hard HEAD
          git rm tool/phase21_product_copy.py .github/workflows/phase21-product-copy.yml
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
          git commit -m "chore: remove Phase 21 product-copy tools"
          git push origin main
