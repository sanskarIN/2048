name: Format Dart

on:
  push:
    branches: [main]
    paths:
      - lib/**
      - test/**
      - tool/**
      - .github/workflows/format-code.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: format-dart-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: false

      - name: Install dependencies
        run: flutter pub get

      - name: Format Dart sources, tests, and tools
        run: dart format lib test tool

      - name: Finalize Phase 31 continuity when helper is present
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f tool/phase31_finalize.py ]]; then
            python3 tool/phase31_finalize.py
            rm -f tool/phase31_finalize.py .github/workflows/phase31-finalize.yml docs/PHASE_31_STATUS_TRIGGER.md
            git show HEAD^:.github/workflows/format-code.yml > .github/workflows/format-code.yml
          fi

      - name: Commit formatting and one-shot finalization changes
        shell: bash
        run: |
          set -euo pipefail
          git add lib test tool CHANGELOG.md docs what_changed.md .github/workflows/format-code.yml .github/workflows/phase31-finalize.yml
          if git diff --cached --quiet; then
            echo "No Dart formatting or Phase 31 finalization changes were required."
            exit 0
          fi
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
          git commit -m "chore: finalize Phase 31 continuity"
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin main
          git push origin HEAD:main
