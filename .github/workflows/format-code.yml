name: Format Dart

on:
  push:
    branches: [main]
    paths:
      - lib/**
      - test/**
      - tool/**
      - .github/workflows/format-code.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: format-dart-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: false

      - name: Install dependencies
        run: flutter pub get

      - name: Format Dart sources, tests, and tools
        run: dart format lib test tool

      - name: Commit formatting changes
        run: |
          git add lib test tool
          if git diff --cached --quiet; then
            echo "No Dart formatting changes were required."
          else
            git config user.name "Sanskar"
            git config user.email "sanskarin@outlook.in"
            git commit -m "style: format Dart sources tests and tools"
            git reset --hard HEAD
            git clean -fd
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Finalize Phase 30 hardening documentation and restore workflow
        shell: bash
        run: |
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin main

          python3 - <<'PY'
          from pathlib import Path
          import re

          def insert_after_once(path, marker, insertion, sentinel):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if sentinel in text:
                  return False
              if marker not in text:
                  raise SystemExit(f'marker not found in {path}: {marker!r}')
              file.write_text(text.replace(marker, marker + insertion, 1), encoding='utf-8')
              return True

          def append_once(path, heading, body):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if heading in text:
                  return False
              file.write_text(text.rstrip() + '\n\n' + body.strip() + '\n', encoding='utf-8')
              return True

          changed = False

          changed |= insert_after_once(
              'README.md',
              '| Qualification evidence recorder | [`docs/QUALIFICATION_RECORDER.md`](docs/QUALIFICATION_RECORDER.md) |',
              '\n| Repository integrity audit | [`docs/REPOSITORY_AUDIT.md`](docs/REPOSITORY_AUDIT.md) |',
              '| Repository integrity audit |',
          )

          changed |= insert_after_once(
              'docs/RELEASE_CHECKLIST.md',
              '- [x] `dart run tool/release_readiness.dart --json` validates candidate metadata/manifest structure',
              '\n- [x] `dart run tool/repository_audit.dart --json` validates required repository files, release-state consistency, temporary-workflow cleanup, and repository-local Markdown links',
              'tool/repository_audit.dart --json',
          )

          changed |= insert_after_once(
              'ROADMAP.md',
              '- Evidence-backed release qualification infrastructure: `docs/release_qualification.json`, `docs/RELEASE_QUALIFICATION.md`, and `tool/release_readiness.dart` keep normal release-candidate CI usable while making strict stable-release mode fail until every required real-world qualification item has recorded passed evidence and release metadata is actually `1.5.0`.',
              '\n- Permanent repository-integrity auditing now fails CI on required-file omissions, package/runtime/qualification version drift, known temporary maintenance files, and broken repository-local Markdown links without pretending external URL reachability or real-device qualification is automated.',
              'Permanent repository-integrity auditing now fails CI',
          )

          changelog = Path('CHANGELOG.md')
          changelog_text = changelog.read_text(encoding='utf-8')
          if '### Final repository hardening' not in changelog_text:
              marker = '## [Unreleased]'
              if marker not in changelog_text:
                  raise SystemExit('CHANGELOG.md is missing [Unreleased]')
              insertion = '''

### Final repository hardening

- Added permanent repository-integrity auditing for required files, package/runtime/qualification version drift, temporary maintenance files, and repository-local Markdown links.
- Added process-level audit fixtures and fixed stale Phase 29 current-state regression coverage after the continuity record advanced to Phase 30.
- Added `.editorconfig`, `.gitattributes`, GitHub funding metadata, and issue-template support/security routing.
- Kept the stable real-world qualification boundary at 0/13; no hosted build or automated test was converted into physical-device evidence.
'''
              changelog.write_text(changelog_text.replace(marker, marker + insertion, 1), encoding='utf-8')
              changed = True

          changed |= append_once(
              'docs/CI_CD.md',
              '## Repository integrity audit',
              '''
          ## Repository integrity audit

          Permanent CI runs `dart run tool/repository_audit.dart --json` after the release-candidate readiness check. The audit fails on required repository/open-source/release/workflow file omissions, package/runtime/qualification version drift, known temporary maintenance paths, and broken repository-local Markdown links. It is deterministic and offline: it does not crawl external websites and does not replace physical-device, accessibility, signing, or store qualification.

          The implementation is `tool/repository_audit.dart`, the maintenance contract is documented in `docs/REPOSITORY_AUDIT.md`, and process-level acceptance/rejection behavior is covered by `test/repository_audit_cli_test.dart`.
          ''',
          )

          changed |= append_once(
              'docs/TESTING.md',
              '## Repository audit regression coverage',
              '''
          ## Repository audit regression coverage

          `test/repository_audit_cli_test.dart` executes `tool/repository_audit.dart` against isolated temporary repository roots. Coverage includes a clean fixture, broken local Markdown link rejection, in-app/package version drift, qualification-candidate drift, forbidden temporary workflow rejection, and unclosed Markdown-fence warning behavior.

          `test/current_release_state_test.dart` also guards the permanent CI invocation and the Phase 30 continuity/qualification boundaries. A passing repository audit is source-controlled repository evidence only and is not a substitute for the 13 real-world manual qualification checks.
          ''',
          )

          changed |= append_once(
              'docs/DEVELOPMENT.md',
              '## Repository integrity before committing',
              '''
          ## Repository integrity before committing

          In addition to formatting, analysis, and tests, run `dart run tool/repository_audit.dart --json` before submitting documentation, release-metadata, workflow, or project-structure changes. Fix broken local links and release-state drift rather than weakening the audit. See `docs/REPOSITORY_AUDIT.md` for scope and limitations.
          ''',
          )

          changed |= append_once(
              'CONTRIBUTING.md',
              '## Repository integrity check',
              '''
          ## Repository integrity check

          Before opening a pull request that changes documentation, release metadata, workflows, or project structure, run `dart run tool/repository_audit.dart --json` from the repository root. Repair broken repository-local links and release-state drift instead of bypassing the check. External website availability and the manual 13-item real-world release qualification remain separate responsibilities.
          ''',
          )

          log = Path('what_changed.md')
          log_text = log.read_text(encoding='utf-8')
          final_heading = '### Phase 30 final repository hardening extension'
          if final_heading not in log_text:
              log_text = re.sub(
                  r'^- \*\*Current phase:\*\* Phase 30 —.*$',
                  '- **Current phase:** Phase 30 — guarded release-qualification evidence recording plus final repository-integrity/open-source hardening complete in source control; permanent CI now includes release-state/local-document auditing, the stale Phase 29 current-state regression is repaired, and open-source maintenance metadata is complete; the latest previously accepted full CI/native evidence remains the Phase 29 Version 1.5 baseline until a newer maintained workflow result is explicitly recorded; the stable qualification boundary remains 0/13 and GitHub issues #10 and #12 remain explicit',
                  log_text,
                  count=1,
                  flags=re.MULTILINE,
              )
              entry = '''

### Phase 30 final repository hardening extension

The final source-controlled audit found and repaired a stale regression assertion that still expected Phase 29 after the continuity header had advanced to Phase 30. The pass then added `tool/repository_audit.dart`, process-level audit fixtures, permanent CI wiring, `docs/REPOSITORY_AUDIT.md`, cross-editor `.editorconfig`, `.gitattributes`, GitHub funding metadata, and issue-template support/security routing.

The repository audit fails closed on required-file omissions, package/runtime/qualification version drift, known temporary Phase 30/31 maintenance leftovers, and broken repository-local Markdown destinations. It remains deterministic/offline and does not claim to verify external website availability.

The permanent Format Dart workflow produced commit `09325af9e4095e9b5be9b6dcd6474f0440dbc73f` for the new audit/test Dart sources. No newer complete CI/native result is recorded here because direct-push workflow runs were not retrievable through the connected workflow lookup during this maintenance pass; Phase 29 therefore remains the latest explicitly accepted full automated/native evidence rather than fabricating a green result.

The Android namespace/application ID remains `com.sanskarin.nova_2048` because its Gradle namespace, application ID, Kotlin package, and manifest activity resolution are internally consistent. Renaming it during final hardening would change application identity/update semantics without fixing a demonstrated runtime defect.

The manual stable-release boundary remains 0/13. AGP issue #10 and repository-protection issue #12 remain explicit external/toolchain tasks; no automation evidence was substituted for physical-device, assistive-technology, handler, long-session, signing/provisioning, branding-presentation, or store-distribution evidence.
'''
              log.write_text(log_text.rstrip() + entry + '\n', encoding='utf-8')
              changed = True

          print('Documentation finalization changed files:', changed)
          PY

          cat > .github/workflows/format-code.yml <<'EOF'
          name: Format Dart

          on:
            push:
              branches: [main]
              paths:
                - lib/**
                - test/**
                - tool/**
                - .github/workflows/format-code.yml
            workflow_dispatch:

          permissions:
            contents: write

          concurrency:
            group: format-dart-${{ github.ref }}
            cancel-in-progress: true

          jobs:
            format:
              if: github.actor != 'github-actions[bot]'
              runs-on: ubuntu-latest
              timeout-minutes: 15
              steps:
                - name: Checkout
                  uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
                  with:
                    fetch-depth: 0

                - name: Set up Flutter
                  uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
                  with:
                    channel: stable
                    flutter-version: 3.47.0
                    cache: false

                - name: Install dependencies
                  run: flutter pub get

                - name: Format Dart sources, tests, and tools
                  run: dart format lib test tool

                - name: Commit formatting changes
                  run: |
                    git add lib test tool
                    if git diff --cached --quiet; then
                      echo "No Dart formatting changes were required."
                      exit 0
                    fi
                    git config user.name "Sanskar"
                    git config user.email "sanskarin@outlook.in"
                    git commit -m "style: format Dart sources tests and tools"
                    git reset --hard HEAD
                    git clean -fd
                    git pull --rebase origin main
                    git push origin HEAD:main
          EOF

          git add README.md CHANGELOG.md ROADMAP.md CONTRIBUTING.md what_changed.md docs/CI_CD.md docs/TESTING.md docs/DEVELOPMENT.md docs/RELEASE_CHECKLIST.md .github/workflows/format-code.yml
          if git diff --cached --quiet; then
            echo "No final documentation changes were required."
            exit 0
          fi

          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
          git commit -m "docs: finalize phase 30 repository hardening"
          git pull --rebase origin main
          git push origin HEAD:main
