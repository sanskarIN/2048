name: Phase 17 parser correction

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/phase17-parser-fix.yml

permissions:
  contents: write

jobs:
  parser-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure commit identity
        run: |
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"

      - name: Restore per-mode record deserialization
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('lib/app/state/app_controller.dart')
          text = path.read_text()
          old = '''    if (stats.bestStreak < stats.currentStreak) {\n      stats.bestStreak = stats.currentStreak;\n    }\n    return stats;\n  }\n\n  static int _nonNegativeInt(Object? value) {\n'''
          new = '''    if (stats.bestStreak < stats.currentStreak) {\n      stats.bestStreak = stats.currentStreak;\n    }\n    final rawModeRecords = json['modeRecords'];\n    if (rawModeRecords is Map) {\n      for (final mode in GameMode.values) {\n        final rawRecord = rawModeRecords[mode.name];\n        if (rawRecord is! Map) continue;\n        final normalized = <String, Object?>{};\n        for (final entry in rawRecord.entries) {\n          final key = entry.key;\n          if (key is String) normalized[key] = entry.value;\n        }\n        final record = ModeRecord.fromJson(normalized);\n        if (record.hasProgress) stats.modeRecords[mode] = record;\n      }\n    }\n    return stats;\n  }\n\n  static int _nonNegativeInt(Object? value) {\n'''
          if text.count(old) != 1:
              raise SystemExit('PlayerStats deserialization marker not found exactly once')
          path.write_text(text.replace(old, new, 1))
          PY
          git add lib/app/state/app_controller.dart
          git commit -m "fix: restore per-mode record deserialization"

      - name: Remove temporary helper and push
        run: |
          git rm .github/workflows/phase17-parser-fix.yml
          git commit -m "chore: remove Phase 17 parser helper"
          git pull --rebase origin main
          git push origin HEAD:main
