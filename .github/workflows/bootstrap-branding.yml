name: Bootstrap Branding Assets

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-branding.yml
      - tool/branding-requirements.txt
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-branding-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install pinned image tooling
        run: >-
          python3 -m pip install
          --disable-pip-version-check
          --requirement tool/branding-requirements.txt

      - name: Generate platform branding exports
        shell: bash
        run: |
          python3 <<'PY'
          from io import BytesIO
          from pathlib import Path
          import glob
          import cairosvg
          from PIL import Image

          svg_path = Path('assets/branding/2048_nova_logo.svg')
          svg = svg_path.read_bytes()

          def render_png(path: str, width: int, height: int | None = None) -> None:
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              cairosvg.svg2png(
                  bytestring=svg,
                  write_to=str(target),
                  output_width=width,
                  output_height=height or width,
              )

          def replace_template_pngs(pattern: str) -> None:
              for path in glob.glob(pattern):
                  with Image.open(path) as current:
                      width, height = current.size
                  render_png(path, width, height)

          replace_template_pngs('android/app/src/main/res/mipmap-*/ic_launcher.png')
          replace_template_pngs('ios/Runner/Assets.xcassets/AppIcon.appiconset/*.png')
          replace_template_pngs('ios/Runner/Assets.xcassets/LaunchImage.imageset/*.png')
          replace_template_pngs('macos/Runner/Assets.xcassets/AppIcon.appiconset/*.png')

          buffer = BytesIO()
          cairosvg.svg2png(
              bytestring=svg,
              write_to=buffer,
              output_width=256,
              output_height=256,
          )
          buffer.seek(0)
          image = Image.open(buffer).convert('RGBA')
          Path('windows/runner/resources').mkdir(parents=True, exist_ok=True)
          image.save(
              'windows/runner/resources/app_icon.ico',
              format='ICO',
              sizes=[(16, 16), (24, 24), (32, 32), (48, 48), (64, 64), (128, 128), (256, 256)],
          )

          render_png('web/icons/Icon-192.png', 192)
          render_png('web/icons/Icon-512.png', 512)
          render_png('web/icons/Icon-maskable-192.png', 192)
          render_png('web/icons/Icon-maskable-512.png', 512)
          render_png('web/favicon.png', 64)
          render_png('assets/branding/2048_nova_icon_1024.png', 1024)
          PY

      - name: Commit generated branding assets
        run: |
          git add android/app/src/main/res/mipmap-* \
                  ios/Runner/Assets.xcassets/AppIcon.appiconset \
                  ios/Runner/Assets.xcassets/LaunchImage.imageset \
                  macos/Runner/Assets.xcassets/AppIcon.appiconset \
                  windows/runner/resources/app_icon.ico \
                  web/icons web/favicon.png \
                  assets/branding/2048_nova_icon_1024.png
          if git diff --cached --quiet; then
            echo "No branding asset changes were required."
            exit 0
          fi
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
          git commit -m "feat: export branded platform icons and splash assets"
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin main
          git push origin HEAD:main
