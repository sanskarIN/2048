name: Diagnose Phase 14 Tests

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-phase14-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase14-groups:
    name: ${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: backup-codec
            command: flutter test test/game_backup_test.dart
          - group: imported-policy
            command: flutter test test/imported_game_policy_test.dart
          - group: backup-screen
            command: flutter test test/game_backup_screen_test.dart
          - group: unranked-marker
            command: flutter test test/unranked_marker_test.dart
          - group: pre-phase14-baseline
            command: "flutter test $(find test -maxdepth 1 -name '*.dart' ! -name 'game_backup_test.dart' ! -name 'imported_game_policy_test.dart' ! -name 'game_backup_screen_test.dart' ! -name 'unranked_marker_test.dart' -print | sort)"
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Run group
        shell: bash
        run: ${{ matrix.command }}
