name: Phase 20 localization and lock integration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase20-integrate.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure commit identity
        run: |
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"

      - name: Add Hindi file-backup translations
        env:
          BLOCK_B64: ""
        run: |
          echo "$BLOCK_B64" | base64 --decode > /tmp/phase20_hi.txt
          python3 -c 'from pathlib import Path; p=Path("lib/core/localization/hindi_translations.dart"); t=p.read_text(); b=Path("/tmp/phase20_hi.txt").read_text(); i=t.rfind("};"); p.write_text(t if "Save backup file" in t else t[:i]+b+t[i:])'
          git add lib/core/localization/hindi_translations.dart
          if ! git diff --cached --quiet; then git commit -m "feat: localize file-based Game Backup"; fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Lock dependencies
        run: |
          flutter pub get
          git add pubspec.lock
          if ! git diff --cached --quiet; then git commit -m "build: lock file picker dependency"; fi

      - name: Remove helper and push
        run: |
          git rm .github/workflows/phase20-integrate.yml
          git commit -m "chore: remove Phase 20 integration helper"
          git pull --rebase origin main
          git push origin HEAD:main
