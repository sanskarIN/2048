org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Keep Flutter's legacy AGP DSL compatibility while plugins finish migrating.
android.newDsl=false
# Flutter 3.47 + AGP 9 use built-in Kotlin. This also allows AGP-9-aware
# plugins that intentionally skip the legacy kotlin-android plugin to compile
# their Kotlin sources instead of disappearing from plugin registration.
android.builtInKotlin=true